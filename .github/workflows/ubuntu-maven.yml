# Builds the Linux version exactly as the release does (the Debian package variant wraps the tuxguitar-linux-swt bundle) and runs the tests of its
# modules. Only when asked (Actions > Run workflow): a push does not start it.

name: Ubuntu Java CI with Maven

on:
  workflow_dispatch:

permissions:
  contents: read

# a second run of the same workflow on the same branch replaces the first one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip git build-essential fakeroot default-jdk maven libwebkit2gtk-4.1-0 libfluidsynth-dev libjack-jackd2-dev libasound2-dev liblilv-dev libsuil-dev qtbase5-dev
    - name: Install SWT
      uses: ./.github/actions/install-swt
      with:
        platform: linux
    - name: Build with Maven
      run: cd desktop/build-scripts/tuxguitar-linux-swt-deb && mvn -B --no-transfer-progress -e clean verify -P native-modules
    - uses: actions/upload-artifact@v7
      with:
        name: Package-Ubuntu
        path: desktop/build-scripts/tuxguitar-linux-swt-deb/target/tuxguitar-9.99-SNAPSHOT-linux-swt.deb
        retention-days: 1
