# Runs the native SWT (graphical) tests of the practice module on a macOS runner. They need a window server, so they are excluded from the
# default build (group "swt-gui") and run here with the profile swt-gui-tests. Started by hand (Actions > Practice GUI tests > Run workflow)
# until a first run on the hosted runners has shown that they are stable.

name: Practice GUI tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-tests:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Install SWT
      uses: ./.github/actions/install-swt
      with:
        platform: macos
    # spec 020 T029: what the machine has for a screen, to read a picture that failed
    - name: Displays of the machine
      run: |
        system_profiler SPDisplaysDataType || true
        defaults read /Library/Preferences/com.apple.windowserver.displays 2>/dev/null | head -60 || true
        echo "TMPDIR=$TMPDIR"
    - name: SWT tests of the practice module
      run: cd desktop/build-scripts/tuxguitar-macosx-swt-cocoa && mvn -B --no-transfer-progress -e test -P swt-gui-tests -pl ../../TuxGuitar-practice -am -Dtest='*SwtTest' -Dsurefire.failIfNoSpecifiedTests=false
    # the pixel tests save the picture that failed in the Java temporary folder (PaintedAlignment.check)
    - name: Collect the pictures and reports
      if: always()
      run: |
        mkdir -p "$RUNNER_TEMP/diagnostics"
        cp -R "$TMPDIR/arcade-pixels" "$RUNNER_TEMP/diagnostics/" 2>/dev/null || echo "no picture saved"
        cp -R desktop/TuxGuitar-practice/target/surefire-reports "$RUNNER_TEMP/diagnostics/" 2>/dev/null || echo "no surefire reports"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: practice-gui-diagnostics
        path: ${{ runner.temp }}/diagnostics
        if-no-files-found: warn
        retention-days: 7
