# Builds TuxGuitarAdvanced for macOS (Apple Silicon), Windows and Linux, one after the other, and publishes
# the packages as a GitHub Release. Each platform is built only if the one before succeeded (a macOS minute
# counts ten times and a Windows minute twice on a private repository: a failure stops the chain early).
#
# Trigger: only by hand (Actions > Release > Run workflow), giving the tag such as v1.0.0:
# a push or a tag push starts nothing.
#
# Notes:
#  - All three packages include the Interactive Practice modules (audio-engine, tuner-next,
#    practice). macOS arm64 embeds a Temurin 21 JRE in the .app (the build itself does not do it).
#  - Linux uses the Debian variant of the SWT build (it wraps the tuxguitar-linux-swt bundle): the same build gives the
#    tar.gz and the .deb (amd64). Windows uses the SWT build script of the same name.
#  - The Windows build is cross-compiled on Linux with Mingw-w64 and does not
#    embed a JRE: Java 17+ must be installed on the target machine.
#  - The macOS launcher is signed with a stable self-signed certificate when the secrets
#    MACOS_CERT_P12_BASE64 / MACOS_CERT_PASSWORD exist (ad hoc otherwise). The packages are
#    not notarized: the first launch still needs "Open Anyway" in System Settings.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write   # create the draft release and attach the packages

# one run per tag at a time; a second one waits instead of racing the first on the same draft release
concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  TG_VERSION: '9.99-SNAPSHOT'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # The packages are attached to a draft release straight from each build job: no intermediate
  # artifact storage (its quota was hit), the draft is published once all builds succeeded.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # hand-written notes (docs/release-notes/<tag>.md) when they exist, generated notes otherwise
          if [ -f "docs/release-notes/${RELEASE_TAG}.md" ]; then NOTES="--notes-file docs/release-notes/${RELEASE_TAG}.md"; else NOTES="--generate-notes"; fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "TuxGuitarAdvanced $RELEASE_TAG" $NOTES

  build-macos-arm64:
    needs: create-release
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: aarch64
          cache: maven
      - name: Install SWT
        uses: ./.github/actions/install-swt
        with:
          platform: macos
      - name: Build
        run: cd desktop/build-scripts/tuxguitar-macosx-swt-cocoa && mvn -B --no-transfer-progress -e clean verify -P native-modules -DskipTests
      - name: Embed the JRE
        run: |
          cd desktop/build-scripts/tuxguitar-macosx-swt-cocoa/target
          cp -R "$JAVA_HOME" "tuxguitar-${TG_VERSION}-macosx-swt-cocoa.app/Contents/MacOS/jre"
      - name: Sign the launcher (stable self-signed certificate, if the secrets exist)
        timeout-minutes: 10
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: .github/scripts/sign-macos-launcher.sh "desktop/build-scripts/tuxguitar-macosx-swt-cocoa/target/tuxguitar-${TG_VERSION}-macosx-swt-cocoa.app"
      - name: Zip the app
        run: |
          cd desktop/build-scripts/tuxguitar-macosx-swt-cocoa/target
          # the app bundle carries the product name (it is also the top-level folder of the zip)
          mv "tuxguitar-${TG_VERSION}-macosx-swt-cocoa.app" TuxGuitarAdvanced.app
          ditto -c -k --sequesterRsrc --keepParent TuxGuitarAdvanced.app "$GITHUB_WORKSPACE/TuxGuitarAdvanced-${RELEASE_TAG}-macos-arm64.zip"
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TuxGuitarAdvanced-*-macos-arm64.zip --repo "$GITHUB_REPOSITORY" --clobber

  build-linux:
    needs: build-windows   # Linux only if macOS and Windows succeeded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip git build-essential fakeroot libwebkit2gtk-4.1-0 libfluidsynth-dev libjack-jackd2-dev libasound2-dev liblilv-dev libsuil-dev qtbase5-dev
      - name: Install SWT
        uses: ./.github/actions/install-swt
        with:
          platform: linux
      # the Debian variant builds the tuxguitar-linux-swt bundle first, then wraps it in a .deb of the architecture of the runner (amd64)
      - name: Build
        run: cd desktop/build-scripts/tuxguitar-linux-swt-deb && mvn -B --no-transfer-progress -e clean verify -P native-modules -DskipTests
      - name: Package
        run: |
          cd desktop/build-scripts/tuxguitar-linux-swt/target
          # the top-level folder carries the product name
          mv "tuxguitar-${TG_VERSION}-linux-swt" TuxGuitarAdvanced
          tar -czf "$GITHUB_WORKSPACE/TuxGuitarAdvanced-${RELEASE_TAG}-linux-x86_64.tar.gz" TuxGuitarAdvanced
          cp "$GITHUB_WORKSPACE/desktop/build-scripts/tuxguitar-linux-swt-deb/target/tuxguitar-${TG_VERSION}-linux-swt.deb" "$GITHUB_WORKSPACE/TuxGuitarAdvanced-${RELEASE_TAG}-linux-amd64.deb"
          dpkg-deb --info "$GITHUB_WORKSPACE/TuxGuitarAdvanced-${RELEASE_TAG}-linux-amd64.deb" | grep -E "Package|Version|Architecture"
      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TuxGuitarAdvanced-*-linux-*.tar.gz TuxGuitarAdvanced-*-linux-*.deb --repo "$GITHUB_REPOSITORY" --clobber

  build-windows:
    needs: build-macos-arm64   # Windows only if macOS succeeded
    runs-on: ubuntu-latest   # cross-compiled with Mingw-w64
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip git gcc-mingw-w64-x86-64 g++-mingw-w64-i686-win32
      - name: Install SWT
        uses: ./.github/actions/install-swt
        with:
          platform: windows
      - name: Build
        run: cd desktop/build-scripts/tuxguitar-windows-swt-x86_64 && mvn -B --no-transfer-progress -e clean verify -P native-modules -P -platform-linux -P platform-windows -DskipTests
      - name: Package
        run: |
          cd desktop/build-scripts/tuxguitar-windows-swt-x86_64/target
          mv "tuxguitar-${TG_VERSION}-windows-swt-x86_64" TuxGuitarAdvanced
          zip -qr "$GITHUB_WORKSPACE/TuxGuitarAdvanced-${RELEASE_TAG}-windows-x86_64.zip" TuxGuitarAdvanced
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TuxGuitarAdvanced-*-windows-*.zip --repo "$GITHUB_REPOSITORY" --clobber

  release:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          # a tag with alpha, beta or rc in its name is published as a pre-release
          PRE=""
          case "$RELEASE_TAG" in *alpha*|*beta*|*rc*) PRE="--prerelease";; esac
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false $PRE
