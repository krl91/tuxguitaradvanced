# Builds TuxGuitarAdvanced for macOS (Apple Silicon), Linux and Windows and publishes
# the packages as a GitHub Release.
#
# Trigger: push a tag such as v1.0.0, or run the workflow manually
# (Actions > Release > Run workflow) and give the tag to create.
#
# Notes:
#  - All three packages include the Interactive Practice modules (audio-engine, tuner-next,
#    practice). macOS arm64 embeds a Temurin 21 JRE in the .app (the build itself does not do it).
#  - Linux and Windows use the SWT build scripts of the same name.
#  - The Windows build is cross-compiled on Linux with Mingw-w64 and does not
#    embed a JRE: Java 17+ must be installed on the target machine.
#  - The macOS launcher is signed with a stable self-signed certificate when the secrets
#    MACOS_CERT_P12_BASE64 / MACOS_CERT_PASSWORD exist (ad hoc otherwise). The packages are
#    not notarized: the first launch still needs "Open Anyway" in System Settings.

name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write   # create the draft release and attach the packages

env:
  SWT_VERSION: '4.37'
  SWT_DROP: 'R-4.37-202509050730'
  TG_VERSION: '9.99-SNAPSHOT'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # The packages are attached to a draft release straight from each build job: no intermediate
  # artifact storage (its quota was hit), the draft is published once all builds succeeded.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # hand-written notes (docs/release-notes/<tag>.md) when they exist, generated notes otherwise
          if [ -f "docs/release-notes/${RELEASE_TAG}.md" ]; then NOTES="--notes-file docs/release-notes/${RELEASE_TAG}.md"; else NOTES="--generate-notes"; fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "TuxGuitarAdvanced $RELEASE_TAG" $NOTES

  build-macos-arm64:
    needs: create-release
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: aarch64
          cache: maven
      - name: Download and install SWT (cocoa, aarch64)
        run: |
          curl -fL -o swt.zip "https://archive.eclipse.org/eclipse/downloads/drops4/${SWT_DROP}/swt-${SWT_VERSION}-cocoa-macosx-aarch64.zip"
          mkdir swt && cd swt && unzip -q ../swt.zip
          mvn -B install:install-file -Dfile=swt.jar -DgroupId=org.eclipse.swt -DartifactId=org.eclipse.swt.cocoa.macosx -Dpackaging=jar -Dversion=${SWT_VERSION}
      - name: Build
        run: cd desktop/build-scripts/tuxguitar-macosx-swt-cocoa && mvn -B -e clean verify -P native-modules -DskipTests
      - name: Embed the JRE
        run: |
          cd desktop/build-scripts/tuxguitar-macosx-swt-cocoa/target
          cp -R "$JAVA_HOME" "tuxguitar-${TG_VERSION}-macosx-swt-cocoa.app/Contents/MacOS/jre"
      - name: Sign the launcher (stable self-signed certificate, if the secrets exist)
        timeout-minutes: 10
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: .github/scripts/sign-macos-launcher.sh "desktop/build-scripts/tuxguitar-macosx-swt-cocoa/target/tuxguitar-${TG_VERSION}-macosx-swt-cocoa.app"
      - name: Zip the app
        run: |
          cd desktop/build-scripts/tuxguitar-macosx-swt-cocoa/target
          # the app bundle carries the product name (it is also the top-level folder of the zip)
          mv "tuxguitar-${TG_VERSION}-macosx-swt-cocoa.app" TuxGuitarAdvanced.app
          ditto -c -k --sequesterRsrc --keepParent TuxGuitarAdvanced.app "$GITHUB_WORKSPACE/TuxGuitarAdvanced-${RELEASE_TAG}-macos-arm64.zip"
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TuxGuitarAdvanced-*-macos-arm64.zip --repo "$GITHUB_REPOSITORY" --clobber

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip git build-essential libwebkit2gtk-4.1-0 libfluidsynth-dev libjack-jackd2-dev libasound2-dev liblilv-dev libsuil-dev qtbase5-dev
      - name: Download and install SWT (gtk, linux)
        run: |
          ARCH=$(uname -m)
          curl -fL -o swt.zip "https://archive.eclipse.org/eclipse/downloads/drops4/${SWT_DROP}/swt-${SWT_VERSION}-gtk-linux-${ARCH}.zip"
          mkdir swt && cd swt && unzip -q ../swt.zip
          mvn -B install:install-file -Dfile=swt.jar -DgroupId=org.eclipse.swt -DartifactId=org.eclipse.swt.gtk.linux -Dpackaging=jar -Dversion=${SWT_VERSION}
      - name: Build
        run: cd desktop/build-scripts/tuxguitar-linux-swt && mvn -B -e clean verify -P native-modules -DskipTests
      - name: Package
        run: |
          cd desktop/build-scripts/tuxguitar-linux-swt/target
          # the top-level folder carries the product name
          mv "tuxguitar-${TG_VERSION}-linux-swt" TuxGuitarAdvanced
          tar -czf "$GITHUB_WORKSPACE/TuxGuitarAdvanced-${RELEASE_TAG}-linux-x86_64.tar.gz" TuxGuitarAdvanced
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TuxGuitarAdvanced-*-linux-*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

  build-windows:
    needs: create-release
    runs-on: ubuntu-latest   # cross-compiled with Mingw-w64
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip git gcc-mingw-w64-x86-64 g++-mingw-w64-i686-win32
      - name: Download and install SWT (win32, x86_64)
        run: |
          curl -fL -o swt.zip "https://archive.eclipse.org/eclipse/downloads/drops4/${SWT_DROP}/swt-${SWT_VERSION}-win32-win32-x86_64.zip"
          mkdir swt && cd swt && unzip -q ../swt.zip
          mvn -B install:install-file -Dfile=swt.jar -DgroupId=org.eclipse.swt -DartifactId=org.eclipse.swt.win32.win32 -Dpackaging=jar -Dversion=${SWT_VERSION}
      - name: Build
        run: cd desktop/build-scripts/tuxguitar-windows-swt-x86_64 && mvn -B -e clean verify -P native-modules -P -platform-linux -P platform-windows -DskipTests
      - name: Package
        run: |
          cd desktop/build-scripts/tuxguitar-windows-swt-x86_64/target
          mv "tuxguitar-${TG_VERSION}-windows-swt-x86_64" TuxGuitarAdvanced
          zip -qr "$GITHUB_WORKSPACE/TuxGuitarAdvanced-${RELEASE_TAG}-windows-x86_64.zip" TuxGuitarAdvanced
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TuxGuitarAdvanced-*-windows-*.zip --repo "$GITHUB_REPOSITORY" --clobber

  release:
    needs: [build-macos-arm64, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
