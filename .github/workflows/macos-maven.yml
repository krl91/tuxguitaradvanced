# Builds the macOS (Apple Silicon) version and runs the unit tests of every module of that build. Only when asked (Actions > Run workflow):
# a push does not start it. One runner only: a macOS minute counts ten times on a private repository.

name: MacOS Java CI with Maven

on:
  workflow_dispatch:

permissions:
  contents: read

# a second run of the same workflow on the same branch replaces the first one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macOS:
    runs-on: macos-14   # Apple Silicon
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Install SWT
      uses: ./.github/actions/install-swt
      with:
        platform: macos
    # no -T: this aggregator copies the jars of its modules, which must be built before it (a parallel build fails)
    - name: Build with Maven
      run: cd desktop/build-scripts/tuxguitar-macosx-swt-cocoa && mvn -B --no-transfer-progress -e clean verify
    - name: Rename app depending of arch
      run: |
        TUX_ARCH=$(uname -m | sed 's/arm64/aarch64/')
        cd desktop/build-scripts/tuxguitar-macosx-swt-cocoa/target
        mv tuxguitar-9.99-SNAPSHOT-macosx-swt-cocoa.app "tuxguitar-9.99-SNAPSHOT-macosx-${TUX_ARCH}-swt-cocoa.app"
        echo "TUX_ARCH=${TUX_ARCH}" >> "$GITHUB_ENV"
    - uses: actions/upload-artifact@v7
      with:
        name: Package-MacOS-macos-14
        path: desktop/build-scripts/tuxguitar-macosx-swt-cocoa/target/tuxguitar-9.99-SNAPSHOT-macosx-${{ env.TUX_ARCH }}-swt-cocoa.app
        retention-days: 1
