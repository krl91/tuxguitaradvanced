[package]
name = "guitarfx-settings"
description = "GuitarFX's settings, sounds, sound files and texts (spec 027)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
guitarfx-dsp = { path = "../guitarfx-dsp" }
# the settings folder of each system (MIT or Apache-2.0; pulls option-ext, MPL-2.0: deny.toml)
directories = "=6.0.0"
# the system language for the texts (MIT or Apache-2.0)
sys-locale = "=0.3.2"
