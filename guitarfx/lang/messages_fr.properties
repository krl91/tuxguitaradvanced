# Advanced parameters: a name and a tooltip each; the unit, the range and the default are appended from the registry
guitarfx.output.ceiling.name=Plafond
guitarfx.output.ceiling.tooltip=Le niveau le plus fort permis en sortie ; le limiteur garde chaque échantillon en dessous.
guitarfx.output.fade-in.name=Montée
guitarfx.output.fade-in.tooltip=Le temps que met le son à monter quand il est activé.
