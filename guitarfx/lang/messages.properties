# Advanced parameters: a name and a tooltip each; the unit, the range and the default are appended from the registry
guitarfx.output.ceiling.name=Ceiling
guitarfx.output.ceiling.tooltip=The loudest the output may be; the limiter holds every sample under it.
guitarfx.output.fade-in.name=Fade in
guitarfx.output.fade-in.tooltip=How long the sound takes to rise when it is turned on.
guitarfx.output.fade-out.name=Fade out
guitarfx.output.fade-out.tooltip=How long the sound takes to fall when it is turned off or muted.
guitarfx.output.release.name=Limiter release
guitarfx.output.release.tooltip=How fast the limiter lets the level come back after a peak.
guitarfx.feedback.above-median.name=Above the median
guitarfx.feedback.above-median.tooltip=How far a peak must stand above the spectrum's median to be a howl. Higher: fewer false alarms, a later catch.
guitarfx.feedback.narrow.name=Narrowness
guitarfx.feedback.narrow.tooltip=How far the peak must stand above its neighbours on both sides (a howl is a single narrow tone).
guitarfx.feedback.narrow-bins.name=Neighbour distance
guitarfx.feedback.narrow-bins.tooltip=How far, in spectrum bins, those neighbours are.
guitarfx.feedback.loud.name=Loud level
guitarfx.feedback.loud.tooltip=A peak held above this level is a howl even if it does not grow.
guitarfx.feedback.hold.name=Duration
guitarfx.feedback.hold.tooltip=How long a peak must last before it counts.
guitarfx.feedback.rise.name=Rise
guitarfx.feedback.rise.tooltip=How much a peak must grow during that time to be a howl.
guitarfx.feedback.fall-tolerance.name=Dip allowed
guitarfx.feedback.fall-tolerance.tooltip=How much a growing peak may dip between two looks and still count as growing.
guitarfx.feedback.drift.name=Drift
guitarfx.feedback.drift.tooltip=How far the peak may move between two looks and still be the same tone.
guitarfx.feedback-analysis.low.name=Lowest frequency
guitarfx.feedback-analysis.low.tooltip=The lowest frequency watched.
guitarfx.feedback-analysis.high.name=Highest frequency
guitarfx.feedback-analysis.high.tooltip=The highest frequency watched.
guitarfx.feedback-analysis.hop.name=Look interval
guitarfx.feedback-analysis.hop.tooltip=How often the spectrum is looked at.
guitarfx.devices.block.name=Block size
guitarfx.devices.block.tooltip=The size of the blocks the chain processes. Smaller: less delay, more work.
guitarfx.devices.ring-blocks.name=Waiting blocks
guitarfx.devices.ring-blocks.tooltip=How many input blocks may wait; older ones are dropped and counted.
guitarfx.devices.clipping.name=Clipping level
guitarfx.devices.clipping.tooltip=An input peak above this level shows the clipping message.
guitarfx.devices.resample-fill.name=Resampler fill
guitarfx.devices.resample-fill.tooltip=How full the resampler keeps its buffer when input and output rates differ.
guitarfx.devices.resample-adjust.name=Ratio change
guitarfx.devices.resample-adjust.tooltip=The largest change of the resampling ratio, as a fraction.
