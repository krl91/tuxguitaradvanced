# GuitarFX's licence check (spec 027, research R3, FR-020): no GPL code. `cargo deny check licenses` runs in every build of the
# workspace (pom.xml, .github/workflows/guitarfx.yml). A licence outside this list, or an unknown one, fails the build.

[graph]
all-features = true

[licenses]
# MIT, Apache and BSD-like licences, and LGPL-2.1-or-later (the workspace's own, as tuxguitar-monitor-native's).
allow = [
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"ISC",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"Zlib",
	"Unicode-3.0",
	"LGPL-2.1-or-later",
]
# Every licence not allowed above is denied, GPL-2.0, GPL-3.0, AGPL-3.0 and their variants included; so is a crate whose licence
# cannot be read.
confidence-threshold = 0.93
unused-allowed-license = "allow"

# The other non-GPL licences research R3 expects in the planned tree, each allowed only for the crates that carry it. T029 and T051
# check them against `cargo deny list` once the interface and the plugin are in, and R3 records the crates actually pulled.
exceptions = [
	# a dependency of `directories` (the settings folder)
	{ crate = "option-ext", allow = ["MPL-2.0"] },
	# egui's default fonts
	{ crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
	# the Windows clipboard of egui
	{ crate = "clipboard-win", allow = ["BSL-1.0"] },
	{ crate = "error-code", allow = ["BSL-1.0"] },
	# CC0-1.0: R3 expected it in some small crate; `cargo deny list` shows none with the interface in (T029); T051 checks again with the plugin
]

[licenses.private]
# the workspace's own crates are not published (publish = false); their licence is still checked
ignore = false
