[package]
name = "guitarfx-probe"
description = "GuitarFX's latency probe (spec 027, research R8)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "guitarfx_probe"
path = "src/lib.rs"

[[bin]]
name = "guitarfx-probe"
path = "src/main.rs"

[dependencies]
guitarfx-app = { path = "../guitarfx-app" }
guitarfx-dsp = { path = "../guitarfx-dsp" }
tuxguitar-monitor-native = { path = "../../desktop/build-scripts/native-modules/tuxguitar-monitor-native" }
cpal = "=0.15.3"
