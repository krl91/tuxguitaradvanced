# The figures of the owner's takes before spec 010 (2026-10-14, specs/010-pre-run-check/benchmark/before-after.txt, T004): numbers only, no audio and no labels.
# OwnerChordsBenchmarkTest fails when a series accepts fewer of the chords that were played, or accepts more of the other chords, than this.
# owner-chords: input volume 0.99 (saturated); owner-chords-2: input volume 0.40.
owner-chords.accepted.min=8
# Spec 024 T026 (approved exception 1, wrong.max lines only): the counts the pitch-class profile rule gives with both engines (2026-11-05). This count
# includes the same chord in another voicing and is no longer a guard of wrong chords: the reference series (owner-chords-3) is checked by OwnerChordsProfileTest.
owner-chords.wrong.max=1
owner-chords-2.accepted.min=18
owner-chords-2.wrong.max=9
