recognition.input.level.min.name=Minimum usable level
recognition.input.level.min.tip=Quieter sound is reported as "too low" and is never accepted in practice. Lower: works with a weaker signal, but also listens to more room noise. Higher: needs a louder guitar.
recognition.input.level.max.name=High level warning
recognition.input.level.max.tip=Louder sound is reported as "too high" (risk of distortion). Lower: warns earlier. Higher: warns only close to distortion.
recognition.input.noise-reduction.name=Reduce background noise
recognition.input.noise-reduction.tip=Cuts hum and background noise between notes before the notes are analysed. Off keeps the input exactly as it is.
recognition.input.gain-suggestion.name=Suggest an input gain
recognition.input.gain-suggestion.tip=After the level check, offers a gain that brings the level into the usable range. It is applied only when you confirm it.
recognition.tuner.in-tune.name=In-tune range
recognition.tuner.in-tune.tip=How close to the target a string must be to show "in tune" (tuner and practice display). Smaller: more precise tuning, harder to reach. Larger: easier, less precise.
recognition.tuner.hold.name=Keep the last note
recognition.tuner.hold.tip=When the string fades out, the tuner keeps showing the last reliable note in grey instead of going blank.
recognition.note.accept.name=Accepted pitch range
recognition.note.accept.tip=How far from the written note (in cents) a played note may be and still count as correct. Smaller: stricter about tuning and bends. Larger: more forgiving, but a neighbouring note is still never accepted. Never smaller than the in-tune range.
recognition.note.fret-sharp.name=Sharp allowance per fret
recognition.note.fret-sharp.tip=Pressing a string on a fret stretches it, so fretted notes sound a little sharp, more so higher up the neck (noticeably on real guitars). This adds that many cents per fret to the accepted range, on the sharp side only. 0 switches it off; the flat side and a neighbouring note are never affected.
recognition.note.confidence.name=Minimum certainty
recognition.note.confidence.tip=How sure the detector must be before a note is judged. Lower: reacts to weaker or noisier notes, with more mistakes. Higher: fewer mistakes, but may wait on soft notes.
recognition.note.stability.name=Time to confirm a note
recognition.note.stability.tip=How long the right note must sound before it is accepted, and a wrong note before it is marked wrong. Shorter: faster reaction, more risk from glitches. Longer: steadier, slower in fast passages.
recognition.note.attack.name=Pick attack sensitivity
recognition.note.attack.tip=How strong a sudden rise in sound must be to count as a new attack (every note needs one). Lower: detects soft attacks, but knocks and noise may count. Higher: ignores more noise, may miss soft plucks.
recognition.note.legato.name=Hammer-ons, pull-offs, slides
recognition.note.legato.tip=Today every note needs its own attack, so legato notes may need to be picked again or skipped. Accepting legato without an attack is a proposal still under review.
recognition.note.legato.option.strict=New attack for every note
recognition.note.technique.name=Check playing techniques
recognition.note.technique.tip=Tries to hear the techniques written in the score (hammer-on, pull-off, slide, bend, vibrato...) and says what was heard, without ever blocking the exercise. Off: every technique is shown as not verifiable.
recognition.tempo.window.name=Timing window (Arcade)
recognition.tempo.window.tip=How far from its written time a note may be played and still count as on time in Arcade, in milliseconds each side at 120 beats a minute (the real window grows and shrinks with the tempo). A wider window is more lenient. It is the same value as the slider of the Mode tab of the practice window in Arcade. Follow the tempo uses the time to play the note instead.
recognition.follow.play-time.name=Time to play the note (Follow the tempo)
recognition.follow.play-time.tip=In Follow the tempo, how long after its written time a note may be played and still be accepted, in milliseconds. A note may also come a little early, less so when the notes are close together. A longer time is more lenient. It is the same value as the slider Time to play the note of the Mode tab of the practice window in Follow the tempo.
recognition.chord.evidence.name=Chord strictness
recognition.chord.evidence.tip=Share of a string's own overtones that must be heard for it to count in a chord. Lower: accepts weaker strings, may accept a missing one. Higher: stricter, may reject a real but quiet string. Rule "Every string separately" only.
recognition.chord.window.name=Strum window
recognition.chord.window.tip=Time after the strum within which all strings must be heard. Shorter: needs a quick, even strum. Longer: allows slow arpeggiated strums.
recognition.chord.completeness.name=Chord rule
recognition.chord.completeness.tip=How a chord is judged. Note names over the strum: the notes of the chord must be heard together over the strum, whatever the voicing (recommended). Every string separately: each string that can be checked on its own must be heard; strings that cannot be told apart are shown as not checked. Choosing a chord check level in the practice window sets this value; changing it here makes the level Custom.
recognition.chord.completeness.option.all-verifiable=Every string separately
recognition.chord.completeness.option.profile=Note names over the strum
recognition.chord.foreign.name=Extra wrong strings
recognition.chord.foreign.tip=Extra strings that are not in the chord are not checked yet. Rejecting them needs real chord recordings first (proposal under review).
recognition.chord.foreign.option.ignore=Not checked yet
recognition.chord.profile.match.name=Chord match
recognition.chord.profile.match.tip=How closely the note names heard over the strum must match the chord. Lower: accepts more, may accept a chord with one note wrong. Higher: stricter, may refuse a right chord. Rule "Note names over the strum" only. Choosing a chord check level in the practice window sets this value; changing it here makes the level Custom.
recognition.chord.profile.names.name=Weakest note of a chord
recognition.chord.profile.names.tip=A note of the chord heard under this share of its strongest note counts as missing; a chord missing two notes is always refused. Rule "Note names over the strum" only.
recognition.chord.attack.name=Accept a chord on its attack
recognition.chord.attack.tip=A chord can be accepted on the attack of the strum itself. With the rule "Note names over the strum", never when two notes of the chord are missing. Choosing a chord check level in the practice window sets this value; changing it here makes the level Custom.
recognition.chord.detail.top.name=Highest note counted
recognition.chord.detail.top.tip=The highest pitch (MIDI number, 84 = C6) whose sound counts in the note names of a chord. Technical setting.
recognition.chord.detail.settle.name=Time before judging a chord
recognition.chord.detail.settle.tip=How long a strum is listened to before the chord can be accepted from its note names. Technical setting.
recognition.passage.measures.name=Repeat passages
recognition.passage.measures.tip=Splits the song into passages and repeats one when too many notes were wrong or skipped. Off plays straight through. This is the value used when TuxGuitar starts; the practice window can change it for the current run.
recognition.passage.measures.option.0=Off (play straight through)
recognition.passage.measures.option.1=Every measure
recognition.passage.measures.option.2=Every 2 measures
recognition.passage.measures.option.4=Every 4 measures
recognition.passage.threshold.name=Repeat when errors exceed
recognition.passage.threshold.tip=Share of wrong or skipped notes and chords in a passage above which it is played again.
recognition.passage.threshold.option.25=25 %
recognition.passage.threshold.option.50=50 %
recognition.passage.threshold.option.75=75 %
recognition.passage.retries.name=Maximum repeats
recognition.passage.retries.tip=How many times a passage is repeated at most before practice moves on. 0 never repeats.
recognition.engine.pitch.name=Pitch detection engine
recognition.engine.pitch.tip=The method that finds the note being played. This version has one engine (FastYin, one note at a time); chords are checked separately against the written chord.
recognition.engine.pitch.option.automatic=Automatic ({0})
recognition.engine.pitch.option.native=Native (Rust)
recognition.engine.pitch.option.fastyin=Java (FastYin)
recognition.engine.pitch.tip.v2=The method that finds the notes and chords being played. Native (Rust): the analysis runs in the native library, with less delay. Java (FastYin): the analysis of earlier versions. Automatic uses the native engine when it can start, otherwise Java. A change applies from the next practice run.
recognition.engine.notice.library-missing=The native recognition engine could not be loaded: the practice goes on with the Java engine.
recognition.engine.notice.device-not-found=The native recognition engine did not find the input: the practice goes on with the Java engine.
recognition.engine.notice.format-unsupported=The native recognition engine cannot read this input's format: the practice goes on with the Java engine.
recognition.engine.notice.stream-failed=The native recognition engine could not start on this input: the practice goes on with the Java engine.
recognition.advanced.level.clip-sample.name=Clipping sample level
recognition.advanced.level.clip-sample.tip=A sample at or above this share of full scale counts as clipped. Technical setting.
recognition.advanced.level.clip-share.name=Clipping share
recognition.advanced.level.clip-share.tip=Share of clipped samples in a frame above which the input is reported as clipping. Technical setting.
recognition.advanced.tuner.confidence.name=Tuner minimum certainty
recognition.advanced.tuner.confidence.tip=How sure the detector must be before the tuner shows a note. Lower: shows weaker notes, more flicker. Higher: steadier, may stay blank on soft notes.
recognition.advanced.attack.min-level.name=Attack detection floor
recognition.advanced.attack.min-level.tip=Sound quieter than this is never taken as a new attack. Lower: detects very soft attacks, more noise. Higher: ignores quiet noise.
recognition.advanced.chord.min-partials.name=Chord overtones per string
recognition.advanced.chord.min-partials.tip=How many of a string's own overtones must be heard for it to count in a chord; strings with fewer own overtones cannot be checked separately. Technical setting. Rule "Every string separately" only.
recognition.advanced.chord.confirm.name=Time to confirm a chord
recognition.advanced.chord.confirm.tip=How long every string of the chord must be heard together before the chord is accepted. Technical setting.

# spec 026: the engines' own values, one category per family
recognition.onset.flux-factor.name=Onset: flux factor
recognition.onset.flux-factor.tip=How far the change of the spectrum must rise above its recent median for a new attack. Lower: more attacks found, more false ones; higher: fewer false attacks, more missed re-plucks. Expert setting: the recommended value was measured; change it only to test.
recognition.onset.flux-offset.name=Onset: flux margin
recognition.onset.flux-offset.tip=A fixed margin added to that median before a change counts as an attack. Lower: more sensitive in quiet passages; higher: fewer attacks from noise. Expert setting: the recommended value was measured; change it only to test.
recognition.onset.refractory.name=Onset: rest after an attack
recognition.onset.refractory.tip=How long after an attack no other attack is reported. Shorter: fast repeated notes are each heard; longer: one note never counts twice. Expert setting: the recommended value was measured; change it only to test.
recognition.onset.pre-first.name=Onset: level before, from
recognition.onset.pre-first.tip=Where the level before the attack starts to be measured, counted back from the attack. Further back: a ringing previous note hides more re-plucks; closer: re-plucks of a decaying note are found more easily. Expert setting: the recommended value was measured; change it only to test.
recognition.onset.pre-last.name=Onset: level before, to
recognition.onset.pre-last.tip=Where the level before the attack stops being measured, counted back from the attack. Closer to the attack: the rise is measured against the latest level. Expert setting: the recommended value was measured; change it only to test.
recognition.onset.post-first.name=Onset: level after, from
recognition.onset.post-first.tip=Where the level after the attack starts to be measured. Earlier: the transient itself counts more; later: only the sustained level counts. Expert setting: the recommended value was measured; change it only to test.
recognition.onset.post-last.name=Onset: level after, to
recognition.onset.post-last.tip=Where the level after the attack stops being measured; the attack is reported then. Earlier: attacks reported sooner, on less sound; later: surer, but reported later. Expert setting: the recommended value was measured; change it only to test.
recognition.onset-fast.flux-factor.name=Fast run: flux factor
recognition.onset-fast.flux-factor.tip=For fast runs: how far the change of the spectrum must rise above its recent median for a new attack. Lower: more attacks found, more false ones. Expert setting: the recommended value was measured; change it only to test.
recognition.onset-fast.flux-offset.name=Fast run: flux margin
recognition.onset-fast.flux-offset.tip=For fast runs: the fixed margin added to that median before a change counts as an attack. Lower: more sensitive; higher: fewer attacks from noise. Expert setting: the recommended value was measured; change it only to test.
recognition.onset-fast.refractory.name=Fast run: rest after an attack
recognition.onset-fast.refractory.tip=For fast runs: how long after an attack no other attack is reported. Shorter: closer notes are each heard; longer: one note never counts twice. Expert setting: the recommended value was measured; change it only to test.
recognition.onset-fast.pre-first.name=Fast run: level before, from
recognition.onset-fast.pre-first.tip=For fast runs: where the level before the attack starts to be measured, counted back from the attack. Closer: a decaying previous note hides fewer re-plucks. Expert setting: the recommended value was measured; change it only to test.
recognition.onset-fast.pre-last.name=Fast run: level before, to
recognition.onset-fast.pre-last.tip=For fast runs: where the level before the attack stops being measured, counted back from the attack. Expert setting: the recommended value was measured; change it only to test.
recognition.onset-fast.post-first.name=Fast run: level after, from
recognition.onset-fast.post-first.tip=For fast runs: where the level after the attack starts to be measured. Earlier: the transient itself counts more. Expert setting: the recommended value was measured; change it only to test.
recognition.onset-fast.post-last.name=Fast run: level after, to
recognition.onset-fast.post-last.tip=For fast runs: where the level after the attack stops being measured; the attack is reported then. Earlier: reported sooner, on less sound. Expert setting: the recommended value was measured; change it only to test.
recognition.pitch.yin-threshold.name=Pitch: YIN threshold
recognition.pitch.yin-threshold.tip=How clear the periodicity of the sound must be for the YIN engine to give a pitch. Lower: only clear notes get a pitch, fewer wrong octaves; higher: noisy or weak notes get a pitch too, more wrong ones. Expert setting: the recommended value was measured; change it only to test.
recognition.pitch.target-search.name=Pitch: expected-note search
recognition.pitch.target-search.tip=How far around the period of an expected note the check of that note searches. Narrower: a slightly out-of-tune note is less often confirmed; wider: a neighbouring note is more often taken for it. Expert setting: the recommended value was measured; change it only to test.
recognition.pitch.target-periods.name=Pitch: expected-note periods
recognition.pitch.target-periods.tip=How many periods of the sound the check of an expected note compares. Fewer: a quicker answer on less sound; more: a steadier answer that needs a longer note. Expert setting: the recommended value was measured; change it only to test.
recognition.pitch.max-sharp.name=Pitch: maximum sharp side
recognition.pitch.max-sharp.tip=The most a note may be sharp and still be accepted, whatever the fret allowance adds. Lower: high frets pressed hard are refused sooner; higher: up to just under the next semitone. Expert setting: the recommended value was measured; change it only to test.
recognition.pitch.attack-candidates-low.name=Pitch: lowest attack candidate
recognition.pitch.attack-candidates-low.tip=The lowest neighbour pitch the attack check compares with the expected notes. Lower: a wrong low note can compete too; higher: less work, fewer low wrong notes seen. Expert setting: the recommended value was measured; change it only to test.
recognition.pitch.attack-candidates-high.name=Pitch: highest attack candidate
recognition.pitch.attack-candidates-high.tip=The highest neighbour pitch the attack check compares with the expected notes. Higher: a wrong high note can compete too; lower: less work, fewer high wrong notes seen. Expert setting: the recommended value was measured; change it only to test.
recognition.polyphonic.candidate-low.name=Spectrum: lowest candidate
recognition.polyphonic.candidate-low.tip=The lowest pitch the chord spectrum looks for. Lower: the lowest strings of a long-scale or down-tuned guitar are found; higher: fewer false low pitches. Expert setting: the recommended value was measured; change it only to test.
recognition.polyphonic.candidate-high.name=Spectrum: highest candidate
recognition.polyphonic.candidate-high.tip=The highest pitch the chord spectrum looks for. Higher: the highest frets are found; lower: fewer false high pitches from the partials of lower notes. Expert setting: the recommended value was measured; change it only to test.
recognition.polyphonic.harmonics.name=Spectrum: partials per note
recognition.polyphonic.harmonics.tip=How many partials of a note are added up to weigh it. Fewer: steadier on a bright sound; more: a dull note with weak partials is still found. Expert setting: the recommended value was measured; change it only to test.
recognition.polyphonic.max-harmonic.name=Spectrum: highest partial
recognition.polyphonic.max-harmonic.tip=The highest frequency a partial is looked for at. Lower: the partials of other notes high up count less; higher: more of a high note's partials count. Expert setting: the recommended value was measured; change it only to test.
recognition.polyphonic.tolerance.name=Spectrum: partial tolerance
recognition.polyphonic.tolerance.tip=How far from its exact place a partial is still taken. Narrower: another note's partial is less often taken; wider: a slightly out-of-tune string is still found. Expert setting: the recommended value was measured; change it only to test.
recognition.polyphonic.candidates.name=Spectrum: pitches per frame
recognition.polyphonic.candidates.tip=How many pitches the chord spectrum names at most at a time. Fewer: only the strongest; more: every string of a full chord can be named. Expert setting: the recommended value was measured; change it only to test.
recognition.polyphonic.min-relative.name=Spectrum: weakest pitch kept
recognition.polyphonic.min-relative.tip=How weak a pitch may be, against the strongest, and still be named. Lower: soft strings of a chord are named; higher: fewer false pitches from partials. Expert setting: the recommended value was measured; change it only to test.
recognition.polyphonic.floor.name=Spectrum: level floor
recognition.polyphonic.floor.tip=The level under which no pitch is named. Lower: very soft playing is analysed; higher: silence and hum name nothing. Expert setting: the recommended value was measured; change it only to test.
recognition.polyphonic.subharmonic.name=Spectrum: lower note check
recognition.polyphonic.subharmonic.tip=How strong a lower note's own partials must be for a pitch to be taken as that lower note. Lower: an octave below is chosen more often; higher: the pitch heard is kept. Expert setting: the recommended value was measured; change it only to test.
recognition.polyphonic.floor-width.name=Spectrum: floor width
recognition.polyphonic.floor-width.tip=How wide the neighbourhood is whose mean is removed from the spectrum before partials are looked for. Narrower: close partials stand out more; wider: a broad noise is removed better. Expert setting: the recommended value was measured; change it only to test.
recognition.polyphonic.floor-factor.name=Spectrum: floor factor
recognition.polyphonic.floor-factor.tip=How far above that mean the spectrum must rise to count as a partial. Lower: weak partials count; higher: only clear partials count, noise less. Expert setting: the recommended value was measured; change it only to test.
recognition.attack.lag.name=Struck: growth span
recognition.attack.lag.tip=Over how long the growth of the spectrum is measured to tell which notes were just struck. Shorter: quick re-strikes are told apart; longer: a slow attack is fully seen. Expert setting: the recommended value was measured; change it only to test.
recognition.attack.max-frequency.name=Struck: highest frequency
recognition.attack.max-frequency.tip=The highest frequency the growth is read at. Lower: less noise from the pick; higher: the partials of high notes count. Expert setting: the recommended value was measured; change it only to test.
recognition.attack.partials.name=Struck: partials per note
recognition.attack.partials.tip=How many partials each note's model has. Fewer: notes sharing partials are told apart less; more: a note is matched by its whole sound. Expert setting: the recommended value was measured; change it only to test.
recognition.attack.beta.name=Struck: weight of high partials
recognition.attack.beta.tip=How fast the weight of a note's higher partials falls in its model. Lower: high partials weigh as much as the first; higher: the first partials decide. Expert setting: the recommended value was measured; change it only to test.
recognition.attack.sigma.name=Struck: partial width
recognition.attack.sigma.tip=How wide each partial of a note's model is. Narrower: neighbouring notes are told apart better; wider: a slightly out-of-tune string still matches. Expert setting: the recommended value was measured; change it only to test.
recognition.attack.evidence-partials.name=Struck tuning: partials measured
recognition.attack.evidence-partials.tip=How many partials of a struck note are measured to tell how far it is from its exact pitch. Fewer: the clearest partials only; more: a steadier median. Expert setting: the recommended value was measured; change it only to test.
recognition.attack.evidence-search.name=Struck tuning: search
recognition.attack.evidence-search.tip=How far around each partial's exact place its new peak is looked for. Narrower: a neighbouring note's peak is less often taken; wider: a badly out-of-tune note is still measured. Expert setting: the recommended value was measured; change it only to test.
recognition.attack.evidence-peak.name=Struck tuning: smallest peak
recognition.attack.evidence-peak.tip=How small a new peak may be, against the strongest, and still be measured. Lower: weak partials are measured too; higher: only strong, reliable partials. Expert setting: the recommended value was measured; change it only to test.
recognition.chord-evidence.partial-presence.name=Chord: partial present from
recognition.chord-evidence.partial-presence.tip=How strong a partial of an expected chord must be, against the strongest, to count as present. Lower: soft strings count as heard; higher: only clearly sounding strings count. Expert setting: the recommended value was measured; change it only to test.
recognition.chord-evidence.neighbour-margin.name=Chord: whole-tone check
recognition.chord-evidence.neighbour-margin.tip=How much better the same chord a whole tone away must explain the sound for the expected chord not to be heard. Lower: a chord played a tone off is refused sooner; higher: it is refused only when clearly off. Expert setting: the recommended value was measured; change it only to test.
recognition.chord-evidence.strum-window.name=Strum check: window
recognition.chord-evidence.strum-window.tip=How long the first strum of a check is measured for its level and clipping. Shorter: only the attack; longer: the strum's whole sound. Expert setting: the recommended value was measured; change it only to test.
recognition.chord-evidence.strum-quiet.name=Strum check: quiet before
recognition.chord-evidence.strum-quiet.tip=How long before a strum the quietest level is looked for, to tell that the strum rises above it. Shorter: a strum after a noisy moment is still found; longer: a slowly rising noise is not taken for a strum. Expert setting: the recommended value was measured; change it only to test.
recognition.chord-evidence.strum-rise.name=Strum check: rise
recognition.chord-evidence.strum-rise.tip=How far above that quiet level a strum must rise to start the measure. Lower: a soft strum starts it, noise too; higher: only a clear strum starts it. Expert setting: the recommended value was measured; change it only to test.
recognition.chord-evidence.strum-clip-share.name=Strum check: clipping share
recognition.chord-evidence.strum-clip-share.tip=How many of the measured samples must reach the clip level for the strum to be called clipping. Lower: the slightest clipping is reported; higher: only heavy clipping. Expert setting: the recommended value was measured; change it only to test.
recognition.front-end.high-pass.name=Rumble filter corner
recognition.front-end.high-pass.tip=With the noise reduction on, the frequency under which rumble and hum are cut. Lower: the lowest strings keep all their body, rumble passes more; higher: more rumble is cut, the low strings get thinner. Expert setting: the recommended value was measured; change it only to test.
recognition.front-end.noise-rise.name=Noise level: rise speed
recognition.front-end.noise-rise.tip=How fast the estimated background noise may rise toward a louder sound. Slower: a long held note is not taken for noise; faster: a noise that grows is followed sooner. Expert setting: the recommended value was measured; change it only to test.
recognition.front-end.noise-fall.name=Noise level: fall speed
recognition.front-end.noise-fall.tip=How fast the estimated background noise drops to a quieter moment. Lower: the estimate drops gently; higher: it drops at once to the quietest moment. Expert setting: the recommended value was measured; change it only to test.
recognition.front-end.noise-trusted.name=Noise level: trusted after
recognition.front-end.noise-trusted.tip=Without a level check, how long the noise must be listened to before the gate may lower the sound. Shorter: the gate acts sooner, on a less sure estimate; longer: it waits for a surer estimate. Expert setting: the recommended value was measured; change it only to test.
recognition.noise-gate.open.name=Gate: opens above the noise by
recognition.noise-gate.open.tip=How far above the background noise a sound must be for the gate to open. Lower: soft notes open it, loud noise too; higher: only clear notes open it. Always above the closing margin. Expert setting: the recommended value was measured; change it only to test.
recognition.noise-gate.close.name=Gate: closes under the noise plus
recognition.noise-gate.close.tip=How close to the background noise a fading note must fall for the gate to start closing. Lower: a fading note is kept longer; higher: the gate closes sooner on a fading note. Expert setting: the recommended value was measured; change it only to test.
recognition.noise-gate.reduction.name=Gate: reduction
recognition.noise-gate.reduction.tip=How much the gate lowers the sound when it is closed. Lower: the noise stays audible; higher: the silences are quieter. Expert setting: the recommended value was measured; change it only to test.
recognition.noise-gate.hold.name=Gate: hold
recognition.noise-gate.hold.tip=How long a fading note must stay near the noise before the gate closes. Shorter: the gate closes quickly; longer: short gaps between notes stay open. Expert setting: the recommended value was measured; change it only to test.
recognition.noise-gate.subtraction.name=Noise subtraction: strength
recognition.noise-gate.subtraction.tip=With the noise subtraction on, how much of the learnt noise is removed from the sound. Lower: some noise stays; higher: more noise is removed, the notes may sound thinner. Expert setting: the recommended value was measured; change it only to test.
recognition.noise-gate.subtraction-floor.name=Noise subtraction: floor
recognition.noise-gate.subtraction-floor.tip=The share of the sound always kept, whatever the subtraction removes. Lower: deeper silences, more artefacts; higher: fewer artefacts, more noise left. Expert setting: the recommended value was measured; change it only to test.
recognition.noise-gate.subtraction-learn.name=Noise subtraction: learning speed
recognition.noise-gate.subtraction-learn.tip=How fast the learnt noise follows a changing background while the gate is closed. Lower: a steadier noise picture; higher: a changing noise is followed sooner. Expert setting: the recommended value was measured; change it only to test.
recognition.gain.target.name=Gain suggestion: playing level aimed at
recognition.gain.target.tip=The playing level the gain suggestion of the level check aims at. Lower: a softer level is proposed, more room before clipping; higher: a louder level, closer to clipping. Expert setting: the recommended value was measured; change it only to test.
recognition.gain.max-peak.name=Gain suggestion: highest peak
recognition.gain.max-peak.tip=The loudest peak the suggested gain may give. Lower: more room before clipping; higher: a louder signal, closer to clipping. Expert setting: the recommended value was measured; change it only to test.
recognition.gain.no-change.name=Gain suggestion: nothing to change within
recognition.gain.no-change.tip=How close the suggested gain may be to the current one and still count as nothing to change. Lower: small corrections are proposed; higher: only large ones. Expert setting: the recommended value was measured; change it only to test.
recognition.gain.min-snr.name=Gain suggestion: playing above the noise by
recognition.gain.min-snr.tip=How far the playing must stand above the background noise for a boost to be proposed without the noise warning. Lower: the warning comes less often; higher: it comes sooner. Expert setting: the recommended value was measured; change it only to test.
recognition.acceptance.min-share.name=Struck notes: share explained
recognition.acceptance.min-share.tip=How much of what the attack added to the sound the expected notes must explain. Lower: more lenient, a note with other sounds is accepted; higher: stricter, only a clean note. Expert setting: the recommended value was measured; change it only to test.
recognition.acceptance.min-balance.name=Struck notes: chord balance
recognition.acceptance.min-balance.tip=How strong the weakest note of a chord must be, against the strongest. Lower: more lenient, a soft string still counts; higher: stricter, every string must sound clearly. Expert setting: the recommended value was measured; change it only to test.
recognition.acceptance.min-peak.name=Struck notes: strongest pitch
recognition.acceptance.min-peak.tip=How strong the strongest expected note must be, against the strongest pitch heard. Lower: more lenient, another loud pitch is allowed; higher: stricter, the expected note must lead. Expert setting: the recommended value was measured; change it only to test.
recognition.acceptance.hops.name=Struck notes: confirmed for
recognition.acceptance.hops.tip=How long the expected notes must be heard in a row before they are accepted. Shorter: faster, more mistakes; longer: surer, slower. Expert setting: the recommended value was measured; change it only to test.
recognition.acceptance.neighbour.name=Struck notes: over the neighbours
recognition.acceptance.neighbour.tip=How many times stronger each expected note must be than its semitone and whole-tone neighbours; zero switches the check off. Lower: more lenient; higher: a note next to the expected one is refused sooner. Expert setting: the recommended value was measured; change it only to test.
recognition.acceptance.attack-strength.name=Struck notes: attack strength
recognition.acceptance.attack-strength.tip=How sudden the attack must be for the notes to count; zero accepts any. Lower: more lenient, soft attacks count; higher: only clear attacks count. Expert setting: the recommended value was measured; change it only to test.
recognition.acceptance.rearm.name=Struck notes: ignored after a note
recognition.acceptance.rearm.tip=How long the sound is ignored after a note is accepted, so a ringing note is never taken for the next. Shorter: fast passages are followed; longer: fewer double counts. Expert setting: the recommended value was measured; change it only to test.
recognition.acceptance.offset-margin.name=Struck notes: tuning margin
recognition.acceptance.offset-margin.tip=How far beyond the accepted tuning the measured pitch of a struck note may be, since that measure is rough. Lower: stricter on the tuning; higher: more lenient. Expert setting: the recommended value was measured; change it only to test.
recognition.acceptance.decay.name=Struck notes: forgiveness
recognition.acceptance.decay.tip=How much the confirmation goes back when one moment does not match; zero starts it again. Lower: stricter; higher: a short miss costs less. Expert setting: the recommended value was measured; change it only to test.
recognition.acceptance.guard.name=Struck notes: thump skipped
recognition.acceptance.guard.tip=After a note struck from silence, how long the first thump is skipped before the pitch is read. Shorter: faster; longer: the thump is never taken for a pitch. Expert setting: the recommended value was measured; change it only to test.
recognition.acceptance.min-total.name=Struck notes: quietest note
recognition.acceptance.min-total.tip=How loud the new sound must be to be a note rather than room noise. Lower: soft notes count, noise too; higher: only clear notes count. Expert setting: the recommended value was measured; change it only to test.
recognition.acceptance.floor-hops.name=Struck notes: quiet level over
recognition.acceptance.floor-hops.tip=Over how long the quiet level before an attack is looked for. Shorter: follows a changing background; longer: the quietest moment is found. Expert setting: the recommended value was measured; change it only to test.
recognition.acceptance.silence.name=Struck notes: from silence
recognition.acceptance.silence.tip=How sudden an attack must be to count as a note struck from silence, whose thump is then skipped. Lower: more attacks wait for the thump to pass; higher: fewer. Expert setting: the recommended value was measured; change it only to test.
recognition.acceptance.min-onset.name=Struck notes: smallest onset
recognition.acceptance.min-onset.tip=The smallest new sound that can start an attack. Lower: soft attacks are found, noise too; higher: only clear attacks. Expert setting: the recommended value was measured; change it only to test.
recognition.acceptance.onset-floor.name=Struck notes: onset over the quiet level
recognition.acceptance.onset-floor.tip=How many times louder than the quiet level before it a sound must be to start an attack. Lower: soft attacks are found, noise too; higher: only clear attacks. Expert setting: the recommended value was measured; change it only to test.
recognition.acceptance.release.name=Struck notes: end of the attack
recognition.acceptance.release.tip=How far the sound must fall, against the peak of the attack, for the attack to end. Lower: the attack lasts longer; higher: it ends sooner, a note struck from silence has less time to be confirmed. Expert setting: the recommended value was measured; change it only to test.
recognition.wait.verdict-hold.name=Wait: verdict shown for
recognition.wait.verdict-hold.tip=How long the check mark or the cross stays shown. Shorter: the display clears sooner; longer: the verdict stays in view. Expert setting: the recommended value was measured; change it only to test.
recognition.wait.neighbour-veto.name=Wait: neighbour hold-back
recognition.wait.neighbour-veto.tip=How long a neighbouring note read by the pitch estimate holds back the acceptance of a struck note. Shorter: faster, a neighbour is taken for the note more often; longer: surer, slower. Expert setting: the recommended value was measured; change it only to test.
recognition.wait.neighbour-confidence.name=Wait: neighbour confidence
recognition.wait.neighbour-confidence.tip=How sure the pitch estimate must be of a neighbouring note for it to hold back the acceptance. Lower: a neighbour holds back more often; higher: only a clear neighbour does. Expert setting: the recommended value was measured; change it only to test.
recognition.wait.technique-window.name=Wait: technique observed for
recognition.wait.technique-window.tip=How long a note's written technique is observed after the note is accepted. Shorter: the result comes sooner, from less of the note; longer: from more of it, later. Expert setting: the recommended value was measured; change it only to test.
recognition.wait.bend-window-min.name=Wait: bend observed at least
recognition.wait.bend-window-min.tip=The shortest time a bend is observed, whatever its written length. Shorter: the result of a short bend comes sooner; longer: a slow learner's bend is still seen whole. Expert setting: the recommended value was measured; change it only to test.
recognition.wait.bend-window-max.name=Wait: bend observed at most
recognition.wait.bend-window-max.tip=The longest time a bend is observed, whatever its written length. Shorter: the result of a long bend comes sooner; longer: a long bend is seen to its end. Expert setting: the recommended value was measured; change it only to test.
recognition.wait.bend-margin.name=Wait: bend margin
recognition.wait.bend-margin.tip=How far from the written path of a bend the pitch may be and still count as on it. Lower: stricter, a bend past its target is refused; higher: more lenient, a wrong note near the path is not reported. Expert setting: the recommended value was measured; change it only to test.
recognition.wait.technique-lead.name=Wait: technique from before
recognition.wait.technique-lead.tip=How far before the acceptance the observation of a note's technique may start, back to its attack. Shorter: the start of the note is left out; longer: more of its start is seen. Expert setting: the recommended value was measured; change it only to test.
recognition.wait.speed-window.name=Wait: too fast within
recognition.wait.speed-window.tip=How soon after an accepted note a new attack means the learner plays faster than recognition follows. Shorter: the speed limit is shown less often; longer: more often. Expert setting: the recommended value was measured; change it only to test.
recognition.wait.speed-lead.name=Wait: too fast from before
recognition.wait.speed-lead.tip=How long before an accepted note an attack still counts for the speed limit. Shorter: fewer attacks count; longer: more. Expert setting: the recommended value was measured; change it only to test.
recognition.wait.early-margin.name=Wait: early acceptance margin
recognition.wait.early-margin.tip=When early acceptance is switched on, how far the evidence for the expected note must lead its neighbours for the note to be accepted sooner. Lower: early more often, more mistakes; higher: rarely early. Expert setting: the recommended value was measured; change it only to test.
recognition.wait.early-hops.name=Wait: early acceptance after
recognition.wait.early-hops.tip=When early acceptance is switched on, how long the expected note must be heard before it is accepted early; never longer than the usual wait. Shorter: faster; longer: surer. Expert setting: the recommended value was measured; change it only to test.
recognition.wait.weak-fast.name=Wait: too weak for speed
recognition.wait.weak-fast.tip=The level of the notes below which the learner is told the input is too weak for fast recognition. Lower: the message is shown less often; higher: more often. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.evidence-horizon.name=Follow: pitch awaited for
recognition.follow.evidence-horizon.tip=How long after an attack its pitch is awaited before the attack is taken for a click or noise. Shorter: noise is set aside sooner; longer: a note whose pitch is slow to settle still counts. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.silence.name=Follow: end of a sound
recognition.follow.silence.tip=How long without any pitch ends the sound of an attack. Shorter: a short note is decided sooner; longer: a brief drop does not end the note. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.short-note.name=Follow: shortest note
recognition.follow.short-note.tip=How long a note that ends early must have held its pitch to count, like a grace note. Shorter: more lenient; longer: a very short note is not counted. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.same-sound.name=Follow: same sound within
recognition.follow.same-sound.tip=How close to the sound a note was matched on another attack is taken for that same sound rather than an extra note. Shorter: more extra notes; longer: fewer. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.ringing.name=Follow: string rings for
recognition.follow.ringing.tip=How long a plucked string is taken to ring under the notes that follow; a repeated note within it takes its time from the reported attack. Shorter: fewer notes are treated as ringing; longer: more. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.scan-back.name=Follow: notes looked back
recognition.follow.scan-back.tip=How many notes already recognised are still looked at, since a second attack may fall in their window. Lower: a second attack is more often an extra note; higher: more is looked at. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.onset-memory.name=Follow: attacks kept for
recognition.follow.onset-memory.tip=How long the attacks the detector reported are kept, to give their time to repeated notes. Shorter: an attack may be forgotten before its note is recognised; longer: kept longer. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.refine-before.name=Follow: attack before the evidence
recognition.follow.refine-before.tip=How long before the moment the attack evidence gives a reported attack may lie to be the same attack. Shorter: fewer repeated notes take the reported time; longer: more. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.refine-after.name=Follow: attack after the evidence
recognition.follow.refine-after.tip=How long after the moment the attack evidence gives a reported attack may lie to be the same attack, and how long the session waits for it. Shorter: faster; longer: the reported time is used more often. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.after-close.name=Follow: open after its window
recognition.follow.after-close.tip=How long a repeated note whose window closed stays open to the evidence of its attack. Shorter: a late confirmation is lost; longer: kept open longer. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.tail.name=Follow: end of the run
recognition.follow.tail.tip=How long the run goes on after the last window before it is complete. Shorter: the summary comes sooner; longer: a last late note is still heard. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.history.name=Follow: sound kept for
recognition.follow.history.tip=How long the recent sound is kept, from which a note's attack and techniques are read. Shorter: the start of a note may be lost; longer: more is kept. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.technique-window.name=Follow: technique observed for
recognition.follow.technique-window.tip=How long a note's written technique is observed from its attack. Shorter: the result comes sooner, from less of the note; longer: from more of it, later. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.bend-window-min.name=Follow: bend observed at least
recognition.follow.bend-window-min.tip=The shortest time a bend is observed, whatever its written length. Shorter: the result of a short bend comes sooner; longer: a slow bend is still seen whole. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.bend-window-max.name=Follow: bend observed at most
recognition.follow.bend-window-max.tip=The longest time a bend is observed, whatever its written length. Shorter: the result of a long bend comes sooner; longer: a long bend is seen to its end. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.bend-margin.name=Follow: bend margin
recognition.follow.bend-margin.tip=How far from the written path of a bend the pitch may be and still count as on it. Lower: stricter, a bend past its target breaks the note; higher: more lenient. Expert setting: the recommended value was measured; change it only to test.
recognition.follow.evidence-lead.name=Follow: evidence watched from
recognition.follow.evidence-lead.tip=How long before its window a note starts watching the attack evidence; the quiet level before the attack is needed to see it grow. Shorter: an early attack may be missed; longer: more is watched. Expert setting: the recommended value was measured; change it only to test.
recognition.clock.fit-window.name=Clock: position measured over
recognition.clock.fit-window.tip=Over how much recent playback the clock measures its position and speed. Shorter: follows a tempo change sooner, less steady; longer: steadier, slower to follow. Expert setting: the recommended value was measured; change it only to test.
recognition.clock.min-points.name=Clock: readings needed
recognition.clock.min-points.tip=How many readings of the player the clock needs before it measures its speed; before that it uses the written tempo. Lower: measured sooner; higher: steadier. Expert setting: the recommended value was measured; change it only to test.
recognition.clock.min-span.name=Clock: readings spread over
recognition.clock.min-span.tip=How much playback the readings must cover before the clock measures its speed. Shorter: measured sooner; longer: steadier. Expert setting: the recommended value was measured; change it only to test.
recognition.clock.stall.name=Clock: player stopped after
recognition.clock.stall.tip=How long the player's position may stay the same before the clock takes the player as stopped. Shorter: a pause is seen sooner; longer: a slow reading is not taken for a pause. Expert setting: the recommended value was measured; change it only to test.
recognition.clock.extrapolation.name=Clock: ahead of the last reading
recognition.clock.extrapolation.tip=How far past its last reading the clock may count on its own. Shorter: never runs ahead of the player; longer: smoother between readings. Expert setting: the recommended value was measured; change it only to test.
recognition.clock.seek-margin.name=Clock: jump taken as a seek
recognition.clock.seek-margin.tip=How far the player's position must jump for the clock to start over, as after a seek or a loop. Lower: a smaller jump restarts it; higher: only a large jump does. Expert setting: the recommended value was measured; change it only to test.
recognition.clock.latency-limit.name=Clock: largest latency
recognition.clock.latency-limit.tip=The largest latency offset accepted, typed by hand or measured by a calibration. Lower: a wrong measurement is refused sooner; higher: a slow sound card can still be compensated. Expert setting: the recommended value was measured; change it only to test.
recognition.timing.reference-beat.name=Timing: width read at the beat
recognition.timing.reference-beat.tip=The beat at which the width of the on-time window is read; at other tempos the window grows or shrinks with the beat. Shorter: the same width is wider at every tempo; longer: narrower. Expert setting: the recommended value was measured; change it only to test.
recognition.timing.advance.name=Timing: play before the red
recognition.timing.advance.tip=How long before a note turns red it may already be played in Follow mode (then early). Shorter: stricter; longer: an early note still counts. Expert setting: the recommended value was measured; change it only to test.
recognition.timing.gap.name=Timing: gap before the next note
recognition.timing.gap.tip=What is left between the end of a note's time to play and the next note turning red, so that two windows never meet. Shorter: longer windows in fast passages; longer: a clearer boundary. Expert setting: the recommended value was measured; change it only to test.
recognition.timing.clock-spread.name=Timing: unstable route from
recognition.timing.clock-spread.tip=How much the delay of the sound input may vary before the route is called unstable, which shows a warning and a reduced rhythm precision, never a block. Lower: warns sooner; higher: warns only on a very irregular route. Expert setting: the recommended value was measured; change it only to test.
recognition.follow-leniency.permissive.accept.name=Follow permissive: note accepted within
recognition.follow-leniency.permissive.accept.tip=How far from the written pitch a note is still accepted at this position; the learner's own setting is used when it is more lenient. Lower: no relaxation; higher: more lenient, a wrong note may pass. Expert setting: the recommended value was measured; change it only to test.
recognition.follow-leniency.permissive.confidence.name=Follow permissive: pitch confidence
recognition.follow-leniency.permissive.confidence.tip=How sure the pitch must be at this position; the learner's own setting is used when it is more lenient. Lower: more lenient; higher: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.follow-leniency.permissive.stability.name=Follow permissive: note held for
recognition.follow-leniency.permissive.stability.tip=How long a note must hold its pitch at this position; the learner's own setting is used when it is shorter. Shorter: quicker, more lenient; longer: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.follow-leniency.permissive.chord-evidence.name=Follow permissive: chord evidence
recognition.follow-leniency.permissive.chord-evidence.tip=How much of a chord must be heard at this position; the learner's own setting is used when it is more lenient. Lower: more lenient; higher: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.follow-leniency.permissive.chord-partials.name=Follow permissive: chord partials needed
recognition.follow-leniency.permissive.chord-partials.tip=How many partials of a chord note must be heard at this position; the learner's own setting is used when it is lower. Lower: more lenient; higher: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.follow-leniency.permissive.chord-confirm.name=Follow permissive: chord confirmed after
recognition.follow-leniency.permissive.chord-confirm.tip=How long a chord must be heard before it is confirmed at this position; the learner's own setting is used when it is shorter. Shorter: quicker; longer: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.follow-leniency.very-permissive.accept.name=Follow very permissive: note accepted within
recognition.follow-leniency.very-permissive.accept.tip=How far from the written pitch a note is still accepted at this position; the learner's own setting is used when it is more lenient. Lower: no relaxation; higher: more lenient, a wrong note may pass. Expert setting: the recommended value was measured; change it only to test.
recognition.follow-leniency.very-permissive.confidence.name=Follow very permissive: pitch confidence
recognition.follow-leniency.very-permissive.confidence.tip=How sure the pitch must be at this position; the learner's own setting is used when it is more lenient. Lower: more lenient; higher: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.follow-leniency.very-permissive.stability.name=Follow very permissive: note held for
recognition.follow-leniency.very-permissive.stability.tip=How long a note must hold its pitch at this position; the learner's own setting is used when it is shorter. Shorter: quicker, more lenient; longer: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.follow-leniency.very-permissive.chord-evidence.name=Follow very permissive: chord evidence
recognition.follow-leniency.very-permissive.chord-evidence.tip=How much of a chord must be heard at this position; the learner's own setting is used when it is more lenient. Lower: more lenient; higher: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.follow-leniency.very-permissive.chord-partials.name=Follow very permissive: chord partials needed
recognition.follow-leniency.very-permissive.chord-partials.tip=How many partials of a chord note must be heard at this position; the learner's own setting is used when it is lower. Lower: more lenient; higher: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.follow-leniency.very-permissive.chord-confirm.name=Follow very permissive: chord confirmed after
recognition.follow-leniency.very-permissive.chord-confirm.tip=How long a chord must be heard before it is confirmed at this position; the learner's own setting is used when it is shorter. Shorter: quicker; longer: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.arcade-leniency.fun.confidence.name=Arcade fun: pitch confidence
recognition.arcade-leniency.fun.confidence.tip=How sure the pitch must be at this position; the learner's own setting is used when it is more lenient. Lower: more lenient; higher: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.arcade-leniency.fun.stability.name=Arcade fun: note held for
recognition.arcade-leniency.fun.stability.tip=How long a note must hold its pitch at this position; the learner's own setting is used when it is shorter. Shorter: quicker, more lenient; longer: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.arcade-leniency.fun.chord-evidence.name=Arcade fun: chord evidence
recognition.arcade-leniency.fun.chord-evidence.tip=How much of a chord must be heard at this position; the learner's own setting is used when it is more lenient. Lower: more lenient; higher: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.arcade-leniency.fun.chord-partials.name=Arcade fun: chord partials needed
recognition.arcade-leniency.fun.chord-partials.tip=How many partials of a chord note must be heard at this position; the learner's own setting is used when it is lower. Lower: more lenient; higher: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.arcade-leniency.fun.chord-confirm.name=Arcade fun: chord confirmed after
recognition.arcade-leniency.fun.chord-confirm.tip=How long a chord must be heard before it is confirmed at this position; the learner's own setting is used when it is shorter. Shorter: quicker; longer: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.arcade-leniency.fun.tempo-window.name=Arcade fun: timing window widened
recognition.arcade-leniency.fun.tempo-window.tip=How much the learner's on-time window is widened at this position, never beyond its maximum. Lower: not widened; higher: wider. Expert setting: the recommended value was measured; change it only to test.
recognition.arcade-leniency.very-permissive.confidence.name=Arcade very permissive: pitch confidence
recognition.arcade-leniency.very-permissive.confidence.tip=How sure the pitch must be at this position; the learner's own setting is used when it is more lenient. Lower: more lenient; higher: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.arcade-leniency.very-permissive.stability.name=Arcade very permissive: note held for
recognition.arcade-leniency.very-permissive.stability.tip=How long a note must hold its pitch at this position; the learner's own setting is used when it is shorter. Shorter: quicker, more lenient; longer: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.arcade-leniency.very-permissive.chord-evidence.name=Arcade very permissive: chord evidence
recognition.arcade-leniency.very-permissive.chord-evidence.tip=How much of a chord must be heard at this position; the learner's own setting is used when it is more lenient. Lower: more lenient; higher: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.arcade-leniency.very-permissive.chord-partials.name=Arcade very permissive: chord partials needed
recognition.arcade-leniency.very-permissive.chord-partials.tip=How many partials of a chord note must be heard at this position; the learner's own setting is used when it is lower. Lower: more lenient; higher: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.arcade-leniency.very-permissive.chord-confirm.name=Arcade very permissive: chord confirmed after
recognition.arcade-leniency.very-permissive.chord-confirm.tip=How long a chord must be heard before it is confirmed at this position; the learner's own setting is used when it is shorter. Shorter: quicker; longer: no relaxation. Expert setting: the recommended value was measured; change it only to test.
recognition.arcade-leniency.very-permissive.tempo-window.name=Arcade very permissive: timing window widened
recognition.arcade-leniency.very-permissive.tempo-window.tip=How much the learner's on-time window is widened at this position, never beyond its maximum. Lower: not widened; higher: wider. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.bend.min-range.name=Bend: detected from
recognition.technique.bend.min-range.tip=How far the pitch of a note must move to be called a bend. Lower: smaller bends detected; higher: only large bends. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.bend.plain-range.name=Bend: plain note under
recognition.technique.bend.plain-range.tip=Under this much movement a note is called plain, not bent; between the two values the result is uncertain. Lower: fewer notes called plain; higher: more notes called plain. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.bend.min-duration.name=Bend: shortest note
recognition.technique.bend.min-duration.tip=A shorter note is too short to judge a bend: uncertain. Shorter: shorter notes judged; longer: only longer notes judged. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.bend.voiced.name=Bend: pitch heard for
recognition.technique.bend.voiced.tip=How much of the note must have a clear pitch to judge a bend. Lower: judged on less; higher: judged only on clean notes. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.bend.written-move.name=Bend: smallest written move
recognition.technique.bend.written-move.tip=A written bend smaller than this is not judged. Lower: tiny bends judged; higher: small bends not judged. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.bend.on-tolerance.name=Bend: on target within
recognition.technique.bend.on-tolerance.tip=How close to the written target the pitch reached must be to count as on target (or a share of the written move, whichever is larger). Lower: stricter; higher: more lenient. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.bend.on-share.name=Bend: on target within a share
recognition.technique.bend.on-share.tip=The same tolerance as a share of the written move, for large bends. Lower: stricter on large bends; higher: more lenient on large bends. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.bend.moved-share.name=Bend: under target, uncertain from
recognition.technique.bend.moved-share.tip=A bend under its target is uncertain when the pitch moved at least this share of the written move, not made otherwise. Lower: more often uncertain; higher: more often not made. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.bend.start-tolerance.name=Bend: pre-bend start within
recognition.technique.bend.start-tolerance.tip=How close to the bent pitch a pre-bend must start. Lower: stricter; higher: more lenient. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.bend.edge.name=Bend: start and end read over
recognition.technique.bend.edge.tip=How many analysis steps give the pitch at the start and at the end of a bend. Lower: more sensitive to the first and last moments; higher: steadier, less precise. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.slide.min-range.name=Slide: detected from
recognition.technique.slide.min-range.tip=How far the pitch must glide to be called a slide. Lower: shorter slides detected; higher: only long slides. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.slide.plain-range.name=Slide: plain note under
recognition.technique.slide.plain-range.tip=Under this much movement a note is called plain, not slid; between the two values the result is uncertain. Lower: fewer notes called plain; higher: more notes called plain. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.slide.monotony.name=Slide: one direction for
recognition.technique.slide.monotony.tip=How much of the movement must go one way for a slide. Lower: more lenient; higher: only clean glides. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.slide.steps.name=Slide: moving steps needed
recognition.technique.slide.steps.tip=A slide passes through pitches in between: how many analysis steps must move; a jump has one or two. Lower: a jump may count; higher: only slow glides. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.slide.min-duration.name=Slide: shortest note
recognition.technique.slide.min-duration.tip=A shorter note is too short to judge a slide: uncertain. Shorter: shorter notes judged; longer: only longer notes judged. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.slide.voiced.name=Slide: pitch heard for
recognition.technique.slide.voiced.tip=How much of the note must have a clear pitch to judge a slide. Lower: judged on less; higher: judged only on clean notes. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.vibrato.depth.name=Vibrato: detected from depth
recognition.technique.vibrato.depth.tip=How wide the pitch must wobble to be called a vibrato. Lower: shallower vibratos detected; higher: only wide vibratos. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.vibrato.plain-depth.name=Vibrato: plain note under
recognition.technique.vibrato.plain-depth.tip=Under this depth a note is called plain; between the two values the result is uncertain. Lower: fewer notes called plain; higher: more notes called plain. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.vibrato.min-rate.name=Vibrato: slowest rate
recognition.technique.vibrato.min-rate.tip=A slower wobble is not a vibrato. Lower: slow wobbles count; higher: only quick vibratos. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.vibrato.max-rate.name=Vibrato: fastest rate
recognition.technique.vibrato.max-rate.tip=A faster wobble is not a vibrato (a trill or noise). Lower: only moderate vibratos; higher: fast wobbles count. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.vibrato.min-duration.name=Vibrato: shortest note
recognition.technique.vibrato.min-duration.tip=A shorter note is too short to judge a vibrato: uncertain. Shorter: shorter notes judged; longer: only longer notes judged. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.vibrato.voiced.name=Vibrato: pitch heard for
recognition.technique.vibrato.voiced.tip=How much of the note must have a clear pitch to judge a vibrato. Lower: judged on less; higher: judged only on clean notes. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.legato.start-window.name=Legato: start looked at
recognition.technique.legato.start-window.tip=How much of the start of a note is looked at for a pick attack. Shorter: only the very start; longer: a longer start. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.legato.picked-rise.name=Legato: picked above a rise of
recognition.technique.legato.picked-rise.tip=A level rise above this at the start says the string was picked. Lower: more notes called picked; higher: fewer notes called picked. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.legato.rise.name=Legato: legato under a rise of
recognition.technique.legato.rise.tip=A level rise below this at the start is compatible with a hammer-on or pull-off. Lower: stricter; higher: more lenient. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.frame-confidence.name=Techniques: pitch confidence
recognition.technique.frame-confidence.tip=How sure a pitch reading must be to be used for a technique, in Wait and Follow modes. Lower: more readings used, less clean; higher: fewer readings, cleaner. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.motion.outlier.name=Techniques: stray pitch beyond
recognition.technique.motion.outlier.tip=A pitch reading further than this from the note's middle (an octave error, a neighbouring string) is set aside. Lower: more readings set aside; higher: more strays kept. Expert setting: the recommended value was measured; change it only to test.
recognition.technique.motion.min-voiced.name=Techniques: readings needed
recognition.technique.motion.min-voiced.tip=How many pitch readings a note needs before its technique is measured. Lower: short notes measured; higher: only longer notes. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.early-window.name=Calibration: note before its click
recognition.calibration.early-window.tip=How long before a click a note may begin and still belong to it. Shorter: an early note is lost; longer: an early note counts. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.late-window.name=Calibration: note after its click
recognition.calibration.late-window.tip=How long after a click a note may begin and still belong to it (the delay of the route and the player's reaction). Shorter: a slow route is not measured; longer: a very slow route is measured. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.pitch-patience.name=Calibration: pitch awaited for
recognition.calibration.pitch-patience.tip=How long after its attack is reported a note must show a pitch; a later pitch is another sound's. Shorter: stricter; longer: a slow pitch still counts. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.pitch-before.name=Calibration: pitch begun before
recognition.calibration.pitch-before.tip=How long before the attack the pitched sound may have begun; a note already ringing is not the attack's. Shorter: stricter; longer: a ringing note may count. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.same-pitch.name=Calibration: same pitch within
recognition.calibration.same-pitch.tip=A pitch that moves less than this is the same sound; more starts a new one. Lower: a small change is a new note; higher: a large change is the same sound. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.min-confidence.name=Calibration: pitch confidence
recognition.calibration.min-confidence.tip=How sure a pitch reading must be to count during the calibration. Lower: more lenient; higher: stricter. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.min-frequency.name=Calibration: lowest pitch
recognition.calibration.min-frequency.tip=A lower pitch is not taken for a note. Lower: low notes count; higher: only higher notes. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.max-frequency.name=Calibration: highest pitch
recognition.calibration.max-frequency.tip=A higher pitch is not taken for a note. Lower: only lower notes; higher: high notes count. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.min-usable.name=Calibration: notes needed
recognition.calibration.min-usable.tip=How many of the eight notes must be usable to keep the calibration. Lower: kept from fewer notes; higher: needs almost every note. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.outlier-deviations.name=Calibration: stray note beyond
recognition.calibration.outlier-deviations.tip=A note farther than this many usual deviations from the others is set aside. Lower: more notes set aside; higher: fewer notes set aside. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.outlier-floor.name=Calibration: never set aside within
recognition.calibration.outlier-floor.tip=A note this close to the others is never set aside. Shorter: a steady player may lose notes; longer: more notes kept. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.unstable-spread.name=Calibration: unstable above
recognition.calibration.unstable-spread.tip=When the usable notes spread more than this, the delay is not stable enough to be kept. Shorter: more often unstable; longer: kept more often. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.recognition-rate.name=Recognition rate kept
recognition.calibration.recognition-rate.tip=The share of the calibration piece a profile must recognise to be saved without asking and shown green. Lower: more profiles kept; higher: only very good profiles. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.calm-below.name=Calibration: calm below
recognition.calibration.calm-below.tip=Background noise below this is called calm. Lower: fewer rooms called calm; higher: more rooms called calm. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.loud-above.name=Calibration: loud above
recognition.calibration.loud-above.tip=Background noise above this is called loud. Lower: more rooms called loud; higher: fewer rooms called loud. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.sound-refractory.name=Calibration: one sound within
recognition.calibration.sound-refractory.tip=Two sounds closer than this are counted as one (the strings of a chord). Shorter: a strum may count as several; longer: close notes count as one. Expert setting: the recommended value was measured; change it only to test.
recognition.calibration.sound-lead.name=Calibration: sound cut before
recognition.calibration.sound-lead.tip=How long before each detected sound its part of the recording starts. Shorter: the very start may be cut; longer: more of the start kept. Expert setting: the recommended value was measured; change it only to test.
recognition.level-check.playing-confidence.name=Level check: playing confidence
recognition.level-check.playing-confidence.tip=How sure the pitch must be for the level check to count a moment as playing. Lower: more counted as playing; higher: only clear playing. Expert setting: the recommended value was measured; change it only to test.
recognition.level-check.required-playing.name=Level check: playing needed
recognition.level-check.required-playing.tip=How much playing the level check needs before it concludes. Shorter: concludes sooner; longer: surer, slower. Expert setting: the recommended value was measured; change it only to test.
recognition.level-check.suboptimal-share.name=Level check: too loud from
recognition.level-check.suboptimal-share.tip=The share of the playing that may saturate or be too loud before the input is called not ideal. Lower: warns sooner; higher: warns only on much saturation. Expert setting: the recommended value was measured; change it only to test.
recognition.input-quality.attacks.name=Weak input: attacks looked at
recognition.input-quality.attacks.tip=How many recent attacks give the level the learner plays at, before a weak input is told. Lower: told sooner; higher: steadier, told later. Expert setting: the recommended value was measured; change it only to test.
recognition.input-quality.remember.name=Weak input: attacks kept for
recognition.input-quality.remember.tip=How long an attack counts for the weak-input check. Shorter: only recent playing; longer: slow playing counts. Expert setting: the recommended value was measured; change it only to test.
recognition.input-quality.attack-window.name=Weak input: attack level over
recognition.input-quality.attack-window.tip=How long after each attack its strongest level is read. Shorter: only the very attack; longer: a slower swell counts. Expert setting: the recommended value was measured; change it only to test.

