practice.start.greyed.UNCHECKED=The start button waits for sound from your guitar: play a few notes so that the input level is checked, then it can be pressed.
practice.start.greyed.UNUSABLE=The start button waits for a usable input level: see the Level line in the Input tab.

# input gain (spec 002, FR-060..FR-066)
practice.gain.label=Input gain
practice.gain.reset=Reset
practice.gain.suggest=Suggest a gain
practice.gain.apply=Apply
practice.gain.suggestion.NONE=Play a few notes and press "Check again" first, then ask for a suggestion.
practice.gain.suggestion.OK=The level is already right: nothing to change.
practice.gain.suggestion.TOO_LOW=The signal is weak. Suggested gain: {0}.
practice.gain.suggestion.TOO_HIGH=The signal is strong. Suggested gain: {0}.
practice.gain.suggestion.NOISE_DOMINATED=The signal is weak and noisy: a boost to {0} would mostly amplify noise. Raise the gain on your audio interface or use a direct input instead.
practice.gain.warning.BOOST_AMPLIFIES_NOISE=The boost mostly amplifies background noise: raise the gain on your audio interface, or use a direct input.
practice.gain.warning.BOOST_CAUSES_CLIPPING=The boost makes the signal clip: lower the gain.

