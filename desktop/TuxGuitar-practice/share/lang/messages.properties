practice.technique.name.PULL_OFF=Pull-off
practice.technique.name.SLIDE=Slide
practice.technique.name.BEND=Bend
practice.technique.name.PRE_BEND=Pre-bend
practice.technique.name.RELEASE=Bend release
practice.technique.name.VIBRATO=Vibrato
practice.technique.name.PALM_MUTE=Palm mute
practice.technique.name.TREMOLO_PICKING=Tremolo picking
practice.technique.name.NATURAL_HARMONIC=Harmonic
practice.technique.name.ARTIFICIAL_HARMONIC=Artificial harmonic
practice.technique.name.PINCH_HARMONIC=Pinch harmonic
practice.technique.name.TAPPING=Tapping
practice.technique.verdict.DETECTED=heard
practice.technique.verdict.NOT_DETECTED=not heard
practice.technique.verdict.UNCERTAIN=uncertain
practice.technique.verdict.NOT_VERIFIABLE=cannot be checked yet

# measured limits shown to the learner (spec 004 T008, T009)
practice.delay.info=A note is recognised about {0} s after it is played, in most cases within {1} s (measured on real recordings). Notes closer than about {2} s to each other may not be followed: Practice then waits for you.
practice.speed-limit=↯ A note came faster than recognition can follow (closer than about {0} s to the previous one). This is a limit of the recognition, not a mistake: play the note again, a little slower.

# input too weak for reliable fast recognition (spec 002 FR-015)
practice.input.too-weak=Input too weak for reliable fast recognition: your notes reach only about {0} dBFS. Raise the input gain (or the gain of your audio interface), or play closer to the microphone.

# ---- Tempo-following mode (spec 002, T100) ----
practice.mode=Practice mode
practice.mode.wait=Wait for the right note
practice.mode.follow=Follow the tempo
practice.mode.wait.hint=The score waits for you: play each note when you are ready.
practice.mode.follow.hint=The score plays at its tempo, with a count-in, and the other tracks sound; the track you practise is silent. Each note is judged on time, early, late or missed.
practice.chord-leniency=Chord check
practice.chord-leniency.strict=Strict
practice.chord-leniency.normal=Normal
practice.chord-leniency.lenient=Lenient
practice.chord-leniency.custom=Custom
practice.chord-leniency.strict.line=A chord is never accepted on the attack of the strum alone: fewer chords almost right are accepted, and some right ones may be refused.
