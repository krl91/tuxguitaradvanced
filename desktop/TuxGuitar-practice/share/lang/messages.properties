recognition.section.ADVANCED=Advanced
recognition.apply-note=Changes are saved with OK; Cancel keeps the previous values. Tuner values apply at once, practice values at the next Start; level and attack values briefly restart the listening. Hover over a setting's name to see what it does. More in Help › Audio recognition.
