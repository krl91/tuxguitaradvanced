practice.fire.sparks.rise.tip=How many rows a spark climbs over its life, at least.
practice.fire.sparks.riseSpread=Spread of the climb
practice.fire.sparks.riseSpread.tip=How many more rows some sparks climb than others, so that they spread out.
practice.fire.sparks.drift=Spark drift
practice.fire.sparks.drift.tip=How far the sparks drift sideways over their life, in columns.
practice.fire.sparks.zone=Spark zone
practice.fire.sparks.zone.tip=The share of the width, from each corner, where the sparks are thrown.
practice.fire.sparks.start=Spark start height
practice.fire.sparks.start.tip=Where the sparks start: 0 at the bottom of the flames, 100 % at their tips.
practice.fire.sparks.fade=Spark cooling
practice.fire.sparks.fade.tip=How many colour steps a spark cools by over its life, from white towards red.
practice.fire.colour.steps=Colour steps
practice.fire.colour.steps.tip=How many steps of colour the fire has from its coldest to its hottest. Fewer gives a flatter, poster-like fire.
practice.fire.colour.1=Coldest colour
practice.fire.colour.1.tip=The colour of the coldest part of the fire, at its edges.
practice.fire.colour.2=Second colour
practice.fire.colour.2.tip=The second colour of the fire, from cold to hot.
practice.fire.colour.3=Middle colour
practice.fire.colour.3.tip=The colour in the middle of the scale of the fire, from cold to hot.
practice.fire.colour.4=Fourth colour
practice.fire.colour.4.tip=The fourth colour of the fire, from cold to hot.
practice.fire.colour.5=Hottest colour
practice.fire.colour.5.tip=The colour of the hottest part of the fire.
# spec 022: the Amp and effects window
practice.amp.open=Amp and effects…
practice.amp.open.tip=Opens the window where your guitar is heard through an amp and its cabinet, with the score.
practice.amp.title=Amp and effects
practice.amp.enabled=Hear my guitar through the amp
practice.amp.enabled.tip=Plays your guitar through the amp while the practice window is open. Off by default. Use headphones: speakers can howl with a microphone.
practice.amp.output=Output
practice.amp.output.tip=Where the amp sound is played: headphones are best. The system's default by default.
practice.amp.output.default=System default
practice.amp.guitar-volume=Guitar volume
practice.amp.guitar-volume.tip=How loud your guitar is heard, from 0 to 100 %. Default 70 %.
practice.amp.score-volume=Score volume
practice.amp.score-volume.tip=How loud the score plays (TuxGuitar's volume), from 0 to 10 on a scale of 0–10. Default 10.
practice.amp.delay=Delay:
practice.amp.delay.tip=The time between your note and its sound, worked out from the devices (an estimate). Bluetooth headphones add their own delay: use wired ones.
practice.amp.delay.value=about {0} ms (estimate)
practice.amp.delay.unknown=not known while the sound is off
practice.amp.amp=Amp
practice.amp.character=Character
practice.amp.character.tip=The kind of amp: Clean stays clear, Crunch breaks up when you dig in, High gain distorts a lot. Default Clean.
practice.amp.character.clean=Clean
practice.amp.character.crunch=Crunch
practice.amp.character.high-gain=High gain
practice.amp.gain=Gain
practice.amp.gain.tip=How hard the amp is driven: more gain, more distortion. On a scale of 0–10, default 3.
practice.amp.bass=Bass
practice.amp.bass.tip=The low frequencies (around 100 Hz), cut or boosted. On a scale of 0–10, default 5 (flat).
practice.amp.middle=Middle
practice.amp.middle.tip=The middle frequencies (around 700 Hz), cut or boosted. On a scale of 0–10, default 5 (flat).
practice.amp.treble=Treble
practice.amp.treble.tip=The high frequencies (above 2 kHz), cut or boosted. On a scale of 0–10, default 6.
practice.amp.volume=Volume
practice.amp.volume.tip=The amp's own output level. On a scale of 0–10, default 6.
practice.amp.cabinet=Speaker simulation
practice.amp.cabinet.tip=Simulates the speaker of a real amp after the amp: it softens the harsh highs and lows. On by default.
practice.amp.unit.scale=0–10
practice.amp.unit.percent=%
practice.amp.failed=The amp sound stopped: {0}
practice.amp.clipping=Your input is clipping: lower the gain of your interface or of the input.
practice.amp.before=Before the amp
practice.amp.after=After the amp
practice.amp.unit.db=dB
practice.amp.unit.ms=ms
practice.amp.unit.hz=Hz
practice.amp.add-pedal=Add pedal
practice.amp.add-pedal.tip=Adds a pedal that is not in the chain yet: the gate, compressor, overdrive and distortion go before the amp, the chorus, echo and reverb after it.
practice.amp.pedal.up=▲
practice.amp.pedal.up.tip=Moves this pedal one place earlier in its section: the sound goes through it sooner.
practice.amp.pedal.down=▼
practice.amp.pedal.down.tip=Moves this pedal one place later in its section: the sound goes through it later.
practice.amp.pedal.remove=✕
practice.amp.pedal.remove.tip=Takes this pedal out of the chain. Add pedal puts it back with its default settings.
practice.amp.sound=Sound
practice.amp.sound.tip=The sound your guitar is heard with: the ready-made ones first, then yours. Picking one is heard at once and is remembered for the score in front. Default Clean.
practice.amp.sound-name=Name
practice.amp.sound-name.tip=The name of the sound: from 1 to 40 characters, not the name of a ready-made sound.
practice.amp.save-as=Save as
practice.amp.save-as.tip=Keeps the chain as it is now under the name typed beside it. One of your sounds with that name is replaced.
practice.amp.rename=Rename…
practice.amp.rename.tip=Gives a new name to the current sound. Only your own sounds can be renamed.
practice.amp.delete=Delete
practice.amp.delete.tip=Deletes the current sound and goes back to Clean. Only your own sounds can be deleted.
practice.amp.restore=Restore
practice.amp.restore.tip=Brings a changed ready-made sound back as it was shipped.
practice.amp.save=Save…
practice.amp.save.tip=Keeps the chain as it is now under a name you type. One of your sounds with that name is replaced.
practice.amp.more=⋯
practice.amp.more.tip=More for the current sound: rename it, delete it, or restore a changed ready-made sound.
practice.amp.name-prompt.ok=OK
practice.amp.name-prompt.ok.tip=Uses this name.
practice.amp.name-prompt.cancel=Cancel
practice.amp.name-prompt.cancel.tip=Closes this window without changing anything.
practice.amp.name-prompt.save-title=Save the sound
practice.amp.name-prompt.rename-title=Rename the sound
practice.amp.tab.before=Pedals before the amp
practice.amp.tab.amp=Amp
practice.amp.tab.after=Effects after the amp
practice.amp.tab.output=Output
practice.amp.changed=(changed)
practice.amp.name.ready-made=That name belongs to a ready-made sound: choose another one.
practice.amp.name.too-long=A sound's name has at most {0} characters.
practice.amp.warning.title=Use headphones
practice.amp.warning.text=Your input is the computer's built-in microphone. Through the speakers, the amp sound goes back into the microphone and can howl loudly. Plug in headphones, or choose your guitar's input, before turning the sound on.
practice.amp.warning.turn-on=Turn on anyway
practice.amp.warning.turn-on.tip=Starts the amp sound with the built-in microphone. A howl is cut within half a second.
practice.amp.warning.cancel=Cancel
practice.amp.warning.cancel.tip=Keeps the sound off.
practice.amp.feedback=A howl was heard: the amp sound was cut. Use headphones or lower the guitar volume, then turn the sound on again.
practice.amp.overload=The computer cannot keep up even with the amp alone: the sound was cut. Close other programs, then turn the sound on again.
practice.amp.device-lost=The audio device was lost ({0}): the amp sound stopped, the practice goes on. Plug the device back in and turn the sound on again.
practice.amp.lighter.reverb-off=The computer is struggling: the reverb was turned off.
practice.amp.lighter.chorus-off=The computer is struggling: the chorus was turned off.
practice.amp.lighter.oversampling-2x=The computer is struggling: the amp's detail was lowered.
practice.amp.lighter.oversampling-1x=The computer is struggling: the amp's detail was lowered again.
practice.amp.lighter.amp-alone=The computer is struggling: only the amp and the cabinet are kept, the pedals are bypassed.
practice.amp.pedal.gate=Noise gate
practice.amp.pedal.gate.tip=Silences the hiss and hum between your notes. Click to switch it on or off.
practice.amp.pedal.gate.threshold=Threshold
practice.amp.pedal.gate.threshold.tip=Below this level the gate closes: raise it if you still hear hiss, lower it if it cuts your soft notes. In dB, default -60.
practice.amp.pedal.gate.release=Release
practice.amp.pedal.gate.release.tip=How long the gate takes to close once you stop playing: longer keeps the end of your notes. In ms, default 150.
practice.amp.pedal.compressor=Compressor
practice.amp.pedal.compressor.tip=Evens out loud and soft notes and makes them last longer. Click to switch it on or off.
practice.amp.pedal.compressor.sustain=Sustain
practice.amp.pedal.compressor.sustain.tip=How much the loud notes are brought down and the soft ones up. On a scale of 0–10, default 5.
practice.amp.pedal.compressor.attack=Attack
practice.amp.pedal.compressor.attack.tip=How fast the compressor reacts to a note: slower lets the pick's attack through. In ms, default 10.
practice.amp.pedal.compressor.level=Level
practice.amp.pedal.compressor.level.tip=The pedal's output level; 5 leaves it unchanged. On a scale of 0–10, default 5.
practice.amp.pedal.overdrive=Overdrive
practice.amp.pedal.overdrive.tip=A warm, smooth breakup, like a small amp pushed hard. Click to switch it on or off.
practice.amp.pedal.overdrive.drive=Drive
practice.amp.pedal.overdrive.drive.tip=How hard the sound is pushed: more drive, more breakup. On a scale of 0–10, default 5.
practice.amp.pedal.overdrive.tone=Tone
practice.amp.pedal.overdrive.tone.tip=Darker towards 0, brighter towards 10. On a scale of 0–10, default 5.
practice.amp.pedal.overdrive.level=Level
practice.amp.pedal.overdrive.level.tip=The pedal's output level; 5 leaves it unchanged. On a scale of 0–10, default 5.
practice.amp.pedal.distortion=Distortion
practice.amp.pedal.distortion.tip=A hard, saturated sound for riffs and solos. Click to switch it on or off.
practice.amp.pedal.distortion.gain=Gain
practice.amp.pedal.distortion.gain.tip=How much the sound is distorted. On a scale of 0–10, default 6.
practice.amp.pedal.distortion.tone=Tone
practice.amp.pedal.distortion.tone.tip=Darker towards 0, brighter towards 10. On a scale of 0–10, default 5.
practice.amp.pedal.distortion.level=Level
practice.amp.pedal.distortion.level.tip=The pedal's output level; 5 leaves it unchanged. On a scale of 0–10, default 5.
practice.amp.pedal.chorus=Chorus
practice.amp.pedal.chorus.tip=Doubles your guitar with a slightly moving copy, for a wide, shimmering sound. Click to switch it on or off.
practice.amp.pedal.chorus.rate=Rate
practice.amp.pedal.chorus.rate.tip=How fast the copy moves. In Hz, default 0.8.
practice.amp.pedal.chorus.depth=Depth
practice.amp.pedal.chorus.depth.tip=How far the copy moves: more depth, more shimmer. On a scale of 0–10, default 5.
practice.amp.pedal.chorus.mix=Mix
practice.amp.pedal.chorus.mix.tip=How much of the copy is heard beside your guitar; 0 % is your guitar alone. In %, default 50.
practice.amp.pedal.echo=Echo
practice.amp.pedal.echo.tip=Repeats your notes after a delay; the repeats go on after you stop. Click to switch it on or off.
practice.amp.pedal.echo.time=Time
practice.amp.pedal.echo.time.tip=The time between a note and its repeat, up to 1.5 s. In ms, default 380.
practice.amp.pedal.echo.repeats=Repeats
practice.amp.pedal.echo.repeats.tip=How many repeats you hear before they die away. On a scale of 0–10, default 3.
practice.amp.pedal.echo.tone=Tone
practice.amp.pedal.echo.tone.tip=Darker repeats towards 0, brighter towards 10. On a scale of 0–10, default 5.
practice.amp.pedal.echo.mix=Mix
practice.amp.pedal.echo.mix.tip=How loud the repeats are beside your guitar; 0 % is your guitar alone. In %, default 30.
practice.amp.pedal.reverb=Reverb
practice.amp.pedal.reverb.tip=Puts your guitar in a room or a hall. Click to switch it on or off.
practice.amp.pedal.reverb.size=Size
practice.amp.pedal.reverb.size.tip=The size of the room: bigger, longer tail. On a scale of 0–10, default 5.
practice.amp.pedal.reverb.damping=Damping
practice.amp.pedal.reverb.damping.tip=How quickly the highs fade in the tail: more damping, softer room. On a scale of 0–10, default 5.
practice.amp.pedal.reverb.mix=Mix
practice.amp.pedal.reverb.mix.tip=How much of the room is heard beside your guitar; 0 % is your guitar alone. In %, default 25.

# spec 025: the line under a greyed start button, and Check again
practice.start.blocker.not-checked=To start, play a few notes: the input has not heard your guitar yet.
practice.start.blocker.no-signal=Nothing was heard from your guitar. Check that it is plugged in and its volume is up, then play a few notes: the check starts again by itself.
practice.start.blocker.saturating=Your input is saturating. Lower the gain of your interface or the gain of the Input tab, then play: the check starts again by itself.
practice.start.blocker.input-lost=The input was lost. Plug your interface back in, then press Check again.
practice.start.blocker.access-refused=Access to the microphone seems refused. Allow it in the system settings (Privacy), then press Check again.
practice.start.blocker.checking=Listening to your guitar… keep playing a few notes.
practice.start.blocker.no-track=Choose a track to practise in the Track tab.
practice.start.check-again=Check again
