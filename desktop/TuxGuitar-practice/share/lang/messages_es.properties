recognition.apply-note=Los cambios se guardan con Aceptar; Cancelar conserva los valores anteriores. Los valores del afinador se aplican al instante, los de la práctica en el siguiente Inicio; los valores de nivel y de ataque reinician brevemente la escucha. Pasa el ratón sobre el nombre de un ajuste para ver qué hace. Más información en Ayuda › Reconocimiento de audio.
