recognition.input.level.min.name=Nivel mínimo utilizable
recognition.input.level.min.tip=Un sonido más débil se indica como «demasiado bajo» y nunca se acepta en la práctica. Más bajo: funciona con una señal más débil, pero también escucha más ruido de la sala. Más alto: necesita una guitarra más fuerte.
recognition.input.level.max.name=Aviso de nivel alto
recognition.input.level.max.tip=Un sonido más fuerte se indica como «demasiado alto» (riesgo de distorsión). Más bajo: avisa antes. Más alto: avisa solo cerca de la distorsión.
recognition.input.noise-reduction.name=Reducir el ruido de fondo
recognition.input.noise-reduction.tip=Elimina el zumbido y el ruido de fondo entre las notas antes de analizarlas. Desactivado deja la entrada exactamente como está.
recognition.input.gain-suggestion.name=Sugerir una ganancia de entrada
recognition.input.gain-suggestion.tip=Tras la comprobación del nivel, propone una ganancia que lleva el nivel al intervalo utilizable. Solo se aplica cuando la confirmas.
recognition.tuner.in-tune.name=Margen de afinación
recognition.tuner.in-tune.tip=Cuánto puede alejarse una cuerda del objetivo para mostrarse «afinada» (afinador y pantalla de la práctica). Más pequeño: afinación más precisa, más difícil de lograr. Más grande: más fácil, menos precisa.
recognition.tuner.hold.name=Conservar la última nota
recognition.tuner.hold.tip=Cuando la cuerda se apaga, el afinador sigue mostrando en gris la última nota fiable en lugar de quedarse en blanco.
recognition.note.accept.name=Margen de altura aceptado
recognition.note.accept.tip=Cuánto puede alejarse una nota tocada de la nota escrita (en cents) y seguir contando como correcta. Más pequeño: más estricto con la afinación y los bends. Más grande: más permisivo, pero una nota vecina nunca se acepta. Nunca menor que el margen de afinación.
recognition.note.fret-sharp.name=Tolerancia de agudo por traste
recognition.note.fret-sharp.tip=Pisar una cuerda en un traste la tensa, así que las notas pisadas suenan algo agudas, más cuanto más arriba en el mástil (se nota en guitarras reales). Esto añade esos cents por traste al margen aceptado, solo hacia el lado agudo. 0 lo desactiva; el lado grave y una nota vecina nunca se ven afectados.
recognition.note.confidence.name=Certeza mínima
recognition.note.confidence.tip=Cuán seguro debe estar el detector antes de juzgar una nota. Más baja: reacciona a notas más débiles o ruidosas, con más errores. Más alta: menos errores, pero puede esperar en las notas suaves.
recognition.note.stability.name=Tiempo para confirmar una nota
recognition.note.stability.tip=Cuánto tiempo debe sonar la nota correcta antes de aceptarse, y una nota incorrecta antes de marcarse como errónea. Más corto: reacción más rápida, más riesgo por falsos positivos. Más largo: más estable, más lento en pasajes rápidos.
recognition.note.attack.name=Sensibilidad al ataque de la púa
recognition.note.attack.tip=Cuán fuerte debe ser una subida repentina del sonido para contar como un nuevo ataque (cada nota necesita uno). Más baja: detecta ataques suaves, pero los golpes y el ruido pueden contar. Más alta: ignora más ruido, puede perder pulsaciones suaves.
recognition.note.legato.name=Hammer-ons, pull-offs, slides
recognition.note.legato.tip=Hoy cada nota necesita su propio ataque, así que las notas ligadas pueden tener que pulsarse de nuevo o saltarse. Aceptar el legato sin ataque es una propuesta todavía en estudio.
recognition.note.legato.option.strict=Nuevo ataque para cada nota
recognition.note.technique.name=Comprobar las técnicas de ejecución
recognition.note.technique.tip=Intenta oír las técnicas escritas en la partitura (hammer-on, pull-off, slide, bend, vibrato...) e indica lo que se oyó, sin bloquear nunca el ejercicio. Desactivado: toda técnica se muestra como no verificable.
recognition.tempo.window.name=Ventana de tiempo (Arcade)
recognition.tempo.window.tip=Cuánto puede alejarse una nota de su tiempo escrito y seguir contando como a tiempo en Arcade, en milisegundos a cada lado a 120 pulsos por minuto (la ventana real crece y se reduce con el tempo). Una ventana más ancha es más permisiva. Es el mismo valor que el control deslizante de la pestaña Modo de la ventana de práctica en Arcade. Seguir el tempo usa en su lugar el tiempo para tocar la nota.
recognition.follow.play-time.name=Tiempo para tocar la nota (Seguir el tempo)
recognition.follow.play-time.tip=En Seguir el tempo, cuánto tiempo después de su tiempo escrito se puede tocar una nota y que siga aceptada, en milisegundos. Una nota también puede llegar un poco antes, menos cuando las notas están juntas. Un tiempo más largo es más permisivo. Es el mismo valor que el control deslizante Tiempo para tocar la nota de la pestaña Modo de la ventana de práctica en Seguir el tempo.
recognition.chord.evidence.name=Exigencia en los acordes
recognition.chord.evidence.tip=Parte de los armónicos propios de una cuerda que debe oírse para que cuente en un acorde. Más baja: acepta cuerdas más débiles, puede aceptar una que falta. Más alta: más estricta, puede rechazar una cuerda real pero suave. Solo con la regla «Cada cuerda por separado».
recognition.chord.window.name=Ventana de rasgueo
recognition.chord.window.tip=Tiempo tras el rasgueo dentro del cual deben oírse todas las cuerdas. Más corto: exige un rasgueo rápido y uniforme. Más largo: permite rasgueos lentos en arpegio.
recognition.chord.completeness.name=Regla de acordes
recognition.chord.completeness.tip=Cómo se juzga un acorde. Nombres de las notas en el rasgueo: las notas del acorde deben oírse juntas durante el rasgueo, sea cual sea la digitación (recomendado). Cada cuerda por separado: toda cuerda que se pueda comprobar por separado debe oírse; las cuerdas que no se pueden distinguir se muestran como no comprobadas. Elegir un nivel de comprobación de acordes en la ventana de práctica fija este valor; cambiarlo aquí hace que el nivel pase a Personalizado.
recognition.chord.completeness.option.all-verifiable=Cada cuerda por separado
recognition.chord.completeness.option.profile=Nombres de las notas en el rasgueo
recognition.chord.foreign.name=Cuerdas de más que no son del acorde
recognition.chord.foreign.tip=Las cuerdas de más que no están en el acorde todavía no se comprueban. Rechazarlas exige primero grabaciones reales de acordes (propuesta en estudio).
recognition.chord.foreign.option.ignore=Todavía no se comprueba
recognition.chord.profile.match.name=Coincidencia del acorde
recognition.chord.profile.match.tip=Cuánto deben coincidir con el acorde los nombres de las notas oídas durante el rasgueo. Más baja: acepta más, puede aceptar un acorde con una nota equivocada. Más alta: más estricta, puede rechazar un acorde correcto. Solo con la regla «Nombres de las notas en el rasgueo». Elegir un nivel de comprobación de acordes en la ventana de práctica fija este valor; cambiarlo aquí hace que el nivel pase a Personalizado.
recognition.chord.profile.names.name=Nota más débil de un acorde
recognition.chord.profile.names.tip=Una nota del acorde oída por debajo de esta parte de su nota más fuerte cuenta como ausente; un acorde al que le faltan dos notas siempre se rechaza. Solo con la regla «Nombres de las notas en el rasgueo».
recognition.chord.attack.name=Aceptar un acorde por su ataque
recognition.chord.attack.tip=Un acorde puede aceptarse desde el ataque del rasgueo. Con la regla «Nombres de las notas en el rasgueo», nunca cuando faltan dos notas del acorde. Elegir un nivel de comprobación de acordes en la ventana de práctica fija este valor; cambiarlo aquí hace que el nivel pase a Personalizado.
recognition.chord.detail.top.name=Nota más alta contada
recognition.chord.detail.top.tip=La altura más alta (número MIDI, 84 = do 6) cuyo sonido cuenta en los nombres de las notas de un acorde. Ajuste técnico.
recognition.chord.detail.settle.name=Tiempo antes de juzgar un acorde
recognition.chord.detail.settle.tip=Cuánto tiempo se escucha un rasgueo antes de que el acorde pueda aceptarse por los nombres de sus notas. Ajuste técnico.
recognition.passage.measures.name=Repetir pasajes
recognition.passage.measures.tip=Divide la canción en pasajes y repite uno cuando demasiadas notas fueron incorrectas o saltadas. Desactivado toca de seguido. Es el valor que se usa al iniciar TuxGuitar; la ventana de práctica puede cambiarlo para la sesión actual.
recognition.passage.measures.option.0=Desactivado (tocar seguido)
recognition.passage.measures.option.1=Cada compás
recognition.passage.measures.option.2=Cada 2 compases
recognition.passage.measures.option.4=Cada 4 compases
recognition.passage.threshold.name=Repetir cuando los errores superen
recognition.passage.threshold.tip=Parte de notas y acordes incorrectos o saltados en un pasaje por encima de la cual se vuelve a tocar.
recognition.passage.threshold.option.25=25 %
recognition.passage.threshold.option.50=50 %
recognition.passage.threshold.option.75=75 %
recognition.passage.retries.name=Máximo de repeticiones
recognition.passage.retries.tip=Cuántas veces se repite como máximo un pasaje antes de que la práctica continúe. 0 nunca repite.
recognition.engine.pitch.name=Motor de detección de altura
recognition.engine.pitch.tip=El método que encuentra la nota que se toca. Esta versión tiene un solo motor (FastYin, una nota cada vez); los acordes se comprueban aparte contra el acorde escrito.
recognition.engine.pitch.option.automatic=Automático ({0})
recognition.engine.pitch.option.native=Nativo (Rust)
recognition.engine.pitch.option.fastyin=Java (FastYin)
recognition.engine.pitch.tip.v2=El método que encuentra las notas y los acordes que se tocan. Nativo (Rust): el análisis se hace en la biblioteca nativa, con menos retardo. Java (FastYin): el análisis de las versiones anteriores. Automático usa el motor nativo si puede arrancar; si no, Java. Un cambio se aplica a partir de la próxima práctica.
recognition.engine.notice.library-missing=El motor de reconocimiento nativo no se pudo cargar: la práctica sigue con el motor Java.
recognition.engine.notice.device-not-found=El motor de reconocimiento nativo no encontró la entrada: la práctica sigue con el motor Java.
recognition.engine.notice.format-unsupported=El motor de reconocimiento nativo no puede leer el formato de esta entrada: la práctica sigue con el motor Java.
recognition.engine.notice.stream-failed=El motor de reconocimiento nativo no pudo arrancar en esta entrada: la práctica sigue con el motor Java.
recognition.advanced.level.clip-sample.name=Nivel de muestra saturada
recognition.advanced.level.clip-sample.tip=Una muestra igual o superior a esta parte de la escala completa cuenta como saturada. Ajuste técnico.
recognition.advanced.level.clip-share.name=Proporción de saturación
recognition.advanced.level.clip-share.tip=Proporción de muestras saturadas en una trama por encima de la cual la entrada se indica como saturada. Ajuste técnico.
recognition.advanced.tuner.confidence.name=Certeza mínima del afinador
recognition.advanced.tuner.confidence.tip=Cuán seguro debe estar el detector antes de que el afinador muestre una nota. Más baja: muestra notas más débiles, más parpadeo. Más alta: más estable, puede quedarse en blanco con notas suaves.
recognition.advanced.attack.min-level.name=Umbral de detección de ataque
recognition.advanced.attack.min-level.tip=Un sonido más débil que esto nunca se toma como un nuevo ataque. Más bajo: detecta ataques muy suaves, más ruido. Más alto: ignora el ruido débil.
recognition.advanced.chord.min-partials.name=Armónicos por cuerda en acordes
recognition.advanced.chord.min-partials.tip=Cuántos de los armónicos propios de una cuerda deben oírse para que cuente en un acorde; las cuerdas con menos armónicos propios no se pueden comprobar por separado. Ajuste técnico. Solo con la regla «Cada cuerda por separado».
recognition.advanced.chord.confirm.name=Tiempo para confirmar un acorde
recognition.advanced.chord.confirm.tip=Cuánto tiempo deben oírse juntas todas las cuerdas del acorde antes de aceptarlo. Ajuste técnico.

# spec 026: the engines' own values, one category per family
recognition.onset.flux-factor.name=Ataque: factor de flujo
recognition.onset.flux-factor.tip=Cuánto debe superar el cambio del espectro su mediana reciente para un nuevo ataque. Más bajo: más ataques encontrados, más falsos; más alto: menos ataques falsos, más notas repetidas perdidas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.onset.flux-offset.name=Ataque: margen de flujo
recognition.onset.flux-offset.tip=Un margen fijo sumado a esa mediana antes de que un cambio cuente como ataque. Más bajo: más sensible en pasajes suaves; más alto: menos ataques por ruido. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.onset.refractory.name=Ataque: reposo tras un ataque
recognition.onset.refractory.tip=Cuánto tiempo después de un ataque no se señala ningún otro. Más corto: las notas repetidas rápidas se oyen todas; más largo: una nota nunca cuenta dos veces. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.onset.pre-first.name=Ataque: nivel antes, desde
recognition.onset.pre-first.tip=Dónde empieza la medida del nivel antes del ataque, contando hacia atrás desde el ataque. Más lejos: una nota anterior que aún suena oculta más notas repetidas; más cerca: se encuentran mejor las notas repetidas sobre una nota que se apaga. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.onset.pre-last.name=Ataque: nivel antes, hasta
recognition.onset.pre-last.tip=Dónde termina la medida del nivel antes del ataque, contando hacia atrás desde el ataque. Más cerca del ataque: la subida se mide frente al nivel más reciente, y un sonido que crece lentamente da menos ataques; más lejos, una subida gradual se toma más fácilmente por un ataque. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.onset.post-first.name=Ataque: nivel después, desde
recognition.onset.post-first.tip=Dónde empieza la medida del nivel después del ataque. Antes: el transitorio mismo cuenta más; después: solo cuenta el nivel sostenido. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.onset.post-last.name=Ataque: nivel después, hasta
recognition.onset.post-last.tip=Dónde termina la medida del nivel después del ataque; el ataque se señala entonces. Antes: ataques señalados más pronto, con menos sonido; después: más seguro, pero señalado más tarde. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.onset-fast.flux-factor.name=Pasaje rápido: factor de flujo
recognition.onset-fast.flux-factor.tip=En pasajes rápidos: cuánto debe superar el cambio del espectro su mediana reciente para un nuevo ataque. Más bajo: más ataques encontrados, más falsos. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.onset-fast.flux-offset.name=Pasaje rápido: margen de flujo
recognition.onset-fast.flux-offset.tip=En pasajes rápidos: el margen fijo sumado a esa mediana antes de que un cambio cuente como ataque. Más bajo: más sensible; más alto: menos ataques por ruido. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.onset-fast.refractory.name=Pasaje rápido: reposo tras un ataque
recognition.onset-fast.refractory.tip=En pasajes rápidos: cuánto tiempo después de un ataque no se señala ningún otro. Más corto: las notas más cercanas se oyen todas; más largo: una nota nunca cuenta dos veces. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.onset-fast.pre-first.name=Pasaje rápido: nivel antes, desde
recognition.onset-fast.pre-first.tip=En pasajes rápidos: dónde empieza la medida del nivel antes del ataque, contando hacia atrás desde el ataque. Más cerca: una nota anterior que se apaga oculta menos notas repetidas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.onset-fast.pre-last.name=Pasaje rápido: nivel antes, hasta
recognition.onset-fast.pre-last.tip=En pasajes rápidos: dónde termina la medida del nivel antes del ataque, contando hacia atrás desde el ataque. Más cerca del ataque: un sonido que crece lentamente da menos ataques; más lejos, una subida gradual se toma más fácilmente por un ataque. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.onset-fast.post-first.name=Pasaje rápido: nivel después, desde
recognition.onset-fast.post-first.tip=En pasajes rápidos: dónde empieza la medida del nivel después del ataque. Antes: el transitorio mismo cuenta más. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.onset-fast.post-last.name=Pasaje rápido: nivel después, hasta
recognition.onset-fast.post-last.tip=En pasajes rápidos: dónde termina la medida del nivel después del ataque; el ataque se señala entonces. Antes: señalado más pronto, con menos sonido. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.pitch.yin-threshold.name=Altura: umbral YIN
recognition.pitch.yin-threshold.tip=Qué tan clara debe ser la periodicidad del sonido para que el motor YIN dé una altura. Más bajo: solo las notas claras tienen altura, menos errores de octava; más alto: las notas ruidosas o débiles también, más falsas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.pitch.target-search.name=Altura: búsqueda de la nota esperada
recognition.pitch.target-search.tip=Hasta dónde, alrededor del período de una nota esperada, busca la comprobación de esa nota. Más estrecho: una nota algo desafinada se confirma menos; más ancho: una nota vecina se toma más a menudo por ella. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.pitch.target-periods.name=Altura: períodos de la nota esperada
recognition.pitch.target-periods.tip=Cuántos períodos del sonido compara la comprobación de una nota esperada. Menos: una respuesta más rápida con menos sonido; más: una respuesta más estable que necesita una nota más larga. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.pitch.max-sharp.name=Altura: lado agudo máximo
recognition.pitch.max-sharp.tip=Cuánto puede estar una nota demasiado aguda como máximo y seguir aceptada, sume lo que sume el margen de los trastes. Más bajo: los trastes altos apretados se rechazan antes; más alto: hasta justo debajo del semitono siguiente. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.pitch.attack-candidates-low.name=Altura: candidato de ataque más grave
recognition.pitch.attack-candidates-low.tip=La altura vecina más grave que la comprobación de ataques compara con las notas esperadas. Más bajo: una nota falsa grave también puede competir; más alto: menos cálculo, menos notas falsas graves vistas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.pitch.attack-candidates-high.name=Altura: candidato de ataque más agudo
recognition.pitch.attack-candidates-high.tip=La altura vecina más aguda que la comprobación de ataques compara con las notas esperadas. Más alto: una nota falsa aguda también puede competir; más bajo: menos cálculo, menos notas falsas agudas vistas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.polyphonic.candidate-low.name=Espectro: candidato más grave
recognition.polyphonic.candidate-low.tip=La altura más grave que busca el espectro de acordes. Más bajo: se encuentran las cuerdas más graves de una guitarra afinada más baja; más alto: menos notas graves falsas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.polyphonic.candidate-high.name=Espectro: candidato más agudo
recognition.polyphonic.candidate-high.tip=La altura más aguda que busca el espectro de acordes. Más alto: se encuentran los trastes más altos; más bajo: menos notas agudas falsas que vienen de los armónicos de notas graves. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.polyphonic.harmonics.name=Espectro: armónicos por nota
recognition.polyphonic.harmonics.tip=Cuántos armónicos de una nota se suman para pesarla. Menos: más estable con un sonido brillante; más: una nota apagada con armónicos débiles todavía se encuentra. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.polyphonic.max-harmonic.name=Espectro: armónico más alto
recognition.polyphonic.max-harmonic.tip=La frecuencia más alta en la que se busca un armónico. Más baja: los armónicos de otras notas, arriba, cuentan menos; más alta: cuentan más armónicos de una nota aguda. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.polyphonic.tolerance.name=Espectro: tolerancia de armónicos
recognition.polyphonic.tolerance.tip=A qué distancia de su lugar exacto se toma todavía un armónico. Más estrecha: el armónico de otra nota se toma menos; más ancha: una cuerda algo desafinada todavía se encuentra. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.polyphonic.candidates.name=Espectro: alturas por trama
recognition.polyphonic.candidates.tip=Cuántas alturas nombra como máximo a la vez el espectro de acordes. Menos: solo las más fuertes; más: cada cuerda de un acorde completo puede nombrarse. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.polyphonic.min-relative.name=Espectro: altura más débil conservada
recognition.polyphonic.min-relative.tip=Qué tan débil puede ser una altura, frente a la más fuerte, y seguir nombrada. Más bajo: se nombran las cuerdas suaves de un acorde; más alto: menos alturas falsas que vienen de armónicos. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.polyphonic.floor.name=Espectro: nivel mínimo
recognition.polyphonic.floor.tip=El nivel bajo el cual no se nombra ninguna altura. Más bajo: se analiza un toque muy suave; más alto: el silencio y el zumbido no nombran nada. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.polyphonic.subharmonic.name=Espectro: comprobación de la nota más grave
recognition.polyphonic.subharmonic.tip=Qué tan fuertes deben ser los armónicos propios de una nota más grave para que una altura se tome por esa nota. Más bajo: se elige más a menudo la octava inferior; más alto: se conserva la altura oída. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.polyphonic.floor-width.name=Espectro: anchura del umbral
recognition.polyphonic.floor-width.tip=La anchura del entorno cuya media se quita del espectro antes de buscar los armónicos. Más estrecha: los armónicos cercanos destacan más; más ancha: un ruido amplio se quita mejor. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.polyphonic.floor-factor.name=Espectro: factor del umbral
recognition.polyphonic.floor-factor.tip=Cuánto debe superar el espectro esa media para contar como armónico. Más bajo: cuentan los armónicos débiles; más alto: solo cuentan los armónicos claros, el ruido menos. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.attack.lag.name=Ataque: duración del crecimiento
recognition.attack.lag.tip=Durante cuánto tiempo se mide el crecimiento del espectro para decir qué notas se acaban de atacar. Más corto: se separan ataques seguidos; más largo: se ve entero un ataque lento. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.attack.max-frequency.name=Ataque: frecuencia más alta
recognition.attack.max-frequency.tip=La frecuencia más alta en la que se lee el crecimiento. Más baja: menos ruido de la púa; más alta: cuentan los armónicos de las notas agudas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.attack.partials.name=Ataque: armónicos por nota
recognition.attack.partials.tip=Cuántos armónicos tiene el modelo de cada nota. Menos: las notas que comparten armónicos se distinguen menos; más: una nota se reconoce por todo su sonido. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.attack.beta.name=Ataque: peso de los armónicos altos
recognition.attack.beta.tip=Con qué rapidez baja el peso de los armónicos altos de una nota en su modelo. Más bajo: los armónicos altos pesan tanto como los primeros; más alto: deciden los primeros armónicos. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.attack.sigma.name=Ataque: anchura de los armónicos
recognition.attack.sigma.tip=La anchura de cada armónico del modelo de una nota. Más estrecha: las notas vecinas se distinguen mejor; más ancha: una cuerda algo desafinada todavía coincide. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.attack.evidence-partials.name=Afinación atacada: armónicos medidos
recognition.attack.evidence-partials.tip=Cuántos armónicos de una nota atacada se miden para decir a qué distancia está de su altura exacta. Menos: solo los más claros; más: una mediana más estable. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.attack.evidence-search.name=Afinación atacada: búsqueda
recognition.attack.evidence-search.tip=Hasta dónde, alrededor del lugar exacto de cada armónico, se busca su nuevo pico. Más estrecha: el pico de una nota vecina se toma menos; más ancha: una nota muy desafinada todavía se mide. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.attack.evidence-peak.name=Afinación atacada: pico más pequeño
recognition.attack.evidence-peak.tip=Qué tan pequeño puede ser un nuevo pico, frente al más fuerte, y seguir medido. Más bajo: también se miden armónicos débiles; más alto: solo armónicos fuertes y fiables. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.chord-evidence.partial-presence.name=Acorde: armónico presente desde
recognition.chord-evidence.partial-presence.tip=Qué tan fuerte debe ser un armónico de un acorde esperado, frente al más fuerte, para contar como presente. Más bajo: las cuerdas suaves cuentan como oídas; más alto: solo cuentan las cuerdas que suenan con claridad. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.chord-evidence.neighbour-margin.name=Acorde: comprobación a un tono
recognition.chord-evidence.neighbour-margin.tip=Cuánto mejor debe explicar el sonido el mismo acorde a un tono de distancia para que el acorde esperado no se oiga. Más bajo: un acorde tocado un tono al lado se rechaza antes; más alto: solo se rechaza si está claramente al lado. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.chord-evidence.strum-window.name=Comprobación del rasgueo: ventana
recognition.chord-evidence.strum-window.tip=Durante cuánto tiempo se mide el primer rasgueo de una comprobación para su nivel y saturación. Más corta: solo el ataque; más larga: todo el sonido del rasgueo. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.chord-evidence.strum-quiet.name=Comprobación del rasgueo: calma antes
recognition.chord-evidence.strum-quiet.tip=Durante cuánto tiempo antes de un rasgueo se busca el nivel más tranquilo, para decir que el rasgueo se eleva por encima. Más corto: un rasgueo tras un momento ruidoso todavía se encuentra; más largo: un ruido que sube despacio no se toma por un rasgueo. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.chord-evidence.strum-rise.name=Comprobación del rasgueo: subida
recognition.chord-evidence.strum-rise.tip=Cuánto debe subir un rasgueo por encima de ese nivel tranquilo para iniciar la medida. Más bajo: un rasgueo suave la inicia, el ruido también; más alto: solo un rasgueo claro la inicia. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.chord-evidence.strum-clip-share.name=Comprobación del rasgueo: parte saturada
recognition.chord-evidence.strum-clip-share.tip=Qué parte de las muestras medidas debe llegar al nivel de saturación para que el rasgueo se diga saturado. Más bajo: se señala la menor saturación; más alto: solo una saturación fuerte. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.front-end.high-pass.name=Corte del filtro antirretumbo
recognition.front-end.high-pass.tip=Con la reducción de ruido activa, la frecuencia por debajo de la cual se cortan el retumbo y el zumbido. Más baja: las cuerdas graves conservan todo su cuerpo, pasa más retumbo; más alta: se corta más retumbo, las cuerdas graves se adelgazan. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.front-end.noise-rise.name=Nivel del ruido: velocidad de subida
recognition.front-end.noise-rise.tip=Con qué rapidez puede subir el ruido de fondo estimado hacia un sonido más fuerte. Más lenta: una nota larga sostenida no se toma por ruido; más rápida: un ruido que crece se sigue antes. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.front-end.noise-fall.name=Nivel del ruido: velocidad de bajada
recognition.front-end.noise-fall.tip=Con qué rapidez baja el ruido de fondo estimado hacia un momento más tranquilo. Más bajo: la estimación baja suavemente; más alto: baja enseguida al momento más tranquilo. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.front-end.noise-trusted.name=Nivel del ruido: fiable tras
recognition.front-end.noise-trusted.tip=Sin comprobación del nivel, cuánto tiempo debe escucharse el ruido antes de que la puerta pueda bajar el sonido. Más corto: la puerta actúa antes, con una estimación menos segura; más largo: espera una estimación más segura. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.noise-gate.open.name=Puerta: se abre sobre el ruido en
recognition.noise-gate.open.tip=Cuánto debe superar un sonido el ruido de fondo para que la puerta se abra. Más bajo: las notas suaves la abren, un ruido fuerte también; más alto: solo las notas claras la abren. Siempre por encima del margen de cierre. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.noise-gate.close.name=Puerta: se cierra bajo el ruido más
recognition.noise-gate.close.tip=Cuánto debe acercarse al ruido de fondo una nota que se apaga para que la puerta empiece a cerrarse. Más bajo: una nota que se apaga se conserva más tiempo; más alto: la puerta se cierra antes sobre una nota que se apaga. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.noise-gate.reduction.name=Puerta: reducción
recognition.noise-gate.reduction.tip=Cuánto baja la puerta el sonido cuando está cerrada. Más baja: el ruido sigue audible; más alta: los silencios son más tranquilos. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.noise-gate.hold.name=Puerta: mantenimiento
recognition.noise-gate.hold.tip=Cuánto tiempo debe quedarse cerca del ruido una nota que se apaga antes de que la puerta se cierre. Más corto: la puerta se cierra rápido; más largo: los huecos cortos entre notas siguen abiertos. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.noise-gate.subtraction.name=Resta del ruido: fuerza
recognition.noise-gate.subtraction.tip=Con la resta del ruido activa, qué parte del ruido aprendido se quita del sonido. Más baja: queda algo de ruido; más alta: se quita más ruido, las notas pueden sonar más delgadas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.noise-gate.subtraction-floor.name=Resta del ruido: suelo
recognition.noise-gate.subtraction-floor.tip=La parte del sonido que siempre se conserva, quite lo que quite la resta. Más bajo: silencios más profundos, más artefactos; más alto: menos artefactos, queda más ruido. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.noise-gate.subtraction-learn.name=Resta del ruido: velocidad de aprendizaje
recognition.noise-gate.subtraction-learn.tip=Con qué rapidez el ruido aprendido sigue un fondo que cambia, mientras la puerta está cerrada. Más baja: una imagen del ruido más estable; más alta: un ruido que cambia se sigue antes. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.gain.target.name=Sugerencia de ganancia: nivel de juego buscado
recognition.gain.target.tip=El nivel de juego que busca la sugerencia de ganancia de la comprobación del nivel. Más bajo: se propone un nivel más suave, más margen antes de la saturación; más alto: un nivel más fuerte, más cerca de la saturación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.gain.max-peak.name=Sugerencia de ganancia: pico más alto
recognition.gain.max-peak.tip=El pico más fuerte que puede dar la ganancia propuesta. Más bajo: más margen antes de la saturación; más alto: una señal más fuerte, más cerca de la saturación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.gain.no-change.name=Sugerencia de ganancia: nada que cambiar por debajo de
recognition.gain.no-change.tip=Cuánto puede acercarse la ganancia propuesta a la actual y seguir contando como nada que cambiar. Más bajo: se proponen correcciones pequeñas; más alto: solo las grandes. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.gain.min-snr.name=Sugerencia de ganancia: juego sobre el ruido en
recognition.gain.min-snr.tip=Cuánto debe superar el juego el ruido de fondo para que se proponga una subida sin el aviso de ruido. Más bajo: el aviso llega menos a menudo; más alto: llega antes. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.acceptance.min-share.name=Notas pulsadas: parte explicada
recognition.acceptance.min-share.tip=Qué parte de lo que el ataque añadió al sonido deben explicar las notas esperadas. Más baja: más tolerante, se acepta una nota mezclada con otros sonidos; más alta: más estricto, solo una nota limpia. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.acceptance.min-balance.name=Notas pulsadas: equilibrio del acorde
recognition.acceptance.min-balance.tip=Qué tan fuerte debe ser la nota más débil de un acorde, frente a la más fuerte. Más bajo: más tolerante, una cuerda suave sigue contando; más alto: más estricto, cada cuerda debe sonar con claridad. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.acceptance.min-peak.name=Notas pulsadas: altura más fuerte
recognition.acceptance.min-peak.tip=Qué tan fuerte debe ser la nota esperada más fuerte, frente a la altura más fuerte oída. Más bajo: más tolerante, se permite otra altura fuerte; más alto: más estricto, la nota esperada debe dominar. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.acceptance.hops.name=Notas pulsadas: confirmadas durante
recognition.acceptance.hops.tip=Cuánto tiempo seguido deben oírse las notas esperadas antes de aceptarse. Más corto: más rápido, más errores; más largo: más seguro, más lento. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.acceptance.neighbour.name=Notas pulsadas: sobre las vecinas
recognition.acceptance.neighbour.tip=Cuántas veces más fuerte debe ser cada nota esperada que sus vecinas a semitono y a tono; cero desactiva la comprobación. Más bajo: más tolerante; más alto: una nota al lado de la esperada se rechaza antes. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.acceptance.attack-strength.name=Notas pulsadas: fuerza del ataque
recognition.acceptance.attack-strength.tip=Qué tan repentino debe ser el ataque para que las notas cuenten; cero acepta cualquiera. Más bajo: más tolerante, cuentan los ataques suaves; más alto: solo cuentan los ataques claros. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.acceptance.rearm.name=Notas pulsadas: ignorado tras una nota
recognition.acceptance.rearm.tip=Cuánto tiempo se ignora el sonido tras aceptar una nota, para que una nota que suena nunca se tome por la siguiente. Más corto: se siguen los pasajes rápidos; más largo: menos dobles cuentas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.acceptance.offset-margin.name=Notas pulsadas: margen de afinación
recognition.acceptance.offset-margin.tip=Cuánto puede pasarse de la afinación aceptada la altura medida de una nota pulsada, porque esa medida es aproximada. Más bajo: más estricto con la afinación; más alto: más tolerante. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.acceptance.decay.name=Notas pulsadas: indulgencia
recognition.acceptance.decay.tip=Cuánto retrocede la confirmación cuando un instante no coincide; cero la reinicia. Más bajo: más estricto; más alto: un fallo corto cuesta menos. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.acceptance.guard.name=Notas pulsadas: golpe ignorado
recognition.acceptance.guard.tip=Tras una nota pulsada desde el silencio, cuánto tiempo se ignora el primer golpe antes de leer la altura. Más corto: más rápido; más largo: el golpe nunca se toma por una altura. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.acceptance.min-total.name=Notas pulsadas: nota más suave
recognition.acceptance.min-total.tip=Qué tan fuerte debe ser el sonido nuevo para ser una nota y no el ruido de la sala. Más bajo: cuentan las notas suaves, el ruido también; más alto: solo cuentan las notas claras. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.acceptance.floor-hops.name=Notas pulsadas: nivel tranquilo sobre
recognition.acceptance.floor-hops.tip=Durante cuánto tiempo se busca el nivel tranquilo antes de un ataque. Más corto: sigue un fondo que cambia; más largo: se encuentra el momento más tranquilo. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.acceptance.silence.name=Notas pulsadas: desde el silencio
recognition.acceptance.silence.tip=Qué tan repentino debe ser un ataque para contar como una nota pulsada desde el silencio, cuyo golpe se ignora entonces. Más bajo: más ataques esperan a que pase el golpe; más alto: menos. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.acceptance.min-onset.name=Notas pulsadas: inicio más pequeño
recognition.acceptance.min-onset.tip=El sonido nuevo más pequeño que puede iniciar un ataque. Más bajo: se encuentran los ataques suaves, el ruido también; más alto: solo los ataques claros. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.acceptance.onset-floor.name=Notas pulsadas: inicio sobre la calma
recognition.acceptance.onset-floor.tip=Cuántas veces más fuerte que el nivel tranquilo anterior debe ser un sonido para iniciar un ataque. Más bajo: se encuentran los ataques suaves, el ruido también; más alto: solo los ataques claros. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.acceptance.release.name=Notas pulsadas: fin del ataque
recognition.acceptance.release.tip=Cuánto debe caer el sonido, frente a la cima del ataque, para que el ataque termine. Más bajo: el ataque dura más; más alto: termina antes, una nota pulsada desde el silencio tiene menos tiempo para confirmarse. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.wait.verdict-hold.name=Espera: veredicto mostrado durante
recognition.wait.verdict-hold.tip=Cuánto tiempo sigue mostrándose la marca o la cruz. Más corto: la pantalla se despeja antes; más largo: el veredicto sigue a la vista. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.wait.neighbour-veto.name=Espera: retención por una vecina
recognition.wait.neighbour-veto.tip=Cuánto tiempo una nota vecina leída por la estimación de altura retiene la aceptación de una nota pulsada. Más corto: más rápido, una vecina se toma más a menudo por la nota; más largo: más seguro, más lento. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.wait.neighbour-confidence.name=Espera: confianza de la vecina
recognition.wait.neighbour-confidence.tip=Qué tan segura debe estar la estimación de altura de una nota vecina para que retenga la aceptación. Más baja: una vecina retiene más a menudo; más alta: solo una vecina clara retiene. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.wait.technique-window.name=Espera: técnica observada durante
recognition.wait.technique-window.tip=Cuánto tiempo se observa la técnica escrita de una nota tras aceptarla. Más corto: el resultado llega antes, con menos de la nota; más largo: con más de ella, más tarde. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.wait.bend-window-min.name=Espera: bend observado al menos
recognition.wait.bend-window-min.tip=El tiempo más corto que se observa un bend, sea cual sea su duración escrita. Más corto: el resultado de un bend corto llega antes; más largo: el bend de un alumno lento se sigue viendo entero. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.wait.bend-window-max.name=Espera: bend observado como máximo
recognition.wait.bend-window-max.tip=El tiempo más largo que se observa un bend, sea cual sea su duración escrita. Más corto: el resultado de un bend largo llega antes; más largo: un bend largo se ve hasta el final. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.wait.bend-margin.name=Espera: margen del bend
recognition.wait.bend-margin.tip=A qué distancia del recorrido escrito de un bend puede estar la altura y seguir contando como sobre él. Más bajo: más estricto, un bend que pasa su objetivo se rechaza; más alto: más tolerante, una nota falsa cerca del recorrido no se señala. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.wait.technique-lead.name=Espera: técnica desde antes
recognition.wait.technique-lead.tip=Cuánto antes de la aceptación puede empezar la observación de la técnica de una nota, hasta su ataque. Más corto: se deja fuera el inicio de la nota; más largo: se ve más de su inicio. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.wait.speed-window.name=Espera: demasiado rápido dentro de
recognition.wait.speed-window.tip=Qué tan pronto tras una nota aceptada un nuevo ataque significa que el alumno toca más rápido de lo que sigue el reconocimiento. Más corto: el límite de velocidad se muestra menos; más largo: más a menudo. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.wait.speed-lead.name=Espera: demasiado rápido desde antes
recognition.wait.speed-lead.tip=Cuánto antes de una nota aceptada sigue contando un ataque para el límite de velocidad. Más corto: cuentan menos ataques; más largo: más. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.wait.early-margin.name=Espera: margen de aceptación temprana
recognition.wait.early-margin.tip=Cuando la aceptación temprana está activada, cuánto debe adelantar el indicio de la nota esperada a sus vecinas para aceptarla antes. Más bajo: temprana más a menudo, más errores; más alto: rara vez temprana. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.wait.early-hops.name=Espera: aceptación temprana tras
recognition.wait.early-hops.tip=Cuando la aceptación temprana está activada, cuánto tiempo debe oírse la nota esperada antes de aceptarla antes; nunca más que la espera habitual. Más corto: más rápido; más largo: más seguro. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.wait.weak-fast.name=Espera: demasiado débil para la velocidad
recognition.wait.weak-fast.tip=El nivel de las notas por debajo del cual se avisa al alumno de que la entrada es demasiado débil para un reconocimiento rápido. Más bajo: el mensaje aparece menos; más alto: más a menudo. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.evidence-horizon.name=Seguimiento: altura esperada durante
recognition.follow.evidence-horizon.tip=Cuánto tiempo tras un ataque se espera su altura antes de tomarlo por un clic o ruido. Más corto: el ruido se descarta antes; más largo: una nota cuya altura tarda en asentarse sigue contando. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.silence.name=Seguimiento: fin de un sonido
recognition.follow.silence.tip=Cuánto tiempo sin ninguna altura termina el sonido de un ataque. Más corto: una nota corta se decide antes; más largo: una breve caída no termina la nota. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.short-note.name=Seguimiento: nota más corta
recognition.follow.short-note.tip=Cuánto tiempo debe haber mantenido su altura una nota que termina pronto para contar, como una nota de adorno. Más corto: más tolerante; más largo: una nota muy corta no cuenta. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.same-sound.name=Seguimiento: mismo sonido dentro de
recognition.follow.same-sound.tip=A qué distancia del sonido con el que se reconoció una nota otro ataque se toma por ese mismo sonido y no por una nota de más. Más corto: más notas de más; más largo: menos. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.ringing.name=Seguimiento: la cuerda suena durante
recognition.follow.ringing.tip=Cuánto tiempo se considera que una cuerda pulsada suena bajo las notas siguientes; una nota repetida dentro de ese tiempo toma su instante del ataque señalado. Más corto: menos notas tratadas como resonantes; más largo: más. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.scan-back.name=Seguimiento: notas revisadas atrás
recognition.follow.scan-back.tip=Cuántas notas ya reconocidas se siguen mirando, porque un segundo ataque puede caer en su ventana. Más bajo: un segundo ataque es más a menudo una nota de más; más alto: se mira más. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.onset-memory.name=Seguimiento: ataques guardados durante
recognition.follow.onset-memory.tip=Cuánto tiempo se guardan los ataques señalados por el detector, para dar su instante a las notas repetidas. Más corto: un ataque puede olvidarse antes de reconocer su nota; más largo: se guardan más tiempo. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.refine-before.name=Seguimiento: ataque antes del indicio
recognition.follow.refine-before.tip=Cuánto antes del instante que da el indicio de ataque puede estar un ataque señalado para ser el mismo ataque. Más corto: menos notas repetidas toman el instante señalado; más largo: más. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.refine-after.name=Seguimiento: ataque después del indicio
recognition.follow.refine-after.tip=Cuánto después del instante que da el indicio de ataque puede estar un ataque señalado para ser el mismo ataque, y cuánto lo espera la sesión. Más corto: más rápido; más largo: el instante señalado se usa más a menudo. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.after-close.name=Seguimiento: abierta tras su ventana
recognition.follow.after-close.tip=Cuánto tiempo una nota repetida cuya ventana se cerró sigue abierta al indicio de su ataque. Más corto: se pierde una confirmación tardía; más largo: sigue abierta más tiempo. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.tail.name=Seguimiento: fin del pasaje
recognition.follow.tail.tip=Cuánto tiempo continúa el pasaje tras la última ventana antes de terminar. Más corto: el resumen llega antes; más largo: una última nota tardía todavía se oye. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.history.name=Seguimiento: sonido guardado durante
recognition.follow.history.tip=Cuánto tiempo se guarda el sonido reciente, del que se leen el ataque y las técnicas de una nota. Más corto: puede perderse el inicio de una nota; más largo: se guarda más. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.technique-window.name=Seguimiento: técnica observada durante
recognition.follow.technique-window.tip=Cuánto tiempo se observa la técnica escrita de una nota desde su ataque. Más corto: el resultado llega antes, con menos de la nota; más largo: con más de ella, más tarde. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.bend-window-min.name=Seguimiento: bend observado al menos
recognition.follow.bend-window-min.tip=El tiempo más corto que se observa un bend, sea cual sea su duración escrita. Más corto: el resultado de un bend corto llega antes; más largo: un bend lento se sigue viendo entero. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.bend-window-max.name=Seguimiento: bend observado como máximo
recognition.follow.bend-window-max.tip=El tiempo más largo que se observa un bend, sea cual sea su duración escrita. Más corto: el resultado de un bend largo llega antes; más largo: un bend largo se ve hasta el final. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.bend-margin.name=Seguimiento: margen del bend
recognition.follow.bend-margin.tip=A qué distancia del recorrido escrito de un bend puede estar la altura y seguir contando como sobre él. Más bajo: más estricto, un bend que pasa su objetivo interrumpe la nota; más alto: más tolerante. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow.evidence-lead.name=Seguimiento: indicio vigilado desde
recognition.follow.evidence-lead.tip=Cuánto antes de su ventana empieza una nota a vigilar el indicio de ataque; hace falta el nivel tranquilo anterior al ataque para verlo crecer. Más corto: puede perderse un ataque adelantado; más largo: se vigila más. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.clock.fit-window.name=Reloj: posición medida sobre
recognition.clock.fit-window.tip=Sobre cuánto tiempo de reproducción reciente mide el reloj su posición y velocidad. Más corto: sigue antes un cambio de tempo, menos estable; más largo: más estable, más lento en seguir. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.clock.min-points.name=Reloj: lecturas necesarias
recognition.clock.min-points.tip=Cuántas lecturas del reproductor necesita el reloj antes de medir su velocidad; antes usa el tempo escrito. Más bajo: se mide antes; más alto: más estable. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.clock.min-span.name=Reloj: lecturas repartidas en
recognition.clock.min-span.tip=Cuánto tiempo de reproducción deben cubrir las lecturas antes de que el reloj mida su velocidad. Más corto: se mide antes; más largo: más estable. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.clock.stall.name=Reloj: reproductor parado tras
recognition.clock.stall.tip=Cuánto tiempo puede quedar igual la posición del reproductor antes de que el reloj lo considere parado. Más corto: una pausa se ve antes; más largo: una lectura lenta no se toma por una pausa. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.clock.extrapolation.name=Reloj: adelanto sobre la última lectura
recognition.clock.extrapolation.tip=Hasta dónde puede contar el reloj por sí solo tras su última lectura. Más corto: nunca se adelanta al reproductor; más largo: más regular entre lecturas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.clock.seek-margin.name=Reloj: salto tomado por un desplazamiento
recognition.clock.seek-margin.tip=Cuánto debe saltar la posición del reproductor para que el reloj empiece de nuevo, como tras un desplazamiento o un bucle. Más bajo: un salto menor lo reinicia; más alto: solo un salto grande. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.clock.latency-limit.name=Reloj: latencia más grande
recognition.clock.latency-limit.tip=El mayor desfase de latencia aceptado, escrito a mano o medido por una calibración. Más bajo: una medida errónea se rechaza antes; más alto: una tarjeta de sonido lenta todavía puede compensarse. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.timing.reference-beat.name=Tiempo: anchura leída al pulso
recognition.timing.reference-beat.tip=El pulso al que se lee la anchura de la ventana «a tiempo»; a otros tempos la ventana crece o se reduce con el pulso. Más corto: la misma anchura es más ancha a todos los tempos; más largo: más estrecha. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.timing.advance.name=Tiempo: tocar antes del rojo
recognition.timing.advance.tip=Cuánto antes de que una nota se ponga roja puede tocarse ya en el modo seguimiento (entonces adelantada). Más corto: más estricto; más largo: una nota adelantada sigue contando. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.timing.gap.name=Tiempo: separación antes de la nota siguiente
recognition.timing.gap.tip=Lo que queda entre el fin del tiempo para tocar una nota y el paso a rojo de la siguiente, para que dos ventanas nunca se toquen. Más corto: ventanas más largas en pasajes rápidos; más largo: frontera más clara. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.timing.clock-spread.name=Tiempo: ruta inestable desde
recognition.timing.clock-spread.tip=Cuánto puede variar el retardo de la entrada de sonido antes de que la ruta se considere inestable, lo que muestra un aviso y una precisión rítmica reducida, nunca un bloqueo. Más bajo: avisa antes; más alto: solo avisa con una ruta muy irregular. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow-leniency.permissive.accept.name=Seguimiento permisivo: nota aceptada a menos de
recognition.follow-leniency.permissive.accept.tip=A qué distancia de la altura escrita se sigue aceptando una nota en esta posición; se usa el ajuste del alumno si es más tolerante. Más bajo: sin relajación; más alto: más tolerante, puede pasar una nota falsa. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow-leniency.permissive.confidence.name=Seguimiento permisivo: confianza de altura
recognition.follow-leniency.permissive.confidence.tip=Cuán segura debe ser la altura en esta posición; se usa el ajuste del alumno si es más tolerante. Más bajo: más tolerante; más alto: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow-leniency.permissive.stability.name=Seguimiento permisivo: nota mantenida durante
recognition.follow-leniency.permissive.stability.tip=Cuánto debe mantener su altura una nota en esta posición; se usa el ajuste del alumno si es más corto. Más corto: más rápido, más tolerante; más largo: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow-leniency.permissive.chord-evidence.name=Seguimiento permisivo: indicio de acorde
recognition.follow-leniency.permissive.chord-evidence.tip=Qué parte de un acorde debe oírse en esta posición; se usa el ajuste del alumno si es más tolerante. Más bajo: más tolerante; más alto: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow-leniency.permissive.chord-partials.name=Seguimiento permisivo: parciales de acorde necesarios
recognition.follow-leniency.permissive.chord-partials.tip=Cuántos parciales de una nota de acorde deben oírse en esta posición; se usa el ajuste del alumno si es más bajo. Más bajo: más tolerante; más alto: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow-leniency.permissive.chord-confirm.name=Seguimiento permisivo: acorde confirmado tras
recognition.follow-leniency.permissive.chord-confirm.tip=Cuánto debe oírse un acorde antes de confirmarse en esta posición; se usa el ajuste del alumno si es más corto. Más corto: más rápido; más largo: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow-leniency.very-permissive.accept.name=Seguimiento muy permisivo: nota aceptada a menos de
recognition.follow-leniency.very-permissive.accept.tip=A qué distancia de la altura escrita se sigue aceptando una nota en esta posición; se usa el ajuste del alumno si es más tolerante. Más bajo: sin relajación; más alto: más tolerante, puede pasar una nota falsa. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow-leniency.very-permissive.confidence.name=Seguimiento muy permisivo: confianza de altura
recognition.follow-leniency.very-permissive.confidence.tip=Cuán segura debe ser la altura en esta posición; se usa el ajuste del alumno si es más tolerante. Más bajo: más tolerante; más alto: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow-leniency.very-permissive.stability.name=Seguimiento muy permisivo: nota mantenida durante
recognition.follow-leniency.very-permissive.stability.tip=Cuánto debe mantener su altura una nota en esta posición; se usa el ajuste del alumno si es más corto. Más corto: más rápido, más tolerante; más largo: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow-leniency.very-permissive.chord-evidence.name=Seguimiento muy permisivo: indicio de acorde
recognition.follow-leniency.very-permissive.chord-evidence.tip=Qué parte de un acorde debe oírse en esta posición; se usa el ajuste del alumno si es más tolerante. Más bajo: más tolerante; más alto: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow-leniency.very-permissive.chord-partials.name=Seguimiento muy permisivo: parciales de acorde necesarios
recognition.follow-leniency.very-permissive.chord-partials.tip=Cuántos parciales de una nota de acorde deben oírse en esta posición; se usa el ajuste del alumno si es más bajo. Más bajo: más tolerante; más alto: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.follow-leniency.very-permissive.chord-confirm.name=Seguimiento muy permisivo: acorde confirmado tras
recognition.follow-leniency.very-permissive.chord-confirm.tip=Cuánto debe oírse un acorde antes de confirmarse en esta posición; se usa el ajuste del alumno si es más corto. Más corto: más rápido; más largo: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.arcade-leniency.fun.confidence.name=Arcade divertido: confianza de altura
recognition.arcade-leniency.fun.confidence.tip=Cuán segura debe ser la altura en esta posición; se usa el ajuste del alumno si es más tolerante. Más bajo: más tolerante; más alto: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.arcade-leniency.fun.stability.name=Arcade divertido: nota mantenida durante
recognition.arcade-leniency.fun.stability.tip=Cuánto debe mantener su altura una nota en esta posición; se usa el ajuste del alumno si es más corto. Más corto: más rápido, más tolerante; más largo: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.arcade-leniency.fun.chord-evidence.name=Arcade divertido: indicio de acorde
recognition.arcade-leniency.fun.chord-evidence.tip=Qué parte de un acorde debe oírse en esta posición; se usa el ajuste del alumno si es más tolerante. Más bajo: más tolerante; más alto: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.arcade-leniency.fun.chord-partials.name=Arcade divertido: parciales de acorde necesarios
recognition.arcade-leniency.fun.chord-partials.tip=Cuántos parciales de una nota de acorde deben oírse en esta posición; se usa el ajuste del alumno si es más bajo. Más bajo: más tolerante; más alto: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.arcade-leniency.fun.chord-confirm.name=Arcade divertido: acorde confirmado tras
recognition.arcade-leniency.fun.chord-confirm.tip=Cuánto debe oírse un acorde antes de confirmarse en esta posición; se usa el ajuste del alumno si es más corto. Más corto: más rápido; más largo: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.arcade-leniency.fun.tempo-window.name=Arcade divertido: ventana de tiempo ampliada
recognition.arcade-leniency.fun.tempo-window.tip=Cuánto se amplía la ventana «a tiempo» del alumno en esta posición, nunca más allá de su máximo. Más bajo: sin ampliar; más alto: más ancha. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.arcade-leniency.very-permissive.confidence.name=Arcade muy permisivo: confianza de altura
recognition.arcade-leniency.very-permissive.confidence.tip=Cuán segura debe ser la altura en esta posición; se usa el ajuste del alumno si es más tolerante. Más bajo: más tolerante; más alto: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.arcade-leniency.very-permissive.stability.name=Arcade muy permisivo: nota mantenida durante
recognition.arcade-leniency.very-permissive.stability.tip=Cuánto debe mantener su altura una nota en esta posición; se usa el ajuste del alumno si es más corto. Más corto: más rápido, más tolerante; más largo: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.arcade-leniency.very-permissive.chord-evidence.name=Arcade muy permisivo: indicio de acorde
recognition.arcade-leniency.very-permissive.chord-evidence.tip=Qué parte de un acorde debe oírse en esta posición; se usa el ajuste del alumno si es más tolerante. Más bajo: más tolerante; más alto: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.arcade-leniency.very-permissive.chord-partials.name=Arcade muy permisivo: parciales de acorde necesarios
recognition.arcade-leniency.very-permissive.chord-partials.tip=Cuántos parciales de una nota de acorde deben oírse en esta posición; se usa el ajuste del alumno si es más bajo. Más bajo: más tolerante; más alto: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.arcade-leniency.very-permissive.chord-confirm.name=Arcade muy permisivo: acorde confirmado tras
recognition.arcade-leniency.very-permissive.chord-confirm.tip=Cuánto debe oírse un acorde antes de confirmarse en esta posición; se usa el ajuste del alumno si es más corto. Más corto: más rápido; más largo: sin relajación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.arcade-leniency.very-permissive.tempo-window.name=Arcade muy permisivo: ventana de tiempo ampliada
recognition.arcade-leniency.very-permissive.tempo-window.tip=Cuánto se amplía la ventana «a tiempo» del alumno en esta posición, nunca más allá de su máximo. Más bajo: sin ampliar; más alto: más ancha. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.bend.min-range.name=Bend: detectado desde
recognition.technique.bend.min-range.tip=Cuánto debe moverse la altura de una nota para llamarse bend. Más bajo: se detectan bends menores; más alto: solo bends grandes. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.bend.plain-range.name=Bend: nota simple bajo
recognition.technique.bend.plain-range.tip=Por debajo de este movimiento una nota se considera simple, sin bend; entre ambos valores el resultado es incierto. Más bajo: menos notas simples; más alto: más notas simples. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.bend.min-duration.name=Bend: nota más corta
recognition.technique.bend.min-duration.tip=Una nota más corta es demasiado corta para juzgar un bend: incierto. Más corto: se juzgan notas más cortas; más largo: solo notas largas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.bend.voiced.name=Bend: altura oída en
recognition.technique.bend.voiced.tip=Qué parte de la nota debe tener una altura clara para juzgar un bend. Más bajo: se juzga con menos; más alto: solo con notas limpias. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.bend.written-move.name=Bend: menor movimiento escrito
recognition.technique.bend.written-move.tip=Un bend escrito menor que esto no se juzga. Más bajo: se juzgan bends mínimos; más alto: bends pequeños no se juzgan. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.bend.on-tolerance.name=Bend: en el objetivo a menos de
recognition.technique.bend.on-tolerance.tip=A qué distancia del objetivo escrito debe estar la altura alcanzada para contar como en el objetivo (o una parte del movimiento escrito, la mayor). Más bajo: más estricto; más alto: más tolerante. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.bend.on-share.name=Bend: en el objetivo a una parte
recognition.technique.bend.on-share.tip=La misma tolerancia como parte del movimiento escrito, para bends grandes. Más bajo: más estricto en bends grandes; más alto: más tolerante en bends grandes. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.bend.moved-share.name=Bend: bajo el objetivo, incierto desde
recognition.technique.bend.moved-share.tip=Un bend bajo su objetivo es incierto si la altura se movió al menos esta parte del movimiento escrito, fallido si no. Más bajo: más a menudo incierto; más alto: más a menudo fallido. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.bend.start-tolerance.name=Bend: inicio del pre-bend a menos de
recognition.technique.bend.start-tolerance.tip=A qué distancia de la altura estirada debe empezar un pre-bend. Más bajo: más estricto; más alto: más tolerante. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.bend.edge.name=Bend: inicio y fin leídos en
recognition.technique.bend.edge.tip=Cuántos pasos de análisis dan la altura al inicio y al final de un bend. Más bajo: más sensible a los primeros y últimos instantes; más alto: más estable, menos preciso. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.slide.min-range.name=Deslizamiento: detectado desde
recognition.technique.slide.min-range.tip=Cuánto debe deslizarse la altura para llamarse deslizamiento. Más bajo: se detectan deslizamientos cortos; más alto: solo deslizamientos largos. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.slide.plain-range.name=Deslizamiento: nota simple bajo
recognition.technique.slide.plain-range.tip=Por debajo de este movimiento una nota se considera simple; entre ambos valores el resultado es incierto. Más bajo: menos notas simples; más alto: más notas simples. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.slide.monotony.name=Deslizamiento: un solo sentido en
recognition.technique.slide.monotony.tip=Qué parte del movimiento debe ir en un solo sentido para un deslizamiento. Más bajo: más tolerante; más alto: solo deslizamientos limpios. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.slide.steps.name=Deslizamiento: pasos en movimiento necesarios
recognition.technique.slide.steps.tip=Un deslizamiento pasa por alturas intermedias: cuántos pasos de análisis deben moverse; un salto tiene uno o dos. Más bajo: un salto puede contar; más alto: solo deslizamientos lentos. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.slide.min-duration.name=Deslizamiento: nota más corta
recognition.technique.slide.min-duration.tip=Una nota más corta es demasiado corta para juzgar un deslizamiento: incierto. Más corto: se juzgan notas más cortas; más largo: solo notas largas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.slide.voiced.name=Deslizamiento: altura oída en
recognition.technique.slide.voiced.tip=Qué parte de la nota debe tener una altura clara para juzgar un deslizamiento. Más bajo: se juzga con menos; más alto: solo con notas limpias. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.vibrato.depth.name=Vibrato: detectado desde la profundidad
recognition.technique.vibrato.depth.tip=Cuánto debe oscilar la altura para llamarse vibrato. Más bajo: se detectan vibratos leves; más alto: solo vibratos amplios. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.vibrato.plain-depth.name=Vibrato: nota simple bajo
recognition.technique.vibrato.plain-depth.tip=Por debajo de esta profundidad una nota se considera simple; entre ambos valores el resultado es incierto. Más bajo: menos notas simples; más alto: más notas simples. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.vibrato.min-rate.name=Vibrato: velocidad más lenta
recognition.technique.vibrato.min-rate.tip=Una oscilación más lenta no es un vibrato. Más bajo: cuentan oscilaciones lentas; más alto: solo vibratos rápidos. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.vibrato.max-rate.name=Vibrato: velocidad más rápida
recognition.technique.vibrato.max-rate.tip=Una oscilación más rápida no es un vibrato (un trino o ruido). Más bajo: solo vibratos moderados; más alto: cuentan oscilaciones rápidas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.vibrato.min-duration.name=Vibrato: nota más corta
recognition.technique.vibrato.min-duration.tip=Una nota más corta es demasiado corta para juzgar un vibrato: incierto. Más corto: se juzgan notas más cortas; más largo: solo notas largas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.vibrato.voiced.name=Vibrato: altura oída en
recognition.technique.vibrato.voiced.tip=Qué parte de la nota debe tener una altura clara para juzgar un vibrato. Más bajo: se juzga con menos; más alto: solo con notas limpias. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.legato.start-window.name=Legato: inicio examinado
recognition.technique.legato.start-window.tip=Qué parte del inicio de una nota se examina para un ataque con púa. Más corto: solo el comienzo; más largo: un inicio más largo. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.legato.picked-rise.name=Legato: pulsada por encima de una subida de
recognition.technique.legato.picked-rise.tip=Una subida de nivel por encima al inicio indica que la cuerda fue pulsada. Más bajo: más notas pulsadas; más alto: menos notas pulsadas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.legato.rise.name=Legato: legato bajo una subida de
recognition.technique.legato.rise.tip=Una subida de nivel por debajo al inicio es compatible con un hammer-on o pull-off. Más bajo: más estricto; más alto: más tolerante. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.frame-confidence.name=Técnicas: confianza de altura
recognition.technique.frame-confidence.tip=Cuán segura debe ser una lectura de altura para usarse en una técnica, en los modos espera y seguimiento. Más bajo: más lecturas, menos limpias; más alto: menos lecturas, más limpias. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.motion.outlier.name=Técnicas: altura parásita más allá de
recognition.technique.motion.outlier.tip=Una lectura de altura más alejada que esto del centro de la nota (error de octava, cuerda vecina) se descarta. Más bajo: más lecturas descartadas; más alto: más parásitos conservados. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.technique.motion.min-voiced.name=Técnicas: lecturas necesarias
recognition.technique.motion.min-voiced.tip=Cuántas lecturas de altura necesita una nota antes de medir su técnica. Más bajo: se miden notas cortas; más alto: solo notas largas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.early-window.name=Calibración: nota antes de su clic
recognition.calibration.early-window.tip=Cuánto antes de un clic puede empezar una nota y seguir perteneciéndole. Más corto: se pierde una nota adelantada; más largo: cuenta una nota adelantada. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.late-window.name=Calibración: nota después de su clic
recognition.calibration.late-window.tip=Cuánto después de un clic puede empezar una nota y seguir perteneciéndole (retardo de la ruta y reacción del músico). Más corto: no se mide una ruta lenta; más largo: se mide una ruta muy lenta. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.pitch-patience.name=Calibración: altura esperada durante
recognition.calibration.pitch-patience.tip=Cuánto después de señalarse su ataque debe mostrar una nota una altura; una altura posterior es de otro sonido. Más corto: más estricto; más largo: una altura lenta sigue contando. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.pitch-before.name=Calibración: altura iniciada antes
recognition.calibration.pitch-before.tip=Cuánto antes del ataque puede haber empezado el sonido con altura; una nota que ya sonaba no es la del ataque. Más corto: más estricto; más largo: una nota que suena puede contar. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.same-pitch.name=Calibración: misma altura a menos de
recognition.calibration.same-pitch.tip=Una altura que se mueve menos que esto es el mismo sonido; más inicia uno nuevo. Más bajo: un pequeño cambio es una nota nueva; más alto: un gran cambio es el mismo sonido. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.min-confidence.name=Calibración: confianza de altura
recognition.calibration.min-confidence.tip=Cuán segura debe ser una lectura de altura para contar durante la calibración. Más bajo: más tolerante; más alto: más estricto. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.min-frequency.name=Calibración: altura más baja
recognition.calibration.min-frequency.tip=Una altura más baja no se toma por una nota. Más bajo: cuentan las notas graves; más alto: solo notas más agudas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.max-frequency.name=Calibración: altura más alta
recognition.calibration.max-frequency.tip=Una altura más alta no se toma por una nota. Más bajo: solo notas más graves; más alto: cuentan las notas agudas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.min-usable.name=Calibración: notas necesarias
recognition.calibration.min-usable.tip=Cuántas de las ocho notas deben ser utilizables para conservar la calibración. Más bajo: se conserva con menos notas; más alto: necesita casi todas las notas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.outlier-deviations.name=Calibración: nota descartada más allá de
recognition.calibration.outlier-deviations.tip=Una nota más alejada de las demás que este número de desviaciones usuales se descarta. Más bajo: más notas descartadas; más alto: menos notas descartadas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.outlier-floor.name=Calibración: nunca descartada a menos de
recognition.calibration.outlier-floor.tip=Una nota así de cerca de las demás nunca se descarta. Más corto: un músico regular puede perder notas; más largo: se conservan más notas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.unstable-spread.name=Calibración: inestable por encima de
recognition.calibration.unstable-spread.tip=Cuando las notas utilizables se dispersan más que esto, el retardo no es lo bastante estable para conservarse. Más corto: más a menudo inestable; más largo: se conserva más a menudo. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.recognition-rate.name=Tasa de reconocimiento conservada
recognition.calibration.recognition-rate.tip=La parte de la pieza de calibración que un perfil debe reconocer para guardarse sin preguntar y mostrarse en verde. Más bajo: se conservan más perfiles; más alto: solo perfiles muy buenos. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.calm-below.name=Calibración: tranquilo bajo
recognition.calibration.calm-below.tip=Un ruido de fondo por debajo de esto se considera tranquilo. Más bajo: menos salas tranquilas; más alto: más salas tranquilas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.loud-above.name=Calibración: ruidoso por encima de
recognition.calibration.loud-above.tip=Un ruido de fondo por encima de esto se considera ruidoso. Más bajo: más salas ruidosas; más alto: menos salas ruidosas. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.sound-refractory.name=Calibración: un solo sonido dentro de
recognition.calibration.sound-refractory.tip=Dos sonidos más cercanos que esto cuentan como uno (las cuerdas de un acorde). Más corto: un rasgueo puede contar varias veces; más largo: notas cercanas cuentan como una. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.calibration.sound-lead.name=Calibración: sonido cortado antes
recognition.calibration.sound-lead.tip=Cuánto antes de cada sonido detectado empieza su parte de la grabación. Más corto: puede cortarse el inicio; más largo: se conserva más del inicio. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.level-check.playing-confidence.name=Control del nivel: confianza al tocar
recognition.level-check.playing-confidence.tip=Cuán segura debe ser la altura para que el control del nivel cuente un instante como tocado. Más bajo: más instantes cuentan como tocados; más alto: solo el toque claro. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.level-check.required-playing.name=Control del nivel: toque necesario
recognition.level-check.required-playing.tip=Cuánto toque necesita el control del nivel antes de concluir. Más corto: concluye antes; más largo: más seguro, más lento. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.level-check.suboptimal-share.name=Control del nivel: demasiado fuerte desde
recognition.level-check.suboptimal-share.tip=La parte del toque que puede saturar o ser demasiado fuerte antes de considerar la entrada no ideal. Más bajo: avisa antes; más alto: solo avisa con mucha saturación. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.input-quality.attacks.name=Entrada débil: ataques examinados
recognition.input-quality.attacks.tip=Cuántos ataques recientes dan el nivel al que toca el alumno antes de avisar de una entrada débil. Más bajo: se avisa antes; más alto: más estable, se avisa después. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.input-quality.remember.name=Entrada débil: ataques guardados durante
recognition.input-quality.remember.tip=Cuánto tiempo cuenta un ataque para el control de entrada débil. Más corto: solo el toque reciente; más largo: cuenta el toque lento. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.
recognition.input-quality.attack-window.name=Entrada débil: nivel del ataque en
recognition.input-quality.attack-window.tip=Cuánto tiempo después de cada ataque se lee su nivel más fuerte. Más corto: solo el ataque mismo; más largo: cuenta una subida lenta. Ajuste experto: el valor recomendado se midió; cámbielo solo para probar.

# botón Práctica de la barra de transporte (spec 002, FR-001..FR-004)
transport.practice=Práctica: tocar una pista nota por nota
transport.practice.no-song=Práctica: abre primero una canción
transport.practice.no-track=Práctica: esta canción no tiene ninguna pista de guitarra con notas (haz clic para ver por qué)
transport.arcade=Arcade: tocar ahora la pista actual con la última entrada
transport.arcade.no-song=Arcade: abre primero una canción
transport.arcade.no-track=Arcade: esta canción no tiene ninguna pista con notas (haz clic para ver por qué)
