recognition.unit.dBFS=dBFS
recognition.unit.dB=dB
recognition.unit.cents=cents
recognition.unit.percent=%
recognition.unit.ms=ms
recognition.input.level.min.name=Nivel mínimo utilizable
recognition.input.level.min.tip=Un sonido más débil se indica como «demasiado bajo» y nunca se acepta en la práctica. Más bajo: funciona con una señal más débil, pero también escucha más ruido de la sala. Más alto: necesita una guitarra más fuerte.
recognition.input.level.max.name=Aviso de nivel alto
recognition.input.level.max.tip=Un sonido más fuerte se indica como «demasiado alto» (riesgo de distorsión). Más bajo: avisa antes. Más alto: avisa solo cerca de la distorsión.
recognition.input.noise-reduction.name=Reducir el ruido de fondo
recognition.input.noise-reduction.tip=Elimina el zumbido y el ruido de fondo entre las notas antes de analizarlas. Desactivado deja la entrada exactamente como está.
recognition.input.gain-suggestion.name=Sugerir una ganancia de entrada
recognition.input.gain-suggestion.tip=Tras la comprobación del nivel, propone una ganancia que lleva el nivel al intervalo utilizable. Solo se aplica cuando la confirmas.
recognition.tuner.in-tune.name=Margen de afinación
recognition.tuner.in-tune.tip=Cuánto puede alejarse una cuerda del objetivo para mostrarse «afinada» (afinador y pantalla de la práctica). Más pequeño: afinación más precisa, más difícil de lograr. Más grande: más fácil, menos precisa.
recognition.tuner.hold.name=Conservar la última nota
recognition.tuner.hold.tip=Cuando la cuerda se apaga, el afinador sigue mostrando en gris la última nota fiable en lugar de quedarse en blanco.
recognition.note.accept.name=Margen de altura aceptado
recognition.note.accept.tip=Cuánto puede alejarse una nota tocada de la nota escrita (en cents) y seguir contando como correcta. Más pequeño: más estricto con la afinación y los bends. Más grande: más permisivo, pero una nota vecina nunca se acepta. Nunca menor que el margen de afinación.
recognition.note.fret-sharp.name=Tolerancia de agudo por traste
recognition.note.fret-sharp.tip=Pisar una cuerda en un traste la tensa, así que las notas pisadas suenan algo agudas, más cuanto más arriba en el mástil (se nota en guitarras reales). Esto añade esos cents por traste al margen aceptado, solo hacia el lado agudo. 0 lo desactiva; el lado grave y una nota vecina nunca se ven afectados.
recognition.note.confidence.name=Certeza mínima
recognition.note.confidence.tip=Cuán seguro debe estar el detector antes de juzgar una nota. Más baja: reacciona a notas más débiles o ruidosas, con más errores. Más alta: menos errores, pero puede esperar en las notas suaves.
recognition.note.stability.name=Tiempo para confirmar una nota
recognition.note.stability.tip=Cuánto tiempo debe sonar la nota correcta antes de aceptarse, y una nota incorrecta antes de marcarse como errónea. Más corto: reacción más rápida, más riesgo por falsos positivos. Más largo: más estable, más lento en pasajes rápidos.
recognition.note.attack.name=Sensibilidad al ataque de la púa
recognition.note.attack.tip=Cuán fuerte debe ser una subida repentina del sonido para contar como un nuevo ataque (cada nota necesita uno). Más baja: detecta ataques suaves, pero los golpes y el ruido pueden contar. Más alta: ignora más ruido, puede perder pulsaciones suaves.
recognition.note.legato.name=Hammer-ons, pull-offs, slides
recognition.note.legato.tip=Hoy cada nota necesita su propio ataque, así que las notas ligadas pueden tener que pulsarse de nuevo o saltarse. Aceptar el legato sin ataque es una propuesta todavía en estudio.
recognition.note.legato.option.strict=Nuevo ataque para cada nota
recognition.note.technique.name=Comprobar las técnicas de ejecución
recognition.note.technique.tip=Intenta oír las técnicas escritas en la partitura (hammer-on, pull-off, slide, bend, vibrato...) e indica lo que se oyó, sin bloquear nunca el ejercicio. Desactivado: toda técnica se muestra como no verificable.
recognition.tempo.tolerance.name=Tolerancia de tiempo (tocar al tempo)
recognition.tempo.tolerance.tip=Cuánto puede alejarse una nota del pulso y seguir contando como a tiempo cuando tocas al tempo de la partitura. Un ajuste más estricto marca antes las notas adelantadas y retrasadas.
recognition.tempo.tolerance.option.strict=Estricta
recognition.tempo.tolerance.option.normal=Normal
recognition.tempo.tolerance.option.lenient=Permisiva
recognition.chord.evidence.name=Exigencia en los acordes
recognition.chord.evidence.tip=Parte de los armónicos propios de una cuerda que debe oírse para que cuente en un acorde. Más baja: acepta cuerdas más débiles, puede aceptar una que falta. Más alta: más estricta, puede rechazar una cuerda real pero suave.
recognition.chord.window.name=Ventana de rasgueo
recognition.chord.window.tip=Tiempo tras el rasgueo dentro del cual deben oírse todas las cuerdas. Más corto: exige un rasgueo rápido y uniforme. Más largo: permite rasgueos lentos en arpegio.
recognition.chord.completeness.name=Cuerdas exigidas
recognition.chord.completeness.tip=Toda cuerda que se pueda comprobar por separado debe oírse. Las cuerdas que no se pueden distinguir (la misma nota, o una octava de una cuerda más grave) se muestran como no comprobadas.
recognition.chord.completeness.option.all-verifiable=Todas las cuerdas comprobables
recognition.chord.foreign.name=Cuerdas de más que no son del acorde
recognition.chord.foreign.tip=Las cuerdas de más que no están en el acorde todavía no se comprueban. Rechazarlas exige primero grabaciones reales de acordes (propuesta en estudio).
recognition.chord.foreign.option.ignore=Todavía no se comprueba
recognition.passage.measures.name=Repetir pasajes
recognition.passage.measures.tip=Divide la canción en pasajes y repite uno cuando demasiadas notas fueron incorrectas o saltadas. Desactivado toca de seguido. Es el valor que se usa al iniciar TuxGuitar; la ventana de práctica puede cambiarlo para la sesión actual.
recognition.passage.measures.option.0=Desactivado (tocar seguido)
recognition.passage.measures.option.1=Cada compás
recognition.passage.measures.option.2=Cada 2 compases
recognition.passage.measures.option.4=Cada 4 compases
recognition.passage.threshold.name=Repetir cuando los errores superen
recognition.passage.threshold.tip=Parte de notas y acordes incorrectos o saltados en un pasaje por encima de la cual se vuelve a tocar.
recognition.passage.threshold.option.25=25 %
recognition.passage.threshold.option.50=50 %
recognition.passage.threshold.option.75=75 %
recognition.passage.retries.name=Máximo de repeticiones
recognition.passage.retries.tip=Cuántas veces se repite como máximo un pasaje antes de que la práctica continúe. 0 nunca repite.
recognition.engine.pitch.name=Motor de detección de altura
recognition.engine.pitch.tip=El método que encuentra la nota que se toca. Esta versión tiene un solo motor (FastYin, una nota cada vez); los acordes se comprueban aparte contra el acorde escrito.
recognition.engine.pitch.option.automatic=Automático ({0})
recognition.advanced.level.clip-sample.name=Nivel de muestra saturada
recognition.advanced.level.clip-sample.tip=Una muestra igual o superior a esta parte de la escala completa cuenta como saturada. Ajuste técnico.
recognition.advanced.level.clip-share.name=Proporción de saturación
recognition.advanced.level.clip-share.tip=Proporción de muestras saturadas en una trama por encima de la cual la entrada se indica como saturada. Ajuste técnico.
recognition.advanced.tuner.confidence.name=Certeza mínima del afinador
recognition.advanced.tuner.confidence.tip=Cuán seguro debe estar el detector antes de que el afinador muestre una nota. Más baja: muestra notas más débiles, más parpadeo. Más alta: más estable, puede quedarse en blanco con notas suaves.
recognition.advanced.attack.min-level.name=Umbral de detección de ataque
recognition.advanced.attack.min-level.tip=Un sonido más débil que esto nunca se toma como un nuevo ataque. Más bajo: detecta ataques muy suaves, más ruido. Más alto: ignora el ruido débil.
recognition.advanced.chord.min-partials.name=Armónicos por cuerda en acordes
recognition.advanced.chord.min-partials.tip=Cuántos de los armónicos propios de una cuerda deben oírse para que cuente en un acorde; las cuerdas con menos armónicos propios no se pueden comprobar por separado. Ajuste técnico.
recognition.advanced.chord.confirm.name=Tiempo para confirmar un acorde
recognition.advanced.chord.confirm.tip=Cuánto tiempo deben oírse juntas todas las cuerdas del acorde antes de aceptarlo. Ajuste técnico.

