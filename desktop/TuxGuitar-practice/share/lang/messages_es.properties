practice.amp.middle=Medios
practice.amp.middle.tip=Las frecuencias medias (hacia 700 Hz), recortadas o realzadas. En una escala de 0–10, por defecto 5 (plano).
practice.amp.treble=Agudos
practice.amp.treble.tip=Las frecuencias altas (por encima de 2 kHz), recortadas o realzadas. En una escala de 0–10, por defecto 6.
practice.amp.volume=Volumen
practice.amp.volume.tip=El nivel de salida propio del amplificador. En una escala de 0–10, por defecto 6.
practice.amp.cabinet=Simulación del altavoz
practice.amp.cabinet.tip=Simula el altavoz de un amplificador real tras el amplificador: suaviza los agudos y graves ásperos. Activada por defecto.
practice.amp.unit.scale=0–10
practice.amp.unit.percent=%
practice.amp.failed=El sonido del amplificador se detuvo: {0}
practice.amp.clipping=Tu entrada satura: baja la ganancia de tu interfaz o de la entrada.
practice.amp.before=Antes del amplificador
practice.amp.after=Después del amplificador
practice.amp.unit.db=dB
practice.amp.unit.ms=ms
practice.amp.unit.hz=Hz
practice.amp.add-pedal=Añadir pedal
practice.amp.add-pedal.tip=Añade un pedal que aún no está en la cadena: la puerta de ruido, el compresor, el overdrive y la distorsión van antes del amplificador; el chorus, el eco y la reverb, después.
practice.amp.pedal.up=▲
practice.amp.pedal.up.tip=Adelanta este pedal un puesto en su sección: el sonido lo atraviesa antes.
practice.amp.pedal.down=▼
practice.amp.pedal.down.tip=Atrasa este pedal un puesto en su sección: el sonido lo atraviesa después.
practice.amp.pedal.remove=✕
practice.amp.pedal.remove.tip=Quita este pedal de la cadena. «Añadir pedal» lo vuelve a poner con sus ajustes por defecto.
practice.amp.sound=Sonido
practice.amp.sound.tip=El sonido con el que se oye tu guitarra: primero los ya hechos, luego los tuyos. Elegir uno se oye en seguida y se recuerda para la partitura abierta. Por defecto Clean.
practice.amp.sound-name=Nombre
practice.amp.sound-name.tip=El nombre del sonido: de 1 a 40 caracteres, no el nombre de un sonido ya hecho.
practice.amp.save-as=Guardar como
practice.amp.save-as.tip=Guarda la cadena tal como está con el nombre escrito al lado. Uno de tus sonidos con ese nombre se reemplaza.
practice.amp.rename=Renombrar…
practice.amp.rename.tip=Da un nombre nuevo al sonido actual. Solo tus propios sonidos se pueden renombrar.
practice.amp.delete=Eliminar
practice.amp.delete.tip=Elimina el sonido actual y vuelve a Clean. Solo tus propios sonidos se pueden eliminar.
practice.amp.restore=Restaurar
practice.amp.restore.tip=Devuelve un sonido ya hecho modificado tal como venía.
practice.amp.save=Guardar…
practice.amp.save.tip=Guarda la cadena tal como está con un nombre que escribes. Uno de tus sonidos con ese nombre se reemplaza.
practice.amp.more=⋯
practice.amp.more.tip=Más para el sonido actual: renombrarlo, borrarlo o restaurar un sonido ya hecho modificado.
practice.amp.name-prompt.ok=Aceptar
practice.amp.name-prompt.ok.tip=Usa este nombre.
practice.amp.name-prompt.cancel=Cancelar
practice.amp.name-prompt.cancel.tip=Cierra esta ventana sin cambiar nada.
practice.amp.name-prompt.save-title=Guardar el sonido
practice.amp.name-prompt.rename-title=Renombrar el sonido
practice.amp.tab.before=Pedales antes del amplificador
practice.amp.tab.amp=Amplificador
practice.amp.tab.after=Efectos después del amplificador
practice.amp.tab.output=Salida
practice.amp.changed=(modificado)
practice.amp.name.ready-made=Ese nombre es el de un sonido ya hecho: elige otro.
practice.amp.name.too-long=El nombre de un sonido tiene como máximo {0} caracteres.
practice.amp.warning.title=Usa auriculares
practice.amp.warning.text=Tu entrada es el micrófono integrado del ordenador. Por los altavoces, el sonido del amplificador vuelve al micrófono y puede acoplarse muy fuerte. Conecta auriculares, o elige la entrada de tu guitarra, antes de activar el sonido.
practice.amp.warning.turn-on=Activar de todos modos
practice.amp.warning.turn-on.tip=Inicia el sonido del amplificador con el micrófono integrado. Un acople se corta en menos de medio segundo.
practice.amp.warning.cancel=Cancelar
practice.amp.warning.cancel.tip=Deja el sonido apagado.
practice.amp.feedback=Se oyó un acople: el sonido del amplificador se cortó. Usa auriculares o baja el volumen de la guitarra, luego vuelve a activar el sonido.
practice.amp.overload=El ordenador no da abasto ni con el amplificador solo: el sonido se cortó. Cierra otros programas y vuelve a activar el sonido.
practice.amp.device-lost=Se perdió el dispositivo de audio ({0}): el sonido del amplificador se detuvo, la práctica continúa. Vuelve a conectar el dispositivo y activa el sonido.
practice.amp.lighter.reverb-off=El ordenador va justo: se apagó la reverberación.
practice.amp.lighter.chorus-off=El ordenador va justo: se apagó el chorus.
practice.amp.lighter.oversampling-2x=El ordenador va justo: se redujo el detalle del amplificador.
practice.amp.lighter.oversampling-1x=El ordenador va justo: se redujo otra vez el detalle del amplificador.
practice.amp.lighter.amp-alone=El ordenador va justo: solo se mantienen el amplificador y la pantalla, los pedales quedan desactivados.
practice.amp.pedal.gate=Puerta de ruido
practice.amp.pedal.gate.tip=Silencia el soplido y el zumbido entre tus notas. Haz clic para encenderla o apagarla.
practice.amp.pedal.gate.threshold=Umbral
practice.amp.pedal.gate.threshold.tip=Por debajo de este nivel la puerta se cierra: súbelo si aún oyes soplido, bájalo si corta tus notas suaves. En dB, por defecto -60.
practice.amp.pedal.gate.release=Liberación
practice.amp.pedal.gate.release.tip=El tiempo que tarda la puerta en cerrarse cuando dejas de tocar: más largo conserva el final de tus notas. En ms, por defecto 150.
practice.amp.pedal.compressor=Compresor
practice.amp.pedal.compressor.tip=Iguala las notas fuertes y suaves y las hace durar más. Haz clic para encenderlo o apagarlo.
practice.amp.pedal.compressor.sustain=Sustain
practice.amp.pedal.compressor.sustain.tip=Cuánto se bajan las notas fuertes y se suben las suaves. En una escala de 0–10, por defecto 5.
practice.amp.pedal.compressor.attack=Ataque
practice.amp.pedal.compressor.attack.tip=Lo rápido que reacciona el compresor a una nota: más lento deja pasar el ataque de la púa. En ms, por defecto 10.
practice.amp.pedal.compressor.level=Nivel
practice.amp.pedal.compressor.level.tip=El nivel de salida del pedal; 5 lo deja igual. En una escala de 0–10, por defecto 5.
practice.amp.pedal.overdrive=Overdrive
practice.amp.pedal.overdrive.tip=Una saturación cálida y suave, como un amplificador pequeño a tope. Haz clic para encenderlo o apagarlo.
practice.amp.pedal.overdrive.drive=Drive
practice.amp.pedal.overdrive.drive.tip=Cuánto se empuja el sonido: más drive, más saturación. En una escala de 0–10, por defecto 5.
practice.amp.pedal.overdrive.tone=Tono
practice.amp.pedal.overdrive.tone.tip=Más oscuro hacia 0, más brillante hacia 10. En una escala de 0–10, por defecto 5.
practice.amp.pedal.overdrive.level=Nivel
practice.amp.pedal.overdrive.level.tip=El nivel de salida del pedal; 5 lo deja igual. En una escala de 0–10, por defecto 5.
practice.amp.pedal.distortion=Distorsión
practice.amp.pedal.distortion.tip=Un sonido duro y saturado para riffs y solos. Haz clic para encenderla o apagarla.
practice.amp.pedal.distortion.gain=Ganancia
practice.amp.pedal.distortion.gain.tip=Cuánto se distorsiona el sonido. En una escala de 0–10, por defecto 6.
practice.amp.pedal.distortion.tone=Tono
practice.amp.pedal.distortion.tone.tip=Más oscuro hacia 0, más brillante hacia 10. En una escala de 0–10, por defecto 5.
practice.amp.pedal.distortion.level=Nivel
practice.amp.pedal.distortion.level.tip=El nivel de salida del pedal; 5 lo deja igual. En una escala de 0–10, por defecto 5.
practice.amp.pedal.chorus=Chorus
practice.amp.pedal.chorus.tip=Dobla tu guitarra con una copia que se mueve un poco, para un sonido amplio y brillante. Haz clic para encenderlo o apagarlo.
practice.amp.pedal.chorus.rate=Velocidad
practice.amp.pedal.chorus.rate.tip=Lo rápido que se mueve la copia. En Hz, por defecto 0.8.
practice.amp.pedal.chorus.depth=Profundidad
practice.amp.pedal.chorus.depth.tip=Cuánto se mueve la copia: más profundidad, más brillo. En una escala de 0–10, por defecto 5.
practice.amp.pedal.chorus.mix=Mezcla
practice.amp.pedal.chorus.mix.tip=Cuánto se oye la copia junto a tu guitarra; 0 % es tu guitarra sola. En %, por defecto 50.
practice.amp.pedal.echo=Eco
practice.amp.pedal.echo.tip=Repite tus notas tras un retardo; las repeticiones siguen cuando paras. Haz clic para encenderlo o apagarlo.
practice.amp.pedal.echo.time=Tiempo
practice.amp.pedal.echo.time.tip=El tiempo entre una nota y su repetición, hasta 1,5 s. En ms, por defecto 380.
practice.amp.pedal.echo.repeats=Repeticiones
practice.amp.pedal.echo.repeats.tip=Cuántas repeticiones oyes antes de que se apaguen. En una escala de 0–10, por defecto 3.
practice.amp.pedal.echo.tone=Tono
practice.amp.pedal.echo.tone.tip=Repeticiones más oscuras hacia 0, más brillantes hacia 10. En una escala de 0–10, por defecto 5.
practice.amp.pedal.echo.mix=Mezcla
practice.amp.pedal.echo.mix.tip=El volumen de las repeticiones junto a tu guitarra; 0 % es tu guitarra sola. En %, por defecto 30.
practice.amp.pedal.reverb=Reverb
practice.amp.pedal.reverb.tip=Pone tu guitarra en una habitación o una sala. Haz clic para encenderla o apagarla.
practice.amp.pedal.reverb.size=Tamaño
practice.amp.pedal.reverb.size.tip=El tamaño de la sala: más grande, cola más larga. En una escala de 0–10, por defecto 5.
practice.amp.pedal.reverb.damping=Amortiguación
practice.amp.pedal.reverb.damping.tip=Lo rápido que se apagan los agudos en la cola: más amortiguación, sala más suave. En una escala de 0–10, por defecto 5.
practice.amp.pedal.reverb.mix=Mezcla
