practice.fire.opacity.most=Opacidad máxima
practice.fire.opacity.most.tip=Lo opaca que es la parte más caliente del fuego. Más bajo deja ver mejor la imagen; al 100 % oculta lo que hay detrás.
practice.fire.cell.columns=Píxeles a lo ancho
practice.fire.cell.columns.tip=Cuántos píxeles grandes forman el ancho del fuego. Más da píxeles pequeños y finos; menos da un fuego más tosco.
practice.fire.cell.smallest=Píxel más pequeño
practice.fire.cell.smallest.tip=El tamaño mínimo de un píxel grande, sea cual sea el ancho de la ventana. Más grande mantiene el fuego tosco y más barato de dibujar en una ventana pequeña.
practice.fire.discreet.share=Parte del discreto
practice.fire.discreet.share.tip=Con la opción Discreto, el fuego tiene esta parte de la altura y de la opacidad de la opción Completo.
practice.fire.height.corners=Altura en las esquinas
practice.fire.height.corners.tip=Hasta dónde llega el fuego en sus dos esquinas cuando ha crecido del todo, como parte de la imagen (Arcade) o de la zona de la partitura (fuego en la partitura).
practice.fire.height.middle=Altura en el centro
practice.fire.height.middle.tip=La altura del centro del fuego, como parte de la altura en las esquinas. Baja deja libre el centro de la imagen.
practice.fire.height.curve=Forma del borde
practice.fire.height.curve.tip=Cómo crece la altura desde el centro hacia las esquinas. 2 es un cuenco suave; más bajo sube antes, más alto mantiene el centro bajo más tiempo.
practice.fire.body.heat=Calor de las llamas
practice.fire.body.heat.tip=Lo caliente que es el cuerpo de cada llama. Más alto da más amarillo y blanco; más bajo, un fuego más rojo y oscuro.
practice.fire.body.falloff=Enfriamiento hacia las puntas
practice.fire.body.falloff.tip=Cómo se mantiene el calor de una llama hacia su punta. Más alto conserva el calor hasta arriba; más bajo vuelve las puntas rojas y tenues antes.
practice.fire.body.ramp=Despertar de las brasas
practice.fire.body.ramp.tip=Lo rápido que se avivan las brasas cuando el fuego empieza a crecer, en veces el crecimiento.
practice.fire.flicker.strength=Parpadeo
practice.fire.flicker.strength.tip=Cuánto parpadea el calor dentro de las llamas. 0 da llamas lisas; más alto, un fuego más salvaje e irregular.
practice.fire.flicker.base=Parpadeo en la base
practice.fire.flicker.base.tip=Cuánto parpadeo hay ya en la parte baja de las llamas. El parpadeo siempre crece hacia las puntas.
practice.fire.motion.speed=Velocidad
practice.fire.motion.speed.tip=Lo rápido que se mueve todo el fuego: su subida, su balanceo y su parpadeo. 0 lo congela; 2 va el doble de rápido.
practice.fire.motion.rise=Velocidad de subida
practice.fire.motion.rise.tip=Lo rápido que sube el dibujo de las llamas, en filas de píxeles grandes por segundo.
practice.fire.sway.width=Amplitud del balanceo
practice.fire.sway.width.tip=Cuánto se balancean las llamas de un lado a otro, en columnas de píxeles grandes.
practice.fire.sway.speed=Velocidad del balanceo
practice.fire.sway.speed.tip=Lo rápido que se balancean las llamas de un lado a otro.
practice.fire.sway.rows=Balanceo a lo alto
practice.fire.sway.rows.tip=Cuánto cambia el balanceo de una fila a la siguiente: más alto hace que las llamas ondulen como una serpiente.
practice.fire.noise.large=Formas grandes
practice.fire.noise.large.tip=El peso de las formas grandes en el dibujo de las llamas: las lenguas anchas.
practice.fire.noise.medium=Formas medianas
practice.fire.noise.medium.tip=El peso de las formas medianas en el dibujo de las llamas.
practice.fire.noise.fine=Detalle fino
practice.fire.noise.fine.tip=El peso del detalle fino en el dibujo de las llamas: los pequeños destellos.
practice.fire.noise.scale=Tamaño del dibujo
practice.fire.noise.scale.tip=El ancho de las formas más grandes del dibujo, en columnas de píxeles grandes. Más alto da lenguas más anchas.
practice.fire.noise.aspect=Altura del dibujo
practice.fire.noise.aspect.tip=Cuántas veces son las formas del dibujo más altas que anchas. Más alto da lenguas largas que suben.
practice.fire.ember.rows=Filas de brasas
practice.fire.ember.rows.tip=Cuántas filas de brasas brillan abajo, incluso antes de que crezca el fuego. 0 las quita.
practice.fire.ember.glow=Brillo de las brasas
practice.fire.ember.glow.tip=Lo brillantes que son las brasas mientras el fuego está bajo.
practice.fire.ember.flicker=Parpadeo de las brasas
practice.fire.ember.flicker.tip=Cuánto parpadean las brasas mientras el fuego está bajo.
practice.fire.growth.from=Inicio del crecimiento
practice.fire.growth.from.tip=La parte de la puntuación máxima (Arcade) o de la racha completa (fuego en la partitura) a partir de la cual las llamas suben por encima de las brasas.
practice.fire.growth.minJudged=Notas antes de crecer
practice.fire.growth.minJudged.tip=Cuántas notas deben juzgarse antes de que el fuego siga la interpretación, para que la primera nota no lo haga saltar.
practice.fire.growth.full=Racha para la altura completa
practice.fire.growth.full.tip=Cuántas notas correctas seguidas hacen que el fuego en la partitura alcance su altura completa.
practice.fire.growth.rise=Velocidad de crecimiento
practice.fire.growth.rise.tip=Lo rápido que crece el fuego, en alturas completas por segundo.
practice.fire.growth.fall=Velocidad de caída
practice.fire.growth.fall.tip=Lo rápido que baja el fuego, tras un error, en alturas completas por segundo. Con 1 pasa de la altura completa a las brasas en un segundo.
practice.fire.growth.maxStep=Paso más largo
practice.fire.growth.maxStep.tip=Cuando el ordenador está ocupado y las imágenes llegan tarde, el fuego se mueve como si hubiera pasado como mucho este tiempo, para no saltar nunca.
practice.fire.sparks.base=Chispas por nota correcta
practice.fire.sparks.base.tip=Cuántas chispas lanza cada nota correcta, antes del extra de la racha.
practice.fire.sparks.perStreak=Chispas extra por nota seguida
practice.fire.sparks.perStreak.tip=Cuántas chispas más lanza una nota correcta por cada nota de la racha, hasta el tope de racha de abajo.
practice.fire.sparks.streakCap=Tope de racha de las chispas
practice.fire.sparks.streakCap.tip=La racha a partir de la cual una nota correcta ya no lanza chispas extra.
practice.fire.sparks.most=Máximo de chispas a la vez
practice.fire.sparks.most.tip=El máximo de chispas en el aire a la vez; por encima no se dibujan las más antiguas. Más bajo cuesta menos dibujar.
practice.fire.sparks.life=Vida de una chispa
practice.fire.sparks.life.tip=Cuánto vive una chispa antes de apagarse del todo.
practice.fire.sparks.rise=Subida de las chispas
practice.fire.sparks.rise.tip=Cuántas filas sube como mínimo una chispa durante su vida.
practice.fire.sparks.riseSpread=Dispersión de la subida
practice.fire.sparks.riseSpread.tip=Cuántas filas más suben unas chispas que otras, para que se repartan.
practice.fire.sparks.drift=Deriva de las chispas
practice.fire.sparks.drift.tip=Cuánto se desvían las chispas hacia los lados durante su vida, en columnas.
practice.fire.sparks.zone=Zona de las chispas
practice.fire.sparks.zone.tip=La parte del ancho, desde cada esquina, donde se lanzan las chispas.
practice.fire.sparks.start=Altura de salida de las chispas
practice.fire.sparks.start.tip=Desde dónde salen las chispas: 0 en la base de las llamas, 100 % en sus puntas.
practice.fire.sparks.fade=Enfriamiento de las chispas
practice.fire.sparks.fade.tip=Cuántos pasos de color se enfría una chispa durante su vida, del blanco hacia el rojo.
practice.fire.colour.steps=Pasos de color
practice.fire.colour.steps.tip=Cuántos pasos de color tiene el fuego, del más frío al más caliente. Menos da un fuego más plano, como un cartel.
practice.fire.colour.1=Color más frío
practice.fire.colour.1.tip=El color de la parte más fría del fuego, en sus bordes.
practice.fire.colour.2=Segundo color
practice.fire.colour.2.tip=El segundo color del fuego, de frío a caliente.
practice.fire.colour.3=Color del medio
practice.fire.colour.3.tip=El color en el medio de la escala del fuego, de frío a caliente.
practice.fire.colour.4=Cuarto color
practice.fire.colour.4.tip=El cuarto color del fuego, de frío a caliente.
practice.fire.colour.5=Color más caliente
practice.fire.colour.5.tip=El color de la parte más caliente del fuego.
# spec 022: la ventana Amplificador y efectos
practice.amp.open=Amplificador y efectos…
practice.amp.open.tip=Abre la ventana donde tu guitarra se oye a través de un amplificador y su pantalla, con la partitura.
practice.amp.title=Amplificador y efectos
practice.amp.enabled=Oír mi guitarra a través del amplificador
practice.amp.enabled.tip=Hace sonar tu guitarra a través del amplificador mientras la ventana de práctica está abierta. Apagado por defecto. Usa auriculares: los altavoces pueden acoplarse con un micrófono.
practice.amp.output=Salida
practice.amp.output.tip=Dónde suena el amplificador: lo mejor son unos auriculares. Por defecto, la salida del sistema.
practice.amp.output.default=Salida del sistema
practice.amp.guitar-volume=Volumen de la guitarra
practice.amp.guitar-volume.tip=Qué tan fuerte se oye tu guitarra, de 0 a 100 %. Por defecto 70 %.
practice.amp.score-volume=Volumen de la partitura
practice.amp.score-volume.tip=Qué tan fuerte suena la partitura (el volumen de TuxGuitar), en una escala de 0–10. Por defecto 10.
practice.amp.delay=Retardo:
practice.amp.delay.tip=El tiempo entre tu nota y su sonido, calculado a partir de los dispositivos (una estimación). Los auriculares Bluetooth añaden su propio retardo: usa unos con cable.
practice.amp.delay.value=unos {0} ms (estimación)
practice.amp.delay.unknown=desconocido mientras el sonido está apagado
practice.amp.amp=Amplificador
