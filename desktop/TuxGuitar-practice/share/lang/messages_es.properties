recognition.apply-note=Los cambios se guardan con Aceptar; Cancelar conserva los valores anteriores. Los valores del afinador se aplican al instante, los de la práctica en el siguiente Inicio; los valores de nivel y de ataque reinician brevemente la escucha. Pasa el ratón sobre el nombre de un ajuste para ver qué hace. Más información en Ayuda › Reconocimiento de audio.
recognition.restore-all=Restablecer todos los ajustes de reconocimiento de audio
recognition.restore-section=Restablecer los valores recomendados de esta categoría
recognition.input.note=La entrada la comparten el afinador y la práctica. Cambia al instante y no se recuerda al cerrar TuxGuitar.
recognition.on=Activado
recognition.off=Desactivado
recognition.single-option=Única opción disponible en esta versión
