# límites medidos mostrados al alumno (spec 004 T008, T009)
practice.delay.info=Una nota se reconoce unos {0} s después de tocarla, en la mayoría de los casos en menos de {1} s (medido en grabaciones reales). Las notas separadas por menos de unos {2} s pueden no seguirse: la práctica te espera.
practice.speed-limit=↯ Una nota llegó más rápido de lo que el reconocimiento puede seguir (a menos de unos {0} s de la anterior). Es un límite del reconocimiento, no un error tuyo: toca la nota otra vez, un poco más despacio.

# entrada demasiado débil para un reconocimiento rápido fiable (spec 002 FR-015)
practice.input.too-weak=Entrada demasiado débil para un reconocimiento rápido fiable: tus notas solo alcanzan unos {0} dBFS. Sube la ganancia de entrada (o la de tu interfaz de audio), o toca más cerca del micrófono.

# ---- Modo «seguir el tempo» (spec 002, T100) ----
practice.mode=Modo de práctica
practice.mode.wait=Esperar la nota correcta
practice.mode.follow=Seguir el tempo
practice.mode.wait.hint=La partitura te espera: toca cada nota cuando estés listo.
practice.mode.follow.hint=La partitura avanza a su tempo, con una cuenta atrás, y suenan las demás pistas; la pista que practicas queda en silencio. Cada nota se juzga a tiempo, adelantada, retrasada o fallada.
practice.start.follow=Seguir el tempo de esta pista
practice.follow.percent=Tempo (% del tempo escrito)
practice.follow.percent.hint=De {0} % a {1} %. Empieza más despacio y súbelo poco a poco.
practice.follow.tolerance=Tolerancia de tiempo
practice.follow.tolerance.strict=Estricta
practice.follow.tolerance.normal=Normal
practice.follow.tolerance.lenient=Flexible
practice.follow.tolerance.hint=Cuánto puede alejarse una nota de su tiempo y contar como a tiempo. La ventana se adapta al tempo.
practice.follow.count-in=Primero suena una cuenta atrás.
practice.follow.player-busy=La partitura ya se está reproduciendo. Detén la reproducción y vuelve a empezar.
practice.follow.start-failed=El reproductor no pudo arrancar. Revisa la salida de audio en la configuración.
practice.follow.ended.manual-play=El seguimiento del tempo se detuvo porque reprodujiste la partitura. La reproducción normal continúa.
practice.follow.ended.player-stopped=El seguimiento del tempo terminó porque la reproducción se detuvo.
practice.follow.ended.failed=El seguimiento del tempo se detuvo por un error. No se cambió nada en tu canción.
practice.follow.state.PREPARING=Preparando.
practice.follow.state.COUNT_IN=Cuenta atrás: prepárate.
practice.follow.state.FOLLOWING=Siguiendo el tempo: toca con la partitura.
practice.follow.state.PAUSED=En pausa:
practice.follow.state.READY_TO_RESUME=Listo para continuar. Pulsa Continuar cuando estés listo; las notas que pasaron no se juzgaron.
