practice.fire.score.setting.tip=Un feu en bas de la partition qui grandit avec vos notes justes d'affilée et retombe à une erreur. Pure décoration : il ne change rien au jugement. Éteint par défaut.
practice.fire.score.off=Éteint
practice.fire.score.discreet=Discret
practice.fire.score.full=Plein
practice.tab.advanced=Avancé
practice.fire.group.arcade=Feu d'Arcade
practice.fire.group.score=Feu sur la partition
practice.fire.defaults=Valeurs par défaut
practice.fire.defaults.tip=Remet chaque réglage de ce groupe à sa valeur par défaut. L'autre groupe garde ses réglages.
practice.fire.preview.sparks=Étincelles
practice.fire.preview.sparks.tip=Lance une gerbe d'étincelles dans l'aperçu, comme le ferait une note juste.
practice.fire.preview.growth=Croissance
practice.fire.preview.growth.tip=Jusqu'où le feu de l'aperçu a grandi : la série de notes justes pour le feu sur la partition, la part du score maximum pour Arcade.
practice.fire.tooltip.unit=Unité : {0}
practice.fire.tooltip.default=Par défaut : {0}
practice.fire.colour.choose=Choisir…
practice.fire.section.look=Aspect
practice.fire.section.flames=Flammes
practice.fire.section.motion=Mouvement
practice.fire.section.embers=Braises
practice.fire.section.growth=Croissance
practice.fire.section.sparks=Étincelles
practice.fire.section.colours=Couleurs
practice.fire.unit.share=%
practice.fire.unit.times=×
practice.fire.unit.pixels=px
practice.fire.unit.columns=colonnes
practice.fire.unit.rows=rangées
practice.fire.unit.rows_per_second=rangées/s
practice.fire.unit.radians_per_second=rad/s
practice.fire.unit.radians_per_row=rad/rangée
practice.fire.unit.notes=notes
practice.fire.unit.heights_per_second=hauteurs/s
practice.fire.unit.milliseconds=ms
practice.fire.unit.sparks=étincelles
practice.fire.unit.seconds=s
practice.fire.unit.steps=paliers
practice.fire.opacity.most=Opacité maximale
practice.fire.opacity.most.tip=L'opacité de la partie la plus chaude du feu. Plus bas, on voit mieux l'image au travers ; à 100 %, le feu cache ce qui est derrière.
practice.fire.cell.columns=Pixels en largeur
practice.fire.cell.columns.tip=Le nombre de gros pixels sur la largeur du feu. Plus il y en a, plus ils sont petits et fins ; moins il y en a, plus le feu est grossier.
practice.fire.cell.smallest=Plus petit pixel
practice.fire.cell.smallest.tip=La taille minimale d'un gros pixel, quelle que soit la largeur de la fenêtre. Plus grand, le feu reste grossier et moins coûteux à dessiner dans une petite fenêtre.
practice.fire.discreet.share=Part du discret
practice.fire.discreet.share.tip=Avec le choix Discret, le feu a cette part de la hauteur et de l'opacité du choix Plein.
practice.fire.height.corners=Hauteur aux coins
practice.fire.height.corners.tip=Jusqu'où le feu monte à ses deux coins quand il a fini de grandir, en part de l'image (Arcade) ou de la zone de la partition (feu sur la partition).
practice.fire.height.middle=Hauteur au milieu
practice.fire.height.middle.tip=La hauteur du milieu du feu, en part de la hauteur aux coins. Bas, le milieu de l'image reste libre.
practice.fire.height.curve=Forme du bord
practice.fire.height.curve.tip=Comment la hauteur augmente du milieu vers les coins. 2 donne une cuvette douce ; plus bas, elle monte plus tôt ; plus haut, le milieu reste bas plus longtemps.
practice.fire.body.heat=Chaleur des flammes
practice.fire.body.heat.tip=La chaleur du corps de chaque flamme. Plus haut, plus de jaune et de blanc ; plus bas, un feu plus rouge et plus sombre.
practice.fire.body.falloff=Refroidissement vers les pointes
practice.fire.body.falloff.tip=Comment la chaleur d'une flamme tient jusqu'à sa pointe. Plus haut, la chaleur monte jusqu'en haut ; plus bas, les pointes rougissent et pâlissent plus tôt.
practice.fire.body.ramp=Réveil des braises
practice.fire.body.ramp.tip=La vitesse à laquelle les braises s'avivent quand le feu commence à grandir, en fois la croissance.
practice.fire.flicker.strength=Scintillement
practice.fire.flicker.strength.tip=L'ampleur du scintillement de la chaleur dans les flammes. 0 donne des flammes lisses ; plus haut, un feu plus sauvage et déchiqueté.
practice.fire.flicker.base=Scintillement à la base
practice.fire.flicker.base.tip=La part du scintillement déjà présente au pied des flammes. Le scintillement augmente toujours vers les pointes.
practice.fire.motion.speed=Vitesse
practice.fire.motion.speed.tip=La vitesse de tout le mouvement du feu : sa montée, son balancement et son scintillement. 0 le fige ; 2 va deux fois plus vite.
practice.fire.motion.rise=Vitesse de montée
practice.fire.motion.rise.tip=La vitesse à laquelle le motif des flammes monte, en rangées de gros pixels par seconde.
practice.fire.sway.width=Amplitude du balancement
practice.fire.sway.width.tip=La distance sur laquelle les flammes se balancent de gauche à droite, en colonnes de gros pixels.
practice.fire.sway.speed=Vitesse du balancement
practice.fire.sway.speed.tip=La vitesse à laquelle les flammes se balancent de gauche à droite.
practice.fire.sway.rows=Balancement sur la hauteur
practice.fire.sway.rows.tip=Le décalage du balancement d'une rangée à la suivante : plus haut, les flammes ondulent comme un serpent.
practice.fire.noise.large=Grandes formes
practice.fire.noise.large.tip=Le poids des grandes formes dans le motif des flammes : les larges langues de feu.
practice.fire.noise.medium=Formes moyennes
practice.fire.noise.medium.tip=Le poids des formes moyennes dans le motif des flammes.
practice.fire.noise.fine=Détails fins
practice.fire.noise.fine.tip=Le poids des détails fins dans le motif des flammes : les petits éclats qui scintillent.
practice.fire.noise.scale=Taille du motif
practice.fire.noise.scale.tip=La largeur des plus grandes formes du motif, en colonnes de gros pixels. Plus haut, des langues de feu plus larges.
practice.fire.noise.aspect=Hauteur du motif
practice.fire.noise.aspect.tip=Combien de fois les formes du motif sont plus hautes que larges. Plus haut, de longues langues de feu qui montent.
practice.fire.ember.rows=Rangées de braises
practice.fire.ember.rows.tip=Le nombre de rangées de braises qui rougeoient en bas, même avant que le feu grandisse. 0 les supprime.
practice.fire.ember.glow=Lueur des braises
practice.fire.ember.glow.tip=La luminosité des braises tant que le feu est bas.
practice.fire.ember.flicker=Scintillement des braises
practice.fire.ember.flicker.tip=L'ampleur du scintillement des braises tant que le feu est bas.
practice.fire.growth.from=Début de la croissance
practice.fire.growth.from.tip=La part du score maximum (Arcade) ou de la série complète (feu sur la partition) à partir de laquelle les flammes montent au-dessus des braises.
practice.fire.growth.minJudged=Notes avant de grandir
practice.fire.growth.minJudged.tip=Le nombre de notes à juger avant que le feu suive le jeu, pour que la première note ne le fasse pas bondir.
practice.fire.growth.full=Série pour la pleine hauteur
practice.fire.growth.full.tip=Le nombre de notes justes d'affilée qui amène le feu sur la partition à sa pleine hauteur.
practice.fire.growth.rise=Vitesse de croissance
practice.fire.growth.rise.tip=La vitesse à laquelle le feu grandit, en hauteurs complètes par seconde.
practice.fire.growth.fall=Vitesse de retombée
practice.fire.growth.fall.tip=La vitesse à laquelle le feu retombe, après une erreur, en hauteurs complètes par seconde. À 1, il passe de sa pleine hauteur aux braises en une seconde.
practice.fire.growth.maxStep=Pas le plus long
practice.fire.growth.maxStep.tip=Quand l'ordinateur est occupé et que les images arrivent en retard, le feu bouge comme si au plus ce temps s'était écoulé, pour ne jamais bondir.
practice.fire.sparks.base=Étincelles par note juste
practice.fire.sparks.base.tip=Le nombre d'étincelles lancées par chaque note juste, avant le bonus de la série.
practice.fire.sparks.perStreak=Étincelles en plus par note d'affilée
practice.fire.sparks.perStreak.tip=Le nombre d'étincelles en plus qu'une note juste lance pour chaque note de la série, jusqu'au plafond de série ci-dessous.
practice.fire.sparks.streakCap=Plafond de série des étincelles
practice.fire.sparks.streakCap.tip=La série au-delà de laquelle une note juste ne lance plus d'étincelles en plus.
practice.fire.sparks.most=Étincelles au plus en même temps
practice.fire.sparks.most.tip=Le nombre maximal d'étincelles en l'air en même temps ; au-delà, les plus anciennes ne sont pas dessinées. Plus bas coûte moins à dessiner.
practice.fire.sparks.life=Durée de vie d'une étincelle
practice.fire.sparks.life.tip=Le temps que vit une étincelle avant de s'être éteinte.
practice.fire.sparks.rise=Montée des étincelles
practice.fire.sparks.rise.tip=Le nombre de rangées qu'une étincelle monte au moins pendant sa vie.
practice.fire.sparks.riseSpread=Dispersion de la montée
practice.fire.sparks.riseSpread.tip=Le nombre de rangées que certaines étincelles montent de plus que d'autres, pour qu'elles s'étalent.
practice.fire.sparks.drift=Dérive des étincelles
practice.fire.sparks.drift.tip=La distance sur laquelle les étincelles dérivent sur le côté pendant leur vie, en colonnes.
practice.fire.sparks.zone=Zone des étincelles
practice.fire.sparks.zone.tip=La part de la largeur, depuis chaque coin, où les étincelles sont lancées.
practice.fire.sparks.start=Hauteur de départ des étincelles
practice.fire.sparks.start.tip=L'endroit d'où partent les étincelles : 0 au pied des flammes, 100 % à leurs pointes.
practice.fire.sparks.fade=Refroidissement des étincelles
practice.fire.sparks.fade.tip=Le nombre de paliers de couleur dont une étincelle refroidit pendant sa vie, du blanc vers le rouge.
practice.fire.colour.steps=Paliers de couleur
practice.fire.colour.steps.tip=Le nombre de paliers de couleur du feu, du plus froid au plus chaud. Moins il y en a, plus le feu est en aplats, comme une affiche.
practice.fire.colour.1=Couleur la plus froide
practice.fire.colour.1.tip=La couleur de la partie la plus froide du feu, sur ses bords.
practice.fire.colour.2=Deuxième couleur
practice.fire.colour.2.tip=La deuxième couleur du feu, du froid vers le chaud.
practice.fire.colour.3=Couleur du milieu
practice.fire.colour.3.tip=La couleur au milieu de l'échelle du feu, du froid vers le chaud.
practice.fire.colour.4=Quatrième couleur
practice.fire.colour.4.tip=La quatrième couleur du feu, du froid vers le chaud.
practice.fire.colour.5=Couleur la plus chaude
practice.fire.colour.5.tip=La couleur de la partie la plus chaude du feu.
# spec 022 : la fenêtre Ampli et effets
practice.amp.open=Ampli et effets…
practice.amp.open.tip=Ouvre la fenêtre où ta guitare s'entend à travers un ampli et son baffle, avec la partition.
practice.amp.title=Ampli et effets
practice.amp.enabled=Entendre ma guitare dans l'ampli
practice.amp.enabled.tip=Fait entendre ta guitare à travers l'ampli tant que la fenêtre de pratique est ouverte. Coupé par défaut. Utilise un casque : des haut-parleurs peuvent provoquer un larsen avec un micro.
practice.amp.output=Sortie
practice.amp.output.tip=Où le son de l'ampli est joué : un casque est le mieux. Par défaut, la sortie du système.
practice.amp.output.default=Sortie du système
practice.amp.guitar-volume=Volume de la guitare
practice.amp.guitar-volume.tip=La force à laquelle ta guitare s'entend, de 0 à 100 %. Par défaut 70 %.
practice.amp.score-volume=Volume de la partition
practice.amp.score-volume.tip=La force à laquelle la partition joue (le volume de TuxGuitar), sur une échelle de 0–10. Par défaut 10.
practice.amp.delay=Délai :
practice.amp.delay.tip=Le temps entre ta note et son son, calculé d'après les appareils (une estimation). Un casque Bluetooth ajoute son propre délai : préfère un casque filaire.
practice.amp.delay.value=environ {0} ms (estimation)
practice.amp.delay.unknown=inconnu tant que le son est coupé
practice.amp.amp=Ampli
practice.amp.character=Caractère
practice.amp.character.tip=Le genre d'ampli : Clair reste net, Crunch sature quand tu attaques fort, Saturé distord beaucoup. Par défaut Clair.
practice.amp.character.clean=Clair
practice.amp.character.crunch=Crunch
practice.amp.character.high-gain=Saturé
practice.amp.gain=Gain
practice.amp.gain.tip=La force avec laquelle l'ampli est attaqué : plus de gain, plus de distorsion. Sur une échelle de 0–10, par défaut 3.
practice.amp.bass=Graves
practice.amp.bass.tip=Les basses fréquences (vers 100 Hz), coupées ou renforcées. Sur une échelle de 0–10, par défaut 5 (neutre).
practice.amp.middle=Médiums
practice.amp.middle.tip=Les fréquences moyennes (vers 700 Hz), coupées ou renforcées. Sur une échelle de 0–10, par défaut 5 (neutre).
practice.amp.treble=Aigus
practice.amp.treble.tip=Les hautes fréquences (au-dessus de 2 kHz), coupées ou renforcées. Sur une échelle de 0–10, par défaut 6.
practice.amp.volume=Volume
practice.amp.volume.tip=Le niveau de sortie de l'ampli. Sur une échelle de 0–10, par défaut 6.
practice.amp.cabinet=Simulation du haut-parleur
practice.amp.cabinet.tip=Simule le haut-parleur d'un vrai ampli après l'ampli : il adoucit les aigus et les graves trop durs. Activée par défaut.
practice.amp.unit.scale=0–10
practice.amp.unit.percent=%
practice.amp.failed=Le son de l'ampli s'est arrêté : {0}
practice.amp.clipping=Ton entrée sature : baisse le gain de ton interface ou de l'entrée.
practice.amp.before=Avant l'ampli
practice.amp.after=Après l'ampli
practice.amp.unit.db=dB
practice.amp.unit.ms=ms
practice.amp.unit.hz=Hz
practice.amp.add-pedal=Ajouter une pédale
practice.amp.add-pedal.tip=Ajoute une pédale qui n'est pas encore dans la chaîne : le noise gate, le compresseur, l'overdrive et la distorsion se placent avant l'ampli, le chorus, l'écho et la réverbe après.
practice.amp.pedal.up=▲
practice.amp.pedal.up.tip=Avance cette pédale d'une place dans sa section : le son la traverse plus tôt.
practice.amp.pedal.down=▼
practice.amp.pedal.down.tip=Recule cette pédale d'une place dans sa section : le son la traverse plus tard.
practice.amp.pedal.remove=✕
practice.amp.pedal.remove.tip=Retire cette pédale de la chaîne. « Ajouter une pédale » la remet avec ses réglages par défaut.
practice.amp.sound=Son
practice.amp.sound.tip=Le son avec lequel ta guitare est entendue : les sons tout faits d'abord, puis les tiens. Le choix s'entend tout de suite et est retenu pour la partition ouverte. Par défaut Clean.
practice.amp.sound-name=Nom
practice.amp.sound-name.tip=Le nom du son : de 1 à 40 caractères, pas le nom d'un son tout fait.
practice.amp.save-as=Enregistrer sous
practice.amp.save-as.tip=Garde la chaîne telle qu'elle est sous le nom tapé à côté. Un de tes sons de même nom est remplacé.
practice.amp.rename=Renommer…
practice.amp.rename.tip=Donne un nouveau nom au son en cours. Seuls tes propres sons peuvent être renommés.
practice.amp.delete=Supprimer
practice.amp.delete.tip=Supprime le son en cours et revient à Clean. Seuls tes propres sons peuvent être supprimés.
practice.amp.restore=Rétablir
practice.amp.restore.tip=Remet un son tout fait modifié tel qu'il était livré.
practice.amp.save=Enregistrer…
practice.amp.save.tip=Garde la chaîne telle qu'elle est sous un nom que tu tapes. Un de tes sons qui porte ce nom est remplacé.
practice.amp.more=⋯
practice.amp.more.tip=Plus pour le son en cours : le renommer, le supprimer, rétablir un son tout fait modifié, ou exporter ou importer un fichier de son.
practice.amp.export=Exporter…
practice.amp.export.tip=Enregistre le son en cours dans un fichier .guitarfx, que GuitarFX et TuxGuitarAdvanced savent importer.
practice.amp.import=Importer…
practice.amp.import.tip=Ajoute à tes sons le son d'un fichier .guitarfx, fait par GuitarFX ou TuxGuitarAdvanced.
practice.amp.import.replace=Le remplacer
practice.amp.import.replace.tip=Le son importé prend la place de ton son du même nom.
practice.amp.import.keep-both=Garder les deux
practice.amp.import.keep-both.tip=Garde ton son et ajoute le son importé avec un numéro après son nom.
practice.amp.import.clash-title=Importer un son
practice.amp.import.clash=Tu as déjà un son nommé « {0} ».
practice.amp.import.done=« {0} » a été ajouté à tes sons.
practice.amp.file.format=Son GuitarFX
practice.amp.file.newer=Ce fichier de son vient d'une version plus récente : il ne peut pas être importé. Rien n'a été changé.
practice.amp.file.not=Ce fichier n'est pas un fichier de son, ou il est abîmé : il ne peut pas être importé. Rien n'a été changé.
practice.amp.export.done=Le son a été enregistré dans {0}.
practice.amp.export.failed=Le son n'a pas pu être enregistré : {0}
practice.amp.name-prompt.ok=OK
practice.amp.name-prompt.ok.tip=Utilise ce nom.
practice.amp.name-prompt.cancel=Annuler
practice.amp.name-prompt.cancel.tip=Ferme cette fenêtre sans rien changer.
practice.amp.name-prompt.save-title=Enregistrer le son
practice.amp.name-prompt.rename-title=Renommer le son
practice.amp.tab.before=Pédales avant l'ampli
practice.amp.tab.amp=Ampli
practice.amp.tab.after=Effets après l'ampli
practice.amp.tab.output=Sortie
practice.amp.changed=(modifié)
practice.amp.name.ready-made=Ce nom est celui d'un son tout fait : choisis-en un autre.
practice.amp.name.too-long=Le nom d'un son a au plus {0} caractères.
practice.amp.warning.title=Utilise un casque
practice.amp.warning.text=Ton entrée est le micro intégré de l'ordinateur. Par les haut-parleurs, le son de l'ampli revient dans le micro et peut provoquer un larsen très fort. Branche un casque, ou choisis l'entrée de ta guitare, avant d'activer le son.
practice.amp.warning.turn-on=Activer quand même
practice.amp.warning.turn-on.tip=Démarre le son de l'ampli avec le micro intégré. Un larsen est coupé en moins d'une demi-seconde.
practice.amp.warning.cancel=Annuler
practice.amp.warning.cancel.tip=Laisse le son coupé.
practice.amp.feedback=Un larsen a été entendu : le son de l'ampli a été coupé. Utilise un casque ou baisse le volume de la guitare, puis réactive le son.
practice.amp.overload=L'ordinateur ne suit pas, même avec l'ampli seul : le son a été coupé. Ferme d'autres programmes, puis réactive le son.
practice.amp.device-lost=Le périphérique audio a été perdu ({0}) : le son de l'ampli s'est arrêté, la pratique continue. Rebranche le périphérique et réactive le son.
practice.amp.lighter.reverb-off=L'ordinateur peine : la réverbération a été coupée.
practice.amp.lighter.chorus-off=L'ordinateur peine : le chorus a été coupé.
practice.amp.lighter.oversampling-2x=L'ordinateur peine : la finesse de l'ampli a été réduite.
practice.amp.lighter.oversampling-1x=L'ordinateur peine : la finesse de l'ampli a encore été réduite.
practice.amp.lighter.amp-alone=L'ordinateur peine : seuls l'ampli et le baffle sont gardés, les pédales sont contournées.
practice.amp.pedal.gate=Noise gate
practice.amp.pedal.gate.tip=Coupe le souffle et le ronflement entre tes notes. Clique pour l'allumer ou l'éteindre.
practice.amp.pedal.gate.threshold=Seuil
practice.amp.pedal.gate.threshold.tip=Sous ce niveau le gate se ferme : monte-le si tu entends encore du souffle, baisse-le s'il coupe tes notes douces. En dB, par défaut -60.
practice.amp.pedal.gate.release=Relâchement
practice.amp.pedal.gate.release.tip=Le temps que met le gate à se fermer quand tu arrêtes de jouer : plus long, il garde la fin de tes notes. En ms, par défaut 150.
practice.amp.pedal.compressor=Compresseur
practice.amp.pedal.compressor.tip=Égalise les notes fortes et douces et les fait durer plus longtemps. Clique pour l'allumer ou l'éteindre.
practice.amp.pedal.compressor.sustain=Sustain
practice.amp.pedal.compressor.sustain.tip=À quel point les notes fortes sont baissées et les douces remontées. Sur une échelle de 0–10, par défaut 5.
practice.amp.pedal.compressor.attack=Attaque
practice.amp.pedal.compressor.attack.tip=La vitesse à laquelle le compresseur réagit à une note : plus lent, il laisse passer l'attaque du médiator. En ms, par défaut 10.
practice.amp.pedal.compressor.level=Niveau
practice.amp.pedal.compressor.level.tip=Le niveau de sortie de la pédale ; 5 le laisse inchangé. Sur une échelle de 0–10, par défaut 5.
practice.amp.pedal.overdrive=Overdrive
practice.amp.pedal.overdrive.tip=Une saturation chaude et douce, comme un petit ampli poussé fort. Clique pour l'allumer ou l'éteindre.
practice.amp.pedal.overdrive.drive=Drive
practice.amp.pedal.overdrive.drive.tip=À quel point le son est poussé : plus de drive, plus de saturation. Sur une échelle de 0–10, par défaut 5.
practice.amp.pedal.overdrive.tone=Tonalité
practice.amp.pedal.overdrive.tone.tip=Plus sombre vers 0, plus brillant vers 10. Sur une échelle de 0–10, par défaut 5.
practice.amp.pedal.overdrive.level=Niveau
practice.amp.pedal.overdrive.level.tip=Le niveau de sortie de la pédale ; 5 le laisse inchangé. Sur une échelle de 0–10, par défaut 5.
practice.amp.pedal.distortion=Distorsion
practice.amp.pedal.distortion.tip=Un son dur et saturé pour les riffs et les solos. Clique pour l'allumer ou l'éteindre.
practice.amp.pedal.distortion.gain=Gain
practice.amp.pedal.distortion.gain.tip=À quel point le son est distordu. Sur une échelle de 0–10, par défaut 6.
practice.amp.pedal.distortion.tone=Tonalité
practice.amp.pedal.distortion.tone.tip=Plus sombre vers 0, plus brillant vers 10. Sur une échelle de 0–10, par défaut 5.
practice.amp.pedal.distortion.level=Niveau
practice.amp.pedal.distortion.level.tip=Le niveau de sortie de la pédale ; 5 le laisse inchangé. Sur une échelle de 0–10, par défaut 5.
practice.amp.pedal.chorus=Chorus
practice.amp.pedal.chorus.tip=Double ta guitare avec une copie qui bouge un peu, pour un son large et scintillant. Clique pour l'allumer ou l'éteindre.
practice.amp.pedal.chorus.rate=Vitesse
practice.amp.pedal.chorus.rate.tip=La vitesse à laquelle la copie bouge. En Hz, par défaut 0.8.
practice.amp.pedal.chorus.depth=Profondeur
practice.amp.pedal.chorus.depth.tip=L'ampleur du mouvement de la copie : plus de profondeur, plus de scintillement. Sur une échelle de 0–10, par défaut 5.
practice.amp.pedal.chorus.mix=Mélange
practice.amp.pedal.chorus.mix.tip=La part de la copie à côté de ta guitare ; 0 % donne ta guitare seule. En %, par défaut 50.
practice.amp.pedal.echo=Écho
practice.amp.pedal.echo.tip=Répète tes notes après un délai ; les répétitions continuent quand tu t'arrêtes. Clique pour l'allumer ou l'éteindre.
practice.amp.pedal.echo.time=Temps
practice.amp.pedal.echo.time.tip=Le temps entre une note et sa répétition, jusqu'à 1,5 s. En ms, par défaut 380.
practice.amp.pedal.echo.repeats=Répétitions
practice.amp.pedal.echo.repeats.tip=Le nombre de répétitions que tu entends avant qu'elles s'éteignent. Sur une échelle de 0–10, par défaut 3.
practice.amp.pedal.echo.tone=Tonalité
practice.amp.pedal.echo.tone.tip=Des répétitions plus sombres vers 0, plus brillantes vers 10. Sur une échelle de 0–10, par défaut 5.
practice.amp.pedal.echo.mix=Mélange
