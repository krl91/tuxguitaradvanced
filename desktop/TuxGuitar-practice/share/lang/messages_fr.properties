recognition.apply-note=Les modifications sont enregistrées avec OK ; Annuler conserve les valeurs précédentes. Les réglages de l'accordeur s'appliquent aussitôt, ceux de la pratique au prochain Démarrer ; les réglages de niveau et d'attaque relancent brièvement l'écoute. Survolez le nom d'un réglage pour voir son effet. Plus d'informations dans Aide › Reconnaissance audio.
recognition.restore-all=Rétablir tous les réglages de reconnaissance audio
recognition.restore-section=Rétablir les valeurs recommandées de cette catégorie
recognition.input.note=L'entrée est partagée par l'accordeur et la pratique. Elle change immédiatement et n'est pas mémorisée après la fermeture de TuxGuitar.
recognition.on=Activé
recognition.off=Désactivé
recognition.single-option=Seul choix disponible dans cette version
