# ---- Mode « suivre le tempo » (spec 002, T100) ----
practice.mode=Mode d'entraînement
practice.mode.wait=Attendre la bonne note
practice.mode.follow=Suivre le tempo
practice.mode.wait.hint=La partition vous attend : jouez chaque note quand vous êtes prêt.
practice.mode.follow.hint=La partition défile à son tempo, avec un décompte, et les autres pistes sonnent ; la piste travaillée est muette. Chaque note est jugée à l'heure, en avance, en retard ou manquée.
practice.start.follow=Suivre le tempo de cette piste
practice.follow.percent=Tempo (% du tempo écrit)
practice.follow.percent.hint=De {0} % à {1} %. Commencez plus lentement et montez par étapes.
practice.follow.tolerance=Fenêtre de temps
practice.follow.tolerance.value=±{0} ms autour de l'heure écrite, à 120 battements par minute.
practice.follow.tolerance.hint=Écart maximal avec l'heure d'une note pour qu'elle compte « à l'heure ». La fenêtre s'élargit et se resserre avec le tempo. Elle est enregistrée et se retrouve dans la fenêtre Configuration.
practice.follow.play-time=Temps pour jouer la note
