recognition.input.level.min.name=Niveau minimal utilisable
recognition.input.level.min.tip=Un son plus faible est signalé « trop faible » et n'est jamais accepté en pratique. Plus bas : fonctionne avec un signal plus faible, mais écoute aussi davantage le bruit de la pièce. Plus haut : la guitare doit jouer plus fort.
recognition.input.level.max.name=Alerte de niveau élevé
recognition.input.level.max.tip=Un son plus fort est signalé « trop fort » (risque de saturation). Plus bas : alerte plus tôt. Plus haut : alerte seulement près de la saturation.
recognition.input.noise-reduction.name=Réduire le bruit de fond
recognition.input.noise-reduction.tip=Supprime le ronflement et le bruit de fond entre les notes avant l'analyse des notes. Désactivé : l'entrée reste exactement telle quelle.
recognition.input.gain-suggestion.name=Suggérer un gain d'entrée
recognition.input.gain-suggestion.tip=Après le contrôle de niveau, propose un gain qui ramène le niveau dans la plage utilisable. Il n'est appliqué que si vous le confirmez.
recognition.tuner.in-tune.name=Écart considéré comme juste
recognition.tuner.in-tune.tip=À quelle distance de la cible une corde doit être pour afficher « juste » (accordeur et affichage de la pratique). Plus petit : accordage plus précis, plus difficile à atteindre. Plus grand : plus facile, moins précis.
recognition.tuner.hold.name=Garder la dernière note
recognition.tuner.hold.tip=Quand la corde s'éteint, l'accordeur continue d'afficher en gris la dernière note fiable au lieu de s'effacer.
recognition.note.accept.name=Écart de hauteur accepté
recognition.note.accept.tip=De combien (en cents) une note jouée peut s'écarter de la note écrite en restant correcte. Plus petit : plus exigeant sur la justesse et les petits tirés. Plus grand : plus tolérant, mais une note voisine n'est jamais acceptée. Jamais plus petit que l'écart considéré comme juste.
recognition.note.fret-sharp.name=Tolérance « trop haut » par case
recognition.note.fret-sharp.tip=Appuyer une corde sur une case la tend : les notes sur le manche sonnent un peu trop haut, davantage vers les aigus (nettement sur de vraies guitares). Ce réglage ajoute ce nombre de cents par case à l'écart accepté, uniquement du côté trop haut. 0 le désactive ; le côté trop bas et une note voisine ne sont jamais touchés.
recognition.note.confidence.name=Certitude minimale
recognition.note.confidence.tip=À quel point le détecteur doit être sûr avant de juger une note. Plus bas : réagit aux notes plus faibles ou bruitées, avec plus d'erreurs. Plus haut : moins d'erreurs, mais peut attendre sur les notes douces.
recognition.note.stability.name=Durée de confirmation d'une note
recognition.note.stability.tip=Combien de temps la bonne note doit sonner avant d'être acceptée, et une mauvaise note avant d'être marquée fausse. Plus court : réaction plus rapide, plus de risque dû aux parasites. Plus long : plus stable, plus lent dans les passages rapides.
recognition.note.attack.name=Sensibilité à l'attaque
recognition.note.attack.tip=Quelle hausse soudaine du son compte comme une nouvelle attaque (chaque note en demande une). Plus bas : détecte les attaques douces, mais les chocs et le bruit peuvent compter. Plus haut : ignore davantage le bruit, peut manquer les attaques douces.
recognition.note.legato.name=Liés, tirés-poussés, glissés
recognition.note.legato.tip=Aujourd'hui chaque note demande sa propre attaque : les notes liées peuvent devoir être rejouées au médiator ou passées. Accepter le legato sans attaque est une proposition encore à l'étude.
recognition.note.legato.option.strict=Nouvelle attaque pour chaque note
recognition.note.technique.name=Vérifier les techniques de jeu
recognition.note.technique.tip=Essaie d'entendre les techniques écrites dans la partition (hammer-on, pull-off, slide, bend, vibrato...) et dit ce qui a été entendu, sans jamais bloquer l'exercice. Désactivé : toute technique est indiquée comme non vérifiable.
recognition.tempo.window.name=Fenêtre de temps (Arcade)
recognition.tempo.window.tip=De combien une note peut s'écarter de son heure écrite et compter comme juste en Arcade, en millisecondes de chaque côté à 120 battements par minute (la fenêtre réelle s'élargit et se resserre avec le tempo). Une fenêtre plus large est plus souple. C'est la même valeur que le curseur de l'onglet Mode de la fenêtre de pratique en Arcade. Suivre le tempo utilise à la place le temps pour jouer la note.
recognition.follow.play-time.name=Temps pour jouer la note (Suivre le tempo)
recognition.follow.play-time.tip=En Suivre le tempo, combien de temps après son heure écrite une note peut être jouée et rester acceptée, en millisecondes. Une note peut aussi venir un peu en avance, moins quand les notes sont rapprochées. Un temps plus long est plus souple. C'est la même valeur que le curseur Temps pour jouer la note de l'onglet Mode de la fenêtre de pratique en Suivre le tempo.
recognition.chord.evidence.name=Exigence sur les accords
recognition.chord.evidence.tip=Part des harmoniques propres d'une corde qui doivent être entendues pour qu'elle compte dans l'accord. Plus bas : accepte les cordes plus faibles, peut accepter une corde absente. Plus haut : plus strict, peut refuser une corde réelle mais discrète. Règle « Chaque corde séparément » seulement.
recognition.chord.window.name=Fenêtre de grattage
recognition.chord.window.tip=Temps après le grattage pendant lequel toutes les cordes doivent être entendues. Plus court : demande un grattage rapide et régulier. Plus long : permet les grattages lents ou arpégés.
recognition.chord.completeness.name=Règle des accords
recognition.chord.completeness.tip=Comment un accord est jugé. Noms des notes sur le grattage : les notes de l'accord doivent être entendues ensemble pendant le grattage, quel que soit le doigté (recommandé). Chaque corde séparément : chaque corde vérifiable à part doit être entendue ; les cordes impossibles à distinguer sont indiquées comme non vérifiées. Choisir un niveau de vérification des accords dans la fenêtre de pratique règle cette valeur ; la changer ici fait passer le niveau à Personnalisé.
recognition.chord.completeness.option.all-verifiable=Chaque corde séparément
recognition.chord.completeness.option.profile=Noms des notes sur le grattage
recognition.chord.foreign.name=Cordes en trop
recognition.chord.foreign.tip=Les cordes jouées en plus de l'accord ne sont pas encore vérifiées. Les refuser demande d'abord des enregistrements réels d'accords (proposition à l'étude).
recognition.chord.foreign.option.ignore=Pas encore vérifiées
recognition.chord.profile.match.name=Correspondance de l'accord
recognition.chord.profile.match.tip=À quel point les noms des notes entendues pendant le grattage doivent correspondre à l'accord. Plus bas : accepte davantage, peut accepter un accord avec une note fausse. Plus haut : plus strict, peut refuser un bon accord. Règle « Noms des notes sur le grattage » seulement. Choisir un niveau de vérification des accords dans la fenêtre de pratique règle cette valeur ; la changer ici fait passer le niveau à Personnalisé.
recognition.chord.profile.names.name=Note la plus faible d'un accord
recognition.chord.profile.names.tip=Une note de l'accord entendue sous cette part de sa note la plus forte compte comme absente ; un accord auquel il manque deux notes est toujours refusé. Règle « Noms des notes sur le grattage » seulement.
recognition.chord.attack.name=Accepter un accord sur son attaque
recognition.chord.attack.tip=Un accord peut être accepté dès l'attaque du grattage. Avec la règle « Noms des notes sur le grattage », jamais quand deux notes de l'accord manquent. Choisir un niveau de vérification des accords dans la fenêtre de pratique règle cette valeur ; la changer ici fait passer le niveau à Personnalisé.
recognition.chord.detail.top.name=Note la plus haute comptée
recognition.chord.detail.top.tip=La hauteur la plus haute (numéro MIDI, 84 = do 6) dont le son compte dans les noms des notes d'un accord. Réglage technique.
recognition.chord.detail.settle.name=Durée avant de juger un accord
recognition.chord.detail.settle.tip=Combien de temps un grattage est écouté avant que l'accord puisse être accepté d'après les noms de ses notes. Réglage technique.
recognition.passage.measures.name=Répéter les passages
recognition.passage.measures.tip=Découpe le morceau en passages et en répète un quand trop de notes étaient fausses ou passées. Désactivé joue d'une traite. C'est la valeur utilisée au démarrage de TuxGuitar ; la fenêtre de pratique peut la changer pour la session en cours.
recognition.passage.measures.option.0=Désactivé (jouer d'une traite)
recognition.passage.measures.option.1=Chaque mesure
recognition.passage.measures.option.2=Toutes les 2 mesures
recognition.passage.measures.option.4=Toutes les 4 mesures
recognition.passage.threshold.name=Répéter si les erreurs dépassent
recognition.passage.threshold.tip=Part de notes et d'accords faux ou passés d'un passage au-delà de laquelle il est rejoué.
recognition.passage.threshold.option.25=25 %
recognition.passage.threshold.option.50=50 %
recognition.passage.threshold.option.75=75 %
recognition.passage.retries.name=Nombre maximal de répétitions
recognition.passage.retries.tip=Combien de fois au plus un passage est répété avant que la pratique continue. 0 ne répète jamais.
recognition.engine.pitch.name=Moteur de détection de hauteur
recognition.engine.pitch.tip=La méthode qui trouve la note jouée. Cette version a un seul moteur (FastYin, une note à la fois) ; les accords sont vérifiés à part, par rapport à l'accord écrit.
recognition.engine.pitch.option.automatic=Automatique ({0})
recognition.engine.pitch.option.native=Natif (Rust)
recognition.engine.pitch.option.fastyin=Java (FastYin)
recognition.engine.pitch.tip.v2=La méthode qui trouve les notes et les accords joués. Natif (Rust) : l'analyse se fait dans la bibliothèque native, avec moins de délai. Java (FastYin) : l'analyse des versions précédentes. Automatique utilise le moteur natif s'il peut démarrer, sinon Java. Un changement s'applique à partir de la prochaine séance.
recognition.engine.notice.library-missing=Le moteur de reconnaissance natif n'a pas pu être chargé : la pratique continue avec le moteur Java.
recognition.engine.notice.device-not-found=Le moteur de reconnaissance natif n'a pas trouvé l'entrée : la pratique continue avec le moteur Java.
recognition.engine.notice.format-unsupported=Le moteur de reconnaissance natif ne sait pas lire le format de cette entrée : la pratique continue avec le moteur Java.
recognition.engine.notice.stream-failed=Le moteur de reconnaissance natif n'a pas pu démarrer sur cette entrée : la pratique continue avec le moteur Java.
recognition.advanced.level.clip-sample.name=Niveau d'échantillon saturé
recognition.advanced.level.clip-sample.tip=Un échantillon égal ou supérieur à cette part de la pleine échelle compte comme saturé. Réglage technique.
recognition.advanced.level.clip-share.name=Part d'échantillons saturés
recognition.advanced.level.clip-share.tip=Part d'échantillons saturés dans une trame au-delà de laquelle l'entrée est signalée en saturation. Réglage technique.
recognition.advanced.tuner.confidence.name=Certitude minimale de l'accordeur
recognition.advanced.tuner.confidence.tip=À quel point le détecteur doit être sûr avant que l'accordeur affiche une note. Plus bas : affiche les notes plus faibles, avec plus de scintillement. Plus haut : plus stable, peut rester vide sur les notes douces.
recognition.advanced.attack.min-level.name=Seuil de détection d'attaque
recognition.advanced.attack.min-level.tip=Un son plus faible que ce niveau n'est jamais pris pour une nouvelle attaque. Plus bas : détecte les attaques très douces, plus de bruit. Plus haut : ignore le bruit faible.
recognition.advanced.chord.min-partials.name=Harmoniques par corde (accords)
recognition.advanced.chord.min-partials.tip=Combien d'harmoniques propres d'une corde doivent être entendues pour qu'elle compte dans un accord ; les cordes qui en ont moins ne peuvent pas être vérifiées séparément. Réglage technique. Règle « Chaque corde séparément » seulement.
recognition.advanced.chord.confirm.name=Durée de confirmation d'un accord
recognition.advanced.chord.confirm.tip=Combien de temps toutes les cordes de l'accord doivent être entendues ensemble avant qu'il soit accepté. Réglage technique.

# spec 026: the engines' own values, one category per family
recognition.onset.flux-factor.name=Attaque : facteur de flux
recognition.onset.flux-factor.tip=De combien le changement du spectre doit dépasser sa médiane récente pour une nouvelle attaque. Plus bas : plus d'attaques trouvées, plus de fausses ; plus haut : moins de fausses attaques, plus de notes rejouées manquées. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.onset.flux-offset.name=Attaque : marge de flux
recognition.onset.flux-offset.tip=Une marge fixe ajoutée à cette médiane avant qu'un changement compte comme attaque. Plus basse : plus sensible dans les passages calmes ; plus haute : moins d'attaques dues au bruit. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.onset.refractory.name=Attaque : repos après une attaque
recognition.onset.refractory.tip=Combien de temps après une attaque aucune autre n'est signalée. Plus court : les notes répétées rapides sont toutes entendues ; plus long : une note ne compte jamais deux fois. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.onset.pre-first.name=Attaque : niveau avant, depuis
recognition.onset.pre-first.tip=Où commence la mesure du niveau avant l'attaque, en remontant depuis l'attaque. Plus loin : une note précédente qui sonne encore masque plus de notes rejouées ; plus près : les notes rejouées sur une note qui s'éteint sont mieux trouvées. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.onset.pre-last.name=Attaque : niveau avant, jusqu’à
recognition.onset.pre-last.tip=Où s'arrête la mesure du niveau avant l'attaque, en remontant depuis l'attaque. Plus près de l'attaque : la montée est mesurée par rapport au niveau le plus récent, et un son qui enfle lentement donne moins d'attaques ; plus loin, une montée progressive est plus facilement prise pour une attaque. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.onset.post-first.name=Attaque : niveau après, depuis
recognition.onset.post-first.tip=Où commence la mesure du niveau après l'attaque. Plus tôt : le transitoire lui-même compte davantage ; plus tard : seul le niveau tenu compte. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.onset.post-last.name=Attaque : niveau après, jusqu’à
recognition.onset.post-last.tip=Où s'arrête la mesure du niveau après l'attaque ; l'attaque est signalée à ce moment. Plus tôt : attaques signalées plus vite, sur moins de son ; plus tard : plus sûr, mais signalé plus tard. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.onset-fast.flux-factor.name=Trait rapide : facteur de flux
recognition.onset-fast.flux-factor.tip=Pour les traits rapides : de combien le changement du spectre doit dépasser sa médiane récente pour une nouvelle attaque. Plus bas : plus d'attaques trouvées, plus de fausses. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.onset-fast.flux-offset.name=Trait rapide : marge de flux
recognition.onset-fast.flux-offset.tip=Pour les traits rapides : la marge fixe ajoutée à cette médiane avant qu'un changement compte comme attaque. Plus basse : plus sensible ; plus haute : moins d'attaques dues au bruit. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.onset-fast.refractory.name=Trait rapide : repos après une attaque
recognition.onset-fast.refractory.tip=Pour les traits rapides : combien de temps après une attaque aucune autre n'est signalée. Plus court : les notes plus rapprochées sont toutes entendues ; plus long : une note ne compte jamais deux fois. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.onset-fast.pre-first.name=Trait rapide : niveau avant, depuis
recognition.onset-fast.pre-first.tip=Pour les traits rapides : où commence la mesure du niveau avant l'attaque, en remontant depuis l'attaque. Plus près : une note précédente qui s'éteint masque moins de notes rejouées. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.onset-fast.pre-last.name=Trait rapide : niveau avant, jusqu’à
recognition.onset-fast.pre-last.tip=Pour les traits rapides : où s'arrête la mesure du niveau avant l'attaque, en remontant depuis l'attaque. Plus près de l'attaque : un son qui enfle lentement donne moins d'attaques ; plus loin, une montée progressive est plus facilement prise pour une attaque. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.onset-fast.post-first.name=Trait rapide : niveau après, depuis
recognition.onset-fast.post-first.tip=Pour les traits rapides : où commence la mesure du niveau après l'attaque. Plus tôt : le transitoire lui-même compte davantage. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.onset-fast.post-last.name=Trait rapide : niveau après, jusqu’à
recognition.onset-fast.post-last.tip=Pour les traits rapides : où s'arrête la mesure du niveau après l'attaque ; l'attaque est signalée à ce moment. Plus tôt : signalée plus vite, sur moins de son. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.pitch.yin-threshold.name=Hauteur : seuil YIN
recognition.pitch.yin-threshold.tip=À quel point la périodicité du son doit être nette pour que le moteur YIN donne une hauteur. Plus bas : seules les notes nettes ont une hauteur, moins d'erreurs d'octave ; plus haut : les notes bruitées ou faibles en ont une aussi, plus de fausses. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.pitch.target-search.name=Hauteur : recherche de la note attendue
recognition.pitch.target-search.tip=Jusqu'où, autour de la période d'une note attendue, la vérification de cette note cherche. Plus étroit : une note un peu fausse est moins souvent confirmée ; plus large : une note voisine est plus souvent prise pour elle. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.pitch.target-periods.name=Hauteur : périodes de la note attendue
recognition.pitch.target-periods.tip=Combien de périodes du son la vérification d'une note attendue compare. Moins : une réponse plus rapide sur moins de son ; plus : une réponse plus stable qui demande une note plus longue. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.pitch.max-sharp.name=Hauteur : côté aigu maximal
recognition.pitch.max-sharp.tip=De combien une note peut être trop aiguë au plus et être encore acceptée, quoi qu'ajoute la marge des frettes. Plus bas : les frettes hautes trop appuyées sont refusées plus tôt ; plus haut : jusqu'à juste sous le demi-ton suivant. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.pitch.attack-candidates-low.name=Hauteur : candidat d'attaque le plus grave
recognition.pitch.attack-candidates-low.tip=La hauteur voisine la plus grave que la vérification des attaques compare aux notes attendues. Plus bas : une fausse note grave peut aussi concourir ; plus haut : moins de calcul, moins de fausses notes graves vues. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.pitch.attack-candidates-high.name=Hauteur : candidat d'attaque le plus aigu
recognition.pitch.attack-candidates-high.tip=La hauteur voisine la plus aiguë que la vérification des attaques compare aux notes attendues. Plus haut : une fausse note aiguë peut aussi concourir ; plus bas : moins de calcul, moins de fausses notes aiguës vues. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.polyphonic.candidate-low.name=Spectre : candidat le plus grave
recognition.polyphonic.candidate-low.tip=La hauteur la plus grave que le spectre des accords cherche. Plus bas : les cordes les plus graves d'une guitare accordée plus bas sont trouvées ; plus haut : moins de fausses notes graves. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.polyphonic.candidate-high.name=Spectre : candidat le plus aigu
recognition.polyphonic.candidate-high.tip=La hauteur la plus aiguë que le spectre des accords cherche. Plus haut : les frettes les plus hautes sont trouvées ; plus bas : moins de fausses notes aiguës venues des harmoniques des notes graves. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.polyphonic.harmonics.name=Spectre : harmoniques par note
recognition.polyphonic.harmonics.tip=Combien d'harmoniques d'une note sont additionnées pour la peser. Moins : plus stable sur un son brillant ; plus : une note sourde aux harmoniques faibles est encore trouvée. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.polyphonic.max-harmonic.name=Spectre : harmonique la plus haute
recognition.polyphonic.max-harmonic.tip=La fréquence la plus haute où une harmonique est cherchée. Plus basse : les harmoniques des autres notes, en haut, comptent moins ; plus haute : plus d'harmoniques d'une note aiguë comptent. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.polyphonic.tolerance.name=Spectre : tolérance des harmoniques
recognition.polyphonic.tolerance.tip=À quelle distance de sa place exacte une harmonique est encore prise. Plus étroite : l'harmonique d'une autre note est moins souvent prise ; plus large : une corde un peu fausse est encore trouvée. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.polyphonic.candidates.name=Spectre : hauteurs par trame
recognition.polyphonic.candidates.tip=Combien de hauteurs le spectre des accords nomme au plus à la fois. Moins : seulement les plus fortes ; plus : chaque corde d'un accord complet peut être nommée. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.polyphonic.min-relative.name=Spectre : hauteur la plus faible gardée
recognition.polyphonic.min-relative.tip=À quel point une hauteur peut être faible, comparée à la plus forte, et être encore nommée. Plus bas : les cordes douces d'un accord sont nommées ; plus haut : moins de fausses hauteurs venues des harmoniques. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.polyphonic.floor.name=Spectre : niveau plancher
recognition.polyphonic.floor.tip=Le niveau sous lequel aucune hauteur n'est nommée. Plus bas : un jeu très doux est analysé ; plus haut : le silence et le ronflement ne nomment rien. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.polyphonic.subharmonic.name=Spectre : vérification de la note plus grave
recognition.polyphonic.subharmonic.tip=À quel point les harmoniques propres d'une note plus grave doivent être fortes pour qu'une hauteur soit prise pour cette note plus grave. Plus bas : l'octave en dessous est choisie plus souvent ; plus haut : la hauteur entendue est gardée. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.polyphonic.floor-width.name=Spectre : largeur du plancher
recognition.polyphonic.floor-width.tip=La largeur du voisinage dont la moyenne est retirée du spectre avant de chercher les harmoniques. Plus étroite : les harmoniques proches ressortent mieux ; plus large : un bruit large est mieux retiré. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.polyphonic.floor-factor.name=Spectre : facteur du plancher
recognition.polyphonic.floor-factor.tip=De combien le spectre doit dépasser cette moyenne pour compter comme une harmonique. Plus bas : les harmoniques faibles comptent ; plus haut : seules les harmoniques nettes comptent, le bruit moins. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.attack.lag.name=Frappe : durée de la croissance
recognition.attack.lag.tip=Sur combien de temps la croissance du spectre est mesurée pour dire quelles notes viennent d'être frappées. Plus court : des frappes rapprochées sont séparées ; plus long : une attaque lente est vue en entier. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.attack.max-frequency.name=Frappe : fréquence la plus haute
recognition.attack.max-frequency.tip=La fréquence la plus haute où la croissance est lue. Plus basse : moins de bruit du médiator ; plus haute : les harmoniques des notes aiguës comptent. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.attack.partials.name=Frappe : harmoniques par note
recognition.attack.partials.tip=Combien d'harmoniques compte le modèle de chaque note. Moins : les notes qui partagent des harmoniques se distinguent moins ; plus : une note est reconnue par tout son son. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.attack.beta.name=Frappe : poids des harmoniques hautes
recognition.attack.beta.tip=À quelle vitesse le poids des harmoniques hautes d'une note baisse dans son modèle. Plus bas : les harmoniques hautes pèsent autant que les premières ; plus haut : les premières harmoniques décident. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.attack.sigma.name=Frappe : largeur des harmoniques
recognition.attack.sigma.tip=La largeur de chaque harmonique du modèle d'une note. Plus étroite : les notes voisines se distinguent mieux ; plus large : une corde un peu fausse correspond encore. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.attack.evidence-partials.name=Justesse frappée : harmoniques mesurées
recognition.attack.evidence-partials.tip=Combien d'harmoniques d'une note frappée sont mesurées pour dire à quelle distance elle est de sa hauteur exacte. Moins : seulement les plus nettes ; plus : une médiane plus stable. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.attack.evidence-search.name=Justesse frappée : recherche
recognition.attack.evidence-search.tip=Jusqu'où, autour de la place exacte de chaque harmonique, son nouveau pic est cherché. Plus étroit : le pic d'une note voisine est moins souvent pris ; plus large : une note très fausse est encore mesurée. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.attack.evidence-peak.name=Justesse frappée : plus petit pic
recognition.attack.evidence-peak.tip=À quel point un nouveau pic peut être petit, comparé au plus fort, et être encore mesuré. Plus bas : les harmoniques faibles sont aussi mesurées ; plus haut : seulement les harmoniques fortes et sûres. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.chord-evidence.partial-presence.name=Accord : harmonique présente dès
recognition.chord-evidence.partial-presence.tip=À quel point une harmonique d'un accord attendu doit être forte, comparée à la plus forte, pour compter comme présente. Plus bas : les cordes douces comptent comme entendues ; plus haut : seules les cordes qui sonnent nettement comptent. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.chord-evidence.neighbour-margin.name=Accord : vérification au ton près
recognition.chord-evidence.neighbour-margin.tip=De combien le même accord, un ton plus loin, doit mieux expliquer le son pour que l'accord attendu ne soit pas entendu. Plus bas : un accord joué un ton à côté est refusé plus tôt ; plus haut : il n'est refusé que s'il est nettement à côté. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.chord-evidence.strum-window.name=Vérification du strum : fenêtre
recognition.chord-evidence.strum-window.tip=Pendant combien de temps le premier strum d'une vérification est mesuré pour son niveau et sa saturation. Plus court : seulement l'attaque ; plus long : tout le son du strum. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.chord-evidence.strum-quiet.name=Vérification du strum : calme avant
recognition.chord-evidence.strum-quiet.tip=Sur combien de temps avant un strum le niveau le plus calme est cherché, pour dire que le strum s'élève au-dessus. Plus court : un strum après un moment bruyant est encore trouvé ; plus long : un bruit qui monte lentement n'est pas pris pour un strum. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.chord-evidence.strum-rise.name=Vérification du strum : montée
recognition.chord-evidence.strum-rise.tip=De combien un strum doit monter au-dessus de ce niveau calme pour lancer la mesure. Plus bas : un strum doux la lance, le bruit aussi ; plus haut : seul un strum net la lance. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.chord-evidence.strum-clip-share.name=Vérification du strum : part saturée
recognition.chord-evidence.strum-clip-share.tip=Quelle part des échantillons mesurés doit atteindre le niveau de saturation pour que le strum soit dit saturé. Plus bas : la moindre saturation est signalée ; plus haut : seulement une forte saturation. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.front-end.high-pass.name=Coupure du filtre anti-grondement
recognition.front-end.high-pass.tip=Avec la réduction de bruit active, la fréquence sous laquelle le grondement et le ronflement sont coupés. Plus bas : les cordes graves gardent tout leur corps, le grondement passe davantage ; plus haut : plus de grondement est coupé, les cordes graves s'amincissent. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.front-end.noise-rise.name=Niveau du bruit : vitesse de montée
recognition.front-end.noise-rise.tip=À quelle vitesse le bruit de fond estimé peut monter vers un son plus fort. Plus lent : une longue note tenue n'est pas prise pour du bruit ; plus rapide : un bruit qui grandit est suivi plus tôt. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.front-end.noise-fall.name=Niveau du bruit : vitesse de descente
recognition.front-end.noise-fall.tip=À quelle vitesse le bruit de fond estimé descend vers un moment plus calme. Plus bas : l'estimation descend doucement ; plus haut : elle descend tout de suite au moment le plus calme. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.front-end.noise-trusted.name=Niveau du bruit : fiable après
recognition.front-end.noise-trusted.tip=Sans vérification du niveau, combien de temps le bruit doit être écouté avant que le gate puisse baisser le son. Plus court : le gate agit plus tôt, sur une estimation moins sûre ; plus long : il attend une estimation plus sûre. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.noise-gate.open.name=Gate : s'ouvre au-dessus du bruit de
recognition.noise-gate.open.tip=De combien un son doit dépasser le bruit de fond pour que le gate s'ouvre. Plus bas : les notes douces l'ouvrent, un bruit fort aussi ; plus haut : seules les notes nettes l'ouvrent. Toujours au-dessus de la marge de fermeture. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.noise-gate.close.name=Gate : se ferme sous le bruit plus
recognition.noise-gate.close.tip=À quel point une note qui s'éteint doit se rapprocher du bruit de fond pour que le gate commence à se fermer. Plus bas : une note qui s'éteint est gardée plus longtemps ; plus haut : le gate se ferme plus tôt sur une note qui s'éteint. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.noise-gate.reduction.name=Gate : réduction
recognition.noise-gate.reduction.tip=De combien le gate baisse le son quand il est fermé. Plus bas : le bruit reste audible ; plus haut : les silences sont plus calmes. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.noise-gate.hold.name=Gate : maintien
recognition.noise-gate.hold.tip=Combien de temps une note qui s'éteint doit rester près du bruit avant que le gate se ferme. Plus court : le gate se ferme vite ; plus long : les courts silences entre les notes restent ouverts. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.noise-gate.subtraction.name=Soustraction du bruit : force
recognition.noise-gate.subtraction.tip=Avec la soustraction du bruit active, quelle part du bruit appris est retirée du son. Plus bas : un peu de bruit reste ; plus haut : plus de bruit est retiré, les notes peuvent sonner plus minces. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.noise-gate.subtraction-floor.name=Soustraction du bruit : plancher
recognition.noise-gate.subtraction-floor.tip=La part du son toujours gardée, quoi que la soustraction retire. Plus bas : silences plus profonds, plus d'artefacts ; plus haut : moins d'artefacts, plus de bruit restant. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.noise-gate.subtraction-learn.name=Soustraction du bruit : vitesse d'apprentissage
recognition.noise-gate.subtraction-learn.tip=À quelle vitesse le bruit appris suit un fond qui change, pendant que le gate est fermé. Plus bas : une image du bruit plus stable ; plus haut : un bruit qui change est suivi plus tôt. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.gain.target.name=Suggestion de gain : niveau de jeu visé
recognition.gain.target.tip=Le niveau de jeu que vise la suggestion de gain de la vérification du niveau. Plus bas : un niveau plus doux est proposé, plus de marge avant la saturation ; plus haut : un niveau plus fort, plus près de la saturation. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.gain.max-peak.name=Suggestion de gain : crête la plus haute
recognition.gain.max-peak.tip=La crête la plus forte que le gain proposé peut donner. Plus bas : plus de marge avant la saturation ; plus haut : un signal plus fort, plus près de la saturation. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.gain.no-change.name=Suggestion de gain : rien à changer en deçà de
recognition.gain.no-change.tip=À quel point le gain proposé peut être proche du gain actuel et compter encore comme rien à changer. Plus bas : de petites corrections sont proposées ; plus haut : seulement les grandes. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.gain.min-snr.name=Suggestion de gain : jeu au-dessus du bruit de
recognition.gain.min-snr.tip=De combien le jeu doit dépasser le bruit de fond pour qu'une hausse soit proposée sans l'avertissement de bruit. Plus bas : l'avertissement vient moins souvent ; plus haut : il vient plus tôt. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.acceptance.min-share.name=Notes frappées : part expliquée
recognition.acceptance.min-share.tip=Quelle part de ce que l'attaque a ajouté au son les notes attendues doivent expliquer. Plus bas : plus tolérant, une note mêlée à d'autres sons est acceptée ; plus haut : plus strict, seulement une note propre. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.acceptance.min-balance.name=Notes frappées : équilibre de l'accord
recognition.acceptance.min-balance.tip=À quel point la note la plus faible d'un accord doit être forte, comparée à la plus forte. Plus bas : plus tolérant, une corde douce compte encore ; plus haut : plus strict, chaque corde doit sonner nettement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.acceptance.min-peak.name=Notes frappées : hauteur la plus forte
recognition.acceptance.min-peak.tip=À quel point la note attendue la plus forte doit être forte, comparée à la hauteur la plus forte entendue. Plus bas : plus tolérant, une autre hauteur forte est permise ; plus haut : plus strict, la note attendue doit dominer. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.acceptance.hops.name=Notes frappées : confirmées pendant
recognition.acceptance.hops.tip=Combien de temps les notes attendues doivent être entendues d'affilée avant d'être acceptées. Plus court : plus rapide, plus d'erreurs ; plus long : plus sûr, plus lent. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.acceptance.neighbour.name=Notes frappées : au-dessus des voisines
recognition.acceptance.neighbour.tip=Combien de fois chaque note attendue doit être plus forte que ses voisines au demi-ton et au ton ; zéro coupe la vérification. Plus bas : plus tolérant ; plus haut : une note à côté de l'attendue est refusée plus tôt. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.acceptance.attack-strength.name=Notes frappées : force de l'attaque
recognition.acceptance.attack-strength.tip=À quel point l'attaque doit être soudaine pour que les notes comptent ; zéro accepte toute attaque. Plus bas : plus tolérant, les attaques douces comptent ; plus haut : seules les attaques nettes comptent. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.acceptance.rearm.name=Notes frappées : ignoré après une note
recognition.acceptance.rearm.tip=Combien de temps le son est ignoré après qu'une note est acceptée, pour qu'une note qui sonne ne soit jamais prise pour la suivante. Plus court : les passages rapides sont suivis ; plus long : moins de doubles comptes. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.acceptance.offset-margin.name=Notes frappées : marge de justesse
recognition.acceptance.offset-margin.tip=De combien la hauteur mesurée d'une note frappée peut dépasser la justesse acceptée, car cette mesure est approximative. Plus bas : plus strict sur la justesse ; plus haut : plus tolérant. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.acceptance.decay.name=Notes frappées : indulgence
recognition.acceptance.decay.tip=De combien la confirmation recule quand un instant ne correspond pas ; zéro la recommence. Plus bas : plus strict ; plus haut : un court raté coûte moins. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.acceptance.guard.name=Notes frappées : choc ignoré
recognition.acceptance.guard.tip=Après une note frappée depuis le silence, combien de temps le premier choc est ignoré avant de lire la hauteur. Plus court : plus rapide ; plus long : le choc n'est jamais pris pour une hauteur. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.acceptance.min-total.name=Notes frappées : note la plus douce
recognition.acceptance.min-total.tip=À quel point le nouveau son doit être fort pour être une note plutôt que le bruit de la pièce. Plus bas : les notes douces comptent, le bruit aussi ; plus haut : seules les notes nettes comptent. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.acceptance.floor-hops.name=Notes frappées : niveau calme sur
recognition.acceptance.floor-hops.tip=Sur combien de temps le niveau calme avant une attaque est cherché. Plus court : suit un fond qui change ; plus long : le moment le plus calme est trouvé. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.acceptance.silence.name=Notes frappées : depuis le silence
recognition.acceptance.silence.tip=À quel point une attaque doit être soudaine pour compter comme une note frappée depuis le silence, dont le choc est alors ignoré. Plus bas : plus d'attaques attendent que le choc passe ; plus haut : moins. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.acceptance.min-onset.name=Notes frappées : plus petit début
recognition.acceptance.min-onset.tip=Le plus petit son nouveau qui peut lancer une attaque. Plus bas : les attaques douces sont trouvées, le bruit aussi ; plus haut : seulement les attaques nettes. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.acceptance.onset-floor.name=Notes frappées : début au-dessus du calme
recognition.acceptance.onset-floor.tip=Combien de fois un son doit être plus fort que le niveau calme qui le précède pour lancer une attaque. Plus bas : les attaques douces sont trouvées, le bruit aussi ; plus haut : seulement les attaques nettes. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.acceptance.release.name=Notes frappées : fin de l'attaque
recognition.acceptance.release.tip=De combien le son doit retomber, comparé au sommet de l'attaque, pour que l'attaque se termine. Plus bas : l'attaque dure plus longtemps ; plus haut : elle finit plus tôt, une note frappée depuis le silence a moins de temps pour être confirmée. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.wait.verdict-hold.name=Attente : verdict affiché pendant
recognition.wait.verdict-hold.tip=Combien de temps la coche ou la croix reste affichée. Plus court : l'affichage s'efface plus tôt ; plus long : le verdict reste visible. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.wait.neighbour-veto.name=Attente : retenue par une voisine
recognition.wait.neighbour-veto.tip=Combien de temps une note voisine lue par l'estimation de hauteur retient l'acceptation d'une note frappée. Plus court : plus rapide, une voisine est plus souvent prise pour la note ; plus long : plus sûr, plus lent. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.wait.neighbour-confidence.name=Attente : confiance de la voisine
recognition.wait.neighbour-confidence.tip=À quel point l'estimation de hauteur doit être sûre d'une note voisine pour qu'elle retienne l'acceptation. Plus bas : une voisine retient plus souvent ; plus haut : seule une voisine nette retient. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.wait.technique-window.name=Attente : technique observée pendant
recognition.wait.technique-window.tip=Combien de temps la technique écrite d'une note est observée après que la note est acceptée. Plus court : le résultat arrive plus tôt, sur moins de la note ; plus long : sur plus de la note, plus tard. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.wait.bend-window-min.name=Attente : bend observé au moins
recognition.wait.bend-window-min.tip=La durée la plus courte d'observation d'un bend, quelle que soit sa longueur écrite. Plus court : le résultat d'un bend court arrive plus tôt ; plus long : le bend d'un élève lent est encore vu en entier. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.wait.bend-window-max.name=Attente : bend observé au plus
recognition.wait.bend-window-max.tip=La durée la plus longue d'observation d'un bend, quelle que soit sa longueur écrite. Plus court : le résultat d'un bend long arrive plus tôt ; plus long : un bend long est vu jusqu'au bout. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.wait.bend-margin.name=Attente : marge du bend
recognition.wait.bend-margin.tip=À quelle distance du chemin écrit d'un bend la hauteur peut être en comptant encore comme dessus. Plus bas : plus strict, un bend qui dépasse sa cible est refusé ; plus haut : plus tolérant, une fausse note près du chemin n'est pas signalée. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.wait.technique-lead.name=Attente : technique depuis avant
recognition.wait.technique-lead.tip=Combien de temps avant l'acceptation l'observation de la technique d'une note peut commencer, jusqu'à son attaque. Plus court : le début de la note est laissé de côté ; plus long : on en voit plus le début. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.wait.speed-window.name=Attente : trop rapide en deçà de
recognition.wait.speed-window.tip=À quel point une nouvelle attaque tôt après une note acceptée signifie que l'élève joue plus vite que la reconnaissance ne suit. Plus court : la limite de vitesse est affichée moins souvent ; plus long : plus souvent. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.wait.speed-lead.name=Attente : trop rapide depuis avant
recognition.wait.speed-lead.tip=Combien de temps avant une note acceptée une attaque compte encore pour la limite de vitesse. Plus court : moins d'attaques comptent ; plus long : davantage. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.wait.early-margin.name=Attente : marge d'acceptation précoce
recognition.wait.early-margin.tip=Quand l'acceptation précoce est activée, de combien l'indice de la note attendue doit devancer ses voisines pour que la note soit acceptée plus tôt. Plus bas : plus souvent précoce, plus d'erreurs ; plus haut : rarement précoce. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.wait.early-hops.name=Attente : acceptation précoce après
recognition.wait.early-hops.tip=Quand l'acceptation précoce est activée, combien de temps la note attendue doit être entendue avant d'être acceptée plus tôt ; jamais plus que l'attente habituelle. Plus court : plus rapide ; plus long : plus sûr. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.wait.weak-fast.name=Attente : trop faible pour la vitesse
recognition.wait.weak-fast.tip=Le niveau des notes en dessous duquel l'élève est prévenu que l'entrée est trop faible pour une reconnaissance rapide. Plus bas : le message apparaît moins souvent ; plus haut : plus souvent. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.evidence-horizon.name=Suivi : hauteur attendue pendant
recognition.follow.evidence-horizon.tip=Combien de temps après une attaque sa hauteur est attendue avant que l'attaque soit prise pour un clic ou du bruit. Plus court : le bruit est écarté plus tôt ; plus long : une note dont la hauteur tarde à se stabiliser compte encore. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.silence.name=Suivi : fin d'un son
recognition.follow.silence.tip=Combien de temps sans aucune hauteur termine le son d'une attaque. Plus court : une note courte est décidée plus tôt ; plus long : une brève chute ne termine pas la note. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.short-note.name=Suivi : note la plus courte
recognition.follow.short-note.tip=Combien de temps une note qui finit tôt doit avoir tenu sa hauteur pour compter, comme une petite note. Plus court : plus tolérant ; plus long : une note très courte n'est pas comptée. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.same-sound.name=Suivi : même son en deçà de
recognition.follow.same-sound.tip=À quelle distance du son sur lequel une note a été reconnue une autre attaque est prise pour ce même son plutôt que pour une note en trop. Plus court : plus de notes en trop ; plus long : moins. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.ringing.name=Suivi : la corde sonne pendant
recognition.follow.ringing.tip=Combien de temps une corde pincée est censée sonner sous les notes suivantes ; une note répétée dans ce délai prend son instant de l'attaque signalée. Plus court : moins de notes traitées comme résonnantes ; plus long : davantage. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.scan-back.name=Suivi : notes revues en arrière
recognition.follow.scan-back.tip=Combien de notes déjà reconnues sont encore examinées, car une deuxième attaque peut tomber dans leur fenêtre. Plus bas : une deuxième attaque est plus souvent une note en trop ; plus haut : on en examine davantage. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.onset-memory.name=Suivi : attaques gardées pendant
recognition.follow.onset-memory.tip=Combien de temps les attaques signalées par le détecteur sont gardées, pour donner leur instant aux notes répétées. Plus court : une attaque peut être oubliée avant que sa note soit reconnue ; plus long : gardées plus longtemps. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.refine-before.name=Suivi : attaque avant l'indice
recognition.follow.refine-before.tip=Combien de temps avant l'instant donné par l'indice d'attaque une attaque signalée peut se trouver pour être la même attaque. Plus court : moins de notes répétées prennent l'instant signalé ; plus long : davantage. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.refine-after.name=Suivi : attaque après l'indice
recognition.follow.refine-after.tip=Combien de temps après l'instant donné par l'indice d'attaque une attaque signalée peut se trouver pour être la même attaque, et combien de temps la séance l'attend. Plus court : plus rapide ; plus long : l'instant signalé est plus souvent utilisé. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.after-close.name=Suivi : ouverte après sa fenêtre
recognition.follow.after-close.tip=Combien de temps une note répétée dont la fenêtre s'est fermée reste ouverte à l'indice de son attaque. Plus court : une confirmation tardive est perdue ; plus long : reste ouverte plus longtemps. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.tail.name=Suivi : fin du passage
recognition.follow.tail.tip=Combien de temps le passage continue après la dernière fenêtre avant d'être terminé. Plus court : le bilan arrive plus tôt ; plus long : une dernière note tardive est encore entendue. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.history.name=Suivi : son gardé pendant
recognition.follow.history.tip=Combien de temps le son récent est gardé, d'où sont lues l'attaque et les techniques d'une note. Plus court : le début d'une note peut être perdu ; plus long : on en garde davantage. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.technique-window.name=Suivi : technique observée pendant
recognition.follow.technique-window.tip=Combien de temps la technique écrite d'une note est observée depuis son attaque. Plus court : le résultat arrive plus tôt, sur moins de la note ; plus long : sur plus de la note, plus tard. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.bend-window-min.name=Suivi : bend observé au moins
recognition.follow.bend-window-min.tip=La durée la plus courte d'observation d'un bend, quelle que soit sa longueur écrite. Plus court : le résultat d'un bend court arrive plus tôt ; plus long : un bend lent est encore vu en entier. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.bend-window-max.name=Suivi : bend observé au plus
recognition.follow.bend-window-max.tip=La durée la plus longue d'observation d'un bend, quelle que soit sa longueur écrite. Plus court : le résultat d'un bend long arrive plus tôt ; plus long : un bend long est vu jusqu'au bout. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.bend-margin.name=Suivi : marge du bend
recognition.follow.bend-margin.tip=À quelle distance du chemin écrit d'un bend la hauteur peut être en comptant encore comme dessus. Plus bas : plus strict, un bend qui dépasse sa cible interrompt la note ; plus haut : plus tolérant. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow.evidence-lead.name=Suivi : indice surveillé dès
recognition.follow.evidence-lead.tip=Combien de temps avant sa fenêtre une note commence à surveiller l'indice d'attaque ; le niveau calme avant l'attaque est nécessaire pour la voir monter. Plus court : une attaque en avance peut être manquée ; plus long : on surveille davantage. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.clock.fit-window.name=Horloge : position mesurée sur
recognition.clock.fit-window.tip=Sur quelle durée de lecture récente l'horloge mesure sa position et sa vitesse. Plus court : suit plus vite un changement de tempo, moins stable ; plus long : plus stable, plus lent à suivre. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.clock.min-points.name=Horloge : relevés nécessaires
recognition.clock.min-points.tip=Combien de relevés du lecteur l'horloge attend avant de mesurer sa vitesse ; avant, elle utilise le tempo écrit. Plus bas : mesurée plus tôt ; plus haut : plus stable. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.clock.min-span.name=Horloge : relevés étalés sur
recognition.clock.min-span.tip=Quelle durée de lecture les relevés doivent couvrir avant que l'horloge mesure sa vitesse. Plus court : mesurée plus tôt ; plus long : plus stable. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.clock.stall.name=Horloge : lecteur arrêté après
recognition.clock.stall.tip=Combien de temps la position du lecteur peut rester la même avant que l'horloge le considère arrêté. Plus court : une pause est vue plus tôt ; plus long : un relevé lent n'est pas pris pour une pause. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.clock.extrapolation.name=Horloge : avance sur le dernier relevé
recognition.clock.extrapolation.tip=Jusqu'où l'horloge peut compter seule après son dernier relevé. Plus court : ne devance jamais le lecteur ; plus long : plus régulière entre les relevés. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.clock.seek-margin.name=Horloge : saut pris pour un déplacement
recognition.clock.seek-margin.tip=De combien la position du lecteur doit sauter pour que l'horloge reparte de zéro, comme après un déplacement ou une boucle. Plus bas : un saut plus petit la relance ; plus haut : seul un grand saut le fait. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.clock.latency-limit.name=Horloge : latence la plus grande
recognition.clock.latency-limit.tip=Le plus grand décalage de latence accepté, saisi à la main ou mesuré par un étalonnage. Plus bas : une mesure fausse est refusée plus tôt ; plus haut : une carte son lente peut encore être compensée. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.timing.reference-beat.name=Timing : largeur lue au temps
recognition.timing.reference-beat.tip=Le temps auquel la largeur de la fenêtre « à l'heure » est lue ; aux autres tempos la fenêtre grandit ou rétrécit avec le temps. Plus court : la même largeur est plus large à tous les tempos ; plus long : plus étroite. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.timing.advance.name=Timing : jouer avant le rouge
recognition.timing.advance.tip=Combien de temps avant qu'une note devienne rouge elle peut déjà être jouée en mode suivi (elle est alors en avance). Plus court : plus strict ; plus long : une note en avance compte encore. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.timing.gap.name=Timing : écart avant la note suivante
recognition.timing.gap.tip=Ce qui reste entre la fin du temps pour jouer une note et le passage au rouge de la suivante, pour que deux fenêtres ne se touchent jamais. Plus court : fenêtres plus longues dans les passages rapides ; plus long : frontière plus nette. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.timing.clock-spread.name=Timing : route instable dès
recognition.timing.clock-spread.tip=De combien le délai de l'entrée son peut varier avant que la route soit dite instable, ce qui affiche un avertissement et une précision rythmique réduite, jamais un blocage. Plus bas : avertit plus tôt ; plus haut : n'avertit que pour une route très irrégulière. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow-leniency.permissive.accept.name=Suivi permissif : note acceptée à moins de
recognition.follow-leniency.permissive.accept.tip=À quelle distance de la hauteur écrite une note est encore acceptée à cette position ; le réglage de l'élève est gardé s'il est plus tolérant. Plus bas : aucun assouplissement ; plus haut : plus tolérant, une fausse note peut passer. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow-leniency.permissive.confidence.name=Suivi permissif : confiance de hauteur
recognition.follow-leniency.permissive.confidence.tip=À quel point la hauteur doit être sûre à cette position ; le réglage de l'élève est gardé s'il est plus tolérant. Plus bas : plus tolérant ; plus haut : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow-leniency.permissive.stability.name=Suivi permissif : note tenue pendant
recognition.follow-leniency.permissive.stability.tip=Combien de temps une note doit tenir sa hauteur à cette position ; le réglage de l'élève est gardé s'il est plus court. Plus court : plus rapide, plus tolérant ; plus long : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow-leniency.permissive.chord-evidence.name=Suivi permissif : indice d'accord
recognition.follow-leniency.permissive.chord-evidence.tip=Quelle part d'un accord doit être entendue à cette position ; le réglage de l'élève est gardé s'il est plus tolérant. Plus bas : plus tolérant ; plus haut : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow-leniency.permissive.chord-partials.name=Suivi permissif : partiels d'accord nécessaires
recognition.follow-leniency.permissive.chord-partials.tip=Combien de partiels d'une note d'accord doivent être entendus à cette position ; le réglage de l'élève est gardé s'il est plus bas. Plus bas : plus tolérant ; plus haut : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow-leniency.permissive.chord-confirm.name=Suivi permissif : accord confirmé après
recognition.follow-leniency.permissive.chord-confirm.tip=Combien de temps un accord doit être entendu avant d'être confirmé à cette position ; le réglage de l'élève est gardé s'il est plus court. Plus court : plus rapide ; plus long : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow-leniency.very-permissive.accept.name=Suivi très permissif : note acceptée à moins de
recognition.follow-leniency.very-permissive.accept.tip=À quelle distance de la hauteur écrite une note est encore acceptée à cette position ; le réglage de l'élève est gardé s'il est plus tolérant. Plus bas : aucun assouplissement ; plus haut : plus tolérant, une fausse note peut passer. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow-leniency.very-permissive.confidence.name=Suivi très permissif : confiance de hauteur
recognition.follow-leniency.very-permissive.confidence.tip=À quel point la hauteur doit être sûre à cette position ; le réglage de l'élève est gardé s'il est plus tolérant. Plus bas : plus tolérant ; plus haut : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow-leniency.very-permissive.stability.name=Suivi très permissif : note tenue pendant
recognition.follow-leniency.very-permissive.stability.tip=Combien de temps une note doit tenir sa hauteur à cette position ; le réglage de l'élève est gardé s'il est plus court. Plus court : plus rapide, plus tolérant ; plus long : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow-leniency.very-permissive.chord-evidence.name=Suivi très permissif : indice d'accord
recognition.follow-leniency.very-permissive.chord-evidence.tip=Quelle part d'un accord doit être entendue à cette position ; le réglage de l'élève est gardé s'il est plus tolérant. Plus bas : plus tolérant ; plus haut : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow-leniency.very-permissive.chord-partials.name=Suivi très permissif : partiels d'accord nécessaires
recognition.follow-leniency.very-permissive.chord-partials.tip=Combien de partiels d'une note d'accord doivent être entendus à cette position ; le réglage de l'élève est gardé s'il est plus bas. Plus bas : plus tolérant ; plus haut : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.follow-leniency.very-permissive.chord-confirm.name=Suivi très permissif : accord confirmé après
recognition.follow-leniency.very-permissive.chord-confirm.tip=Combien de temps un accord doit être entendu avant d'être confirmé à cette position ; le réglage de l'élève est gardé s'il est plus court. Plus court : plus rapide ; plus long : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.arcade-leniency.fun.confidence.name=Arcade fun : confiance de hauteur
recognition.arcade-leniency.fun.confidence.tip=À quel point la hauteur doit être sûre à cette position ; le réglage de l'élève est gardé s'il est plus tolérant. Plus bas : plus tolérant ; plus haut : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.arcade-leniency.fun.stability.name=Arcade fun : note tenue pendant
recognition.arcade-leniency.fun.stability.tip=Combien de temps une note doit tenir sa hauteur à cette position ; le réglage de l'élève est gardé s'il est plus court. Plus court : plus rapide, plus tolérant ; plus long : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.arcade-leniency.fun.chord-evidence.name=Arcade fun : indice d'accord
recognition.arcade-leniency.fun.chord-evidence.tip=Quelle part d'un accord doit être entendue à cette position ; le réglage de l'élève est gardé s'il est plus tolérant. Plus bas : plus tolérant ; plus haut : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.arcade-leniency.fun.chord-partials.name=Arcade fun : partiels d'accord nécessaires
recognition.arcade-leniency.fun.chord-partials.tip=Combien de partiels d'une note d'accord doivent être entendus à cette position ; le réglage de l'élève est gardé s'il est plus bas. Plus bas : plus tolérant ; plus haut : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.arcade-leniency.fun.chord-confirm.name=Arcade fun : accord confirmé après
recognition.arcade-leniency.fun.chord-confirm.tip=Combien de temps un accord doit être entendu avant d'être confirmé à cette position ; le réglage de l'élève est gardé s'il est plus court. Plus court : plus rapide ; plus long : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.arcade-leniency.fun.tempo-window.name=Arcade fun : fenêtre de timing élargie
recognition.arcade-leniency.fun.tempo-window.tip=De combien la fenêtre « à l'heure » de l'élève est élargie à cette position, jamais au-delà de son maximum. Plus bas : pas élargie ; plus haut : plus large. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.arcade-leniency.very-permissive.confidence.name=Arcade très permissif : confiance de hauteur
recognition.arcade-leniency.very-permissive.confidence.tip=À quel point la hauteur doit être sûre à cette position ; le réglage de l'élève est gardé s'il est plus tolérant. Plus bas : plus tolérant ; plus haut : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.arcade-leniency.very-permissive.stability.name=Arcade très permissif : note tenue pendant
recognition.arcade-leniency.very-permissive.stability.tip=Combien de temps une note doit tenir sa hauteur à cette position ; le réglage de l'élève est gardé s'il est plus court. Plus court : plus rapide, plus tolérant ; plus long : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.arcade-leniency.very-permissive.chord-evidence.name=Arcade très permissif : indice d'accord
recognition.arcade-leniency.very-permissive.chord-evidence.tip=Quelle part d'un accord doit être entendue à cette position ; le réglage de l'élève est gardé s'il est plus tolérant. Plus bas : plus tolérant ; plus haut : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.arcade-leniency.very-permissive.chord-partials.name=Arcade très permissif : partiels d'accord nécessaires
recognition.arcade-leniency.very-permissive.chord-partials.tip=Combien de partiels d'une note d'accord doivent être entendus à cette position ; le réglage de l'élève est gardé s'il est plus bas. Plus bas : plus tolérant ; plus haut : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.arcade-leniency.very-permissive.chord-confirm.name=Arcade très permissif : accord confirmé après
recognition.arcade-leniency.very-permissive.chord-confirm.tip=Combien de temps un accord doit être entendu avant d'être confirmé à cette position ; le réglage de l'élève est gardé s'il est plus court. Plus court : plus rapide ; plus long : aucun assouplissement. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.arcade-leniency.very-permissive.tempo-window.name=Arcade très permissif : fenêtre de timing élargie
recognition.arcade-leniency.very-permissive.tempo-window.tip=De combien la fenêtre « à l'heure » de l'élève est élargie à cette position, jamais au-delà de son maximum. Plus bas : pas élargie ; plus haut : plus large. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.bend.min-range.name=Bend : détecté dès
recognition.technique.bend.min-range.tip=De combien la hauteur d'une note doit bouger pour être appelée un bend. Plus bas : bends plus petits détectés ; plus haut : seulement les grands bends. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.bend.plain-range.name=Bend : note simple sous
recognition.technique.bend.plain-range.tip=Sous ce mouvement une note est dite simple, sans bend ; entre les deux valeurs le résultat est incertain. Plus bas : moins de notes dites simples ; plus haut : plus de notes dites simples. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.bend.min-duration.name=Bend : note la plus courte
recognition.technique.bend.min-duration.tip=Une note plus courte est trop courte pour juger un bend : incertain. Plus court : notes plus courtes jugées ; plus long : seulement les notes longues. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.bend.voiced.name=Bend : hauteur entendue sur
recognition.technique.bend.voiced.tip=Quelle part de la note doit avoir une hauteur nette pour juger un bend. Plus bas : jugé sur moins ; plus haut : jugé seulement sur des notes nettes. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.bend.written-move.name=Bend : plus petit mouvement écrit
recognition.technique.bend.written-move.tip=Un bend écrit plus petit que cela n'est pas jugé. Plus bas : bends minuscules jugés ; plus haut : petits bends non jugés. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.bend.on-tolerance.name=Bend : sur la cible à moins de
recognition.technique.bend.on-tolerance.tip=À quelle distance de la cible écrite la hauteur atteinte doit être pour compter comme sur la cible (ou une part du mouvement écrit, la plus grande des deux). Plus bas : plus strict ; plus haut : plus tolérant. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.bend.on-share.name=Bend : sur la cible à une part près
recognition.technique.bend.on-share.tip=La même tolérance en part du mouvement écrit, pour les grands bends. Plus bas : plus strict sur les grands bends ; plus haut : plus tolérant sur les grands bends. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.bend.moved-share.name=Bend : sous la cible, incertain dès
recognition.technique.bend.moved-share.tip=Un bend sous sa cible est incertain si la hauteur a bougé d'au moins cette part du mouvement écrit, manqué sinon. Plus bas : plus souvent incertain ; plus haut : plus souvent manqué. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.bend.start-tolerance.name=Bend : départ du pré-bend à moins de
recognition.technique.bend.start-tolerance.tip=À quelle distance de la hauteur tirée un pré-bend doit commencer. Plus bas : plus strict ; plus haut : plus tolérant. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.bend.edge.name=Bend : début et fin lus sur
recognition.technique.bend.edge.tip=Combien de pas d'analyse donnent la hauteur au début et à la fin d'un bend. Plus bas : plus sensible aux premiers et derniers instants ; plus haut : plus stable, moins précis. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.slide.min-range.name=Glissé : détecté dès
recognition.technique.slide.min-range.tip=De combien la hauteur doit glisser pour être appelée un glissé. Plus bas : glissés plus courts détectés ; plus haut : seulement les longs glissés. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.slide.plain-range.name=Glissé : note simple sous
recognition.technique.slide.plain-range.tip=Sous ce mouvement une note est dite simple, sans glissé ; entre les deux valeurs le résultat est incertain. Plus bas : moins de notes dites simples ; plus haut : plus de notes dites simples. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.slide.monotony.name=Glissé : un seul sens sur
recognition.technique.slide.monotony.tip=Quelle part du mouvement doit aller dans un seul sens pour un glissé. Plus bas : plus tolérant ; plus haut : seulement les glissés nets. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.slide.steps.name=Glissé : pas en mouvement nécessaires
recognition.technique.slide.steps.tip=Un glissé passe par des hauteurs intermédiaires : combien de pas d'analyse doivent bouger ; un saut n'en a qu'un ou deux. Plus bas : un saut peut compter ; plus haut : seulement les glissés lents. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.slide.min-duration.name=Glissé : note la plus courte
recognition.technique.slide.min-duration.tip=Une note plus courte est trop courte pour juger un glissé : incertain. Plus court : notes plus courtes jugées ; plus long : seulement les notes longues. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.slide.voiced.name=Glissé : hauteur entendue sur
recognition.technique.slide.voiced.tip=Quelle part de la note doit avoir une hauteur nette pour juger un glissé. Plus bas : jugé sur moins ; plus haut : jugé seulement sur des notes nettes. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.vibrato.depth.name=Vibrato : détecté dès la profondeur
recognition.technique.vibrato.depth.tip=De combien la hauteur doit osciller pour être appelée un vibrato. Plus bas : vibratos plus légers détectés ; plus haut : seulement les vibratos amples. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.vibrato.plain-depth.name=Vibrato : note simple sous
recognition.technique.vibrato.plain-depth.tip=Sous cette profondeur une note est dite simple ; entre les deux valeurs le résultat est incertain. Plus bas : moins de notes dites simples ; plus haut : plus de notes dites simples. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.vibrato.min-rate.name=Vibrato : vitesse la plus lente
recognition.technique.vibrato.min-rate.tip=Une oscillation plus lente n'est pas un vibrato. Plus bas : oscillations lentes comptées ; plus haut : seulement les vibratos rapides. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.vibrato.max-rate.name=Vibrato : vitesse la plus rapide
recognition.technique.vibrato.max-rate.tip=Une oscillation plus rapide n'est pas un vibrato (un trille ou du bruit). Plus bas : seulement les vibratos modérés ; plus haut : oscillations rapides comptées. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.vibrato.min-duration.name=Vibrato : note la plus courte
recognition.technique.vibrato.min-duration.tip=Une note plus courte est trop courte pour juger un vibrato : incertain. Plus court : notes plus courtes jugées ; plus long : seulement les notes longues. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.vibrato.voiced.name=Vibrato : hauteur entendue sur
recognition.technique.vibrato.voiced.tip=Quelle part de la note doit avoir une hauteur nette pour juger un vibrato. Plus bas : jugé sur moins ; plus haut : jugé seulement sur des notes nettes. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.legato.start-window.name=Legato : début examiné
recognition.technique.legato.start-window.tip=Quelle part du début d'une note est examinée pour une attaque au médiator. Plus court : seulement le tout début ; plus long : un début plus long. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.legato.picked-rise.name=Legato : attaqué au-delà d'une montée de
recognition.technique.legato.picked-rise.tip=Une montée de niveau au-delà au début dit que la corde a été attaquée. Plus bas : plus de notes dites attaquées ; plus haut : moins de notes dites attaquées. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.legato.rise.name=Legato : legato sous une montée de
recognition.technique.legato.rise.tip=Une montée de niveau en dessous au début est compatible avec un hammer-on ou un pull-off. Plus bas : plus strict ; plus haut : plus tolérant. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.frame-confidence.name=Techniques : confiance de hauteur
recognition.technique.frame-confidence.tip=À quel point une lecture de hauteur doit être sûre pour servir à une technique, en modes attente et suivi. Plus bas : plus de lectures, moins nettes ; plus haut : moins de lectures, plus nettes. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.motion.outlier.name=Techniques : hauteur parasite au-delà de
recognition.technique.motion.outlier.tip=Une lecture de hauteur plus éloignée que cela du milieu de la note (erreur d'octave, corde voisine) est écartée. Plus bas : plus de lectures écartées ; plus haut : plus de parasites gardés. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.technique.motion.min-voiced.name=Techniques : lectures nécessaires
recognition.technique.motion.min-voiced.tip=Combien de lectures de hauteur une note doit avoir avant que sa technique soit mesurée. Plus bas : notes courtes mesurées ; plus haut : seulement les notes longues. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.early-window.name=Calibration : note avant son clic
recognition.calibration.early-window.tip=Combien de temps avant un clic une note peut commencer en lui appartenant encore. Plus court : une note en avance est perdue ; plus long : une note en avance compte. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.late-window.name=Calibration : note après son clic
recognition.calibration.late-window.tip=Combien de temps après un clic une note peut commencer en lui appartenant encore (délai de la route et réaction du joueur). Plus court : une route lente n'est pas mesurée ; plus long : une route très lente est mesurée. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.pitch-patience.name=Calibration : hauteur attendue pendant
recognition.calibration.pitch-patience.tip=Combien de temps après le signalement de son attaque une note doit montrer une hauteur ; une hauteur plus tardive appartient à un autre son. Plus court : plus strict ; plus long : une hauteur lente compte encore. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.pitch-before.name=Calibration : hauteur commencée avant
recognition.calibration.pitch-before.tip=Combien de temps avant l'attaque le son à hauteur peut avoir commencé ; une note qui sonnait déjà n'est pas celle de l'attaque. Plus court : plus strict ; plus long : une note qui sonne peut compter. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.same-pitch.name=Calibration : même hauteur à moins de
recognition.calibration.same-pitch.tip=Une hauteur qui bouge de moins que cela est le même son ; davantage en commence un nouveau. Plus bas : un petit écart est une nouvelle note ; plus haut : un grand écart reste le même son. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.min-confidence.name=Calibration : confiance de hauteur
recognition.calibration.min-confidence.tip=À quel point une lecture de hauteur doit être sûre pour compter pendant la calibration. Plus bas : plus tolérant ; plus haut : plus strict. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.min-frequency.name=Calibration : hauteur la plus basse
recognition.calibration.min-frequency.tip=Une hauteur plus basse n'est pas prise pour une note. Plus bas : les notes graves comptent ; plus haut : seulement les notes plus aiguës. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.max-frequency.name=Calibration : hauteur la plus haute
recognition.calibration.max-frequency.tip=Une hauteur plus haute n'est pas prise pour une note. Plus bas : seulement les notes plus graves ; plus haut : les notes aiguës comptent. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.min-usable.name=Calibration : notes nécessaires
recognition.calibration.min-usable.tip=Combien des huit notes doivent être utilisables pour garder la calibration. Plus bas : gardée sur moins de notes ; plus haut : demande presque toutes les notes. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.outlier-deviations.name=Calibration : note écartée au-delà de
recognition.calibration.outlier-deviations.tip=Une note plus éloignée que ce nombre d'écarts usuels des autres est écartée. Plus bas : plus de notes écartées ; plus haut : moins de notes écartées. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.outlier-floor.name=Calibration : jamais écartée à moins de
recognition.calibration.outlier-floor.tip=Une note aussi proche des autres n'est jamais écartée. Plus court : un joueur régulier peut perdre des notes ; plus long : plus de notes gardées. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.unstable-spread.name=Calibration : instable au-delà de
recognition.calibration.unstable-spread.tip=Quand les notes utilisables s'étalent plus que cela, le délai n'est pas assez stable pour être gardé. Plus court : plus souvent instable ; plus long : gardée plus souvent. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.recognition-rate.name=Taux de reconnaissance gardé
recognition.calibration.recognition-rate.tip=La part du morceau de calibration qu'un profil doit reconnaître pour être enregistré sans question et affiché en vert. Plus bas : plus de profils gardés ; plus haut : seulement les très bons profils. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.calm-below.name=Calibration : calme sous
recognition.calibration.calm-below.tip=Un bruit de fond sous ce niveau est dit calme. Plus bas : moins de pièces dites calmes ; plus haut : plus de pièces dites calmes. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.loud-above.name=Calibration : bruyant au-delà de
recognition.calibration.loud-above.tip=Un bruit de fond au-dessus de ce niveau est dit bruyant. Plus bas : plus de pièces dites bruyantes ; plus haut : moins de pièces dites bruyantes. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.sound-refractory.name=Calibration : un seul son en deçà de
recognition.calibration.sound-refractory.tip=Deux sons plus proches que cela comptent pour un (les cordes d'un accord). Plus court : un accord gratté peut compter plusieurs fois ; plus long : des notes proches comptent pour une. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.calibration.sound-lead.name=Calibration : son coupé avant
recognition.calibration.sound-lead.tip=Combien de temps avant chaque son détecté commence sa part de l'enregistrement. Plus court : le tout début peut être coupé ; plus long : plus du début gardé. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.level-check.playing-confidence.name=Contrôle du niveau : confiance du jeu
recognition.level-check.playing-confidence.tip=À quel point la hauteur doit être sûre pour que le contrôle du niveau compte un instant comme joué. Plus bas : plus d'instants comptés comme joués ; plus haut : seulement le jeu net. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.level-check.required-playing.name=Contrôle du niveau : jeu nécessaire
recognition.level-check.required-playing.tip=Combien de jeu le contrôle du niveau demande avant de conclure. Plus court : conclut plus tôt ; plus long : plus sûr, plus lent. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.level-check.suboptimal-share.name=Contrôle du niveau : trop fort dès
recognition.level-check.suboptimal-share.tip=La part du jeu qui peut saturer ou être trop forte avant que l'entrée soit dite pas idéale. Plus bas : avertit plus tôt ; plus haut : n'avertit que pour beaucoup de saturation. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.input-quality.attacks.name=Entrée faible : attaques examinées
recognition.input-quality.attacks.tip=Combien d'attaques récentes donnent le niveau de jeu de l'élève avant qu'une entrée faible soit signalée. Plus bas : signalée plus tôt ; plus haut : plus stable, signalée plus tard. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.input-quality.remember.name=Entrée faible : attaques gardées pendant
recognition.input-quality.remember.tip=Combien de temps une attaque compte pour le contrôle d'entrée faible. Plus court : seulement le jeu récent ; plus long : le jeu lent compte. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.
recognition.input-quality.attack-window.name=Entrée faible : niveau d'attaque sur
recognition.input-quality.attack-window.tip=Combien de temps après chaque attaque son niveau le plus fort est lu. Plus court : seulement l'attaque elle-même ; plus long : une montée lente compte. Réglage expert : la valeur recommandée a été mesurée ; ne la changez que pour essayer.

# bouton Practice de la barre de transport (spec 002, FR-001..FR-004)
transport.practice=Practice : jouer une piste note par note
transport.practice.no-song=Practice : ouvrez d'abord un morceau
transport.practice.no-track=Practice : aucune piste de guitare avec des notes dans ce morceau (cliquer pour voir pourquoi)
transport.arcade=Arcade : jouer la piste en cours maintenant avec le dernier input
transport.arcade.no-song=Arcade : ouvrez d'abord un morceau
transport.arcade.no-track=Arcade : aucune piste avec des notes dans ce morceau (cliquer pour voir pourquoi)
practice.quickstart.waiting=En attente de votre guitare : jouez quelques notes et la pratique démarre toute seule.
practice.start.greyed.UNCHECKED=Le bouton de départ attend un son de votre guitare : jouez quelques notes pour que le niveau d'entrée soit vérifié, puis il s'active.
practice.start.greyed.UNUSABLE=Le bouton de départ attend un niveau d'entrée utilisable : voyez la ligne Niveau de l'onglet Entrée.

# gain d'entrée (spec 002, FR-060..FR-066)
practice.gain.label=Gain d'entrée
practice.gain.reset=Remise à zéro
practice.gain.suggest=Suggérer un gain
practice.gain.apply=Appliquer
practice.gain.suggestion.NONE=Jouez quelques notes et appuyez d'abord sur « Contrôler à nouveau », puis demandez une suggestion.
practice.gain.suggestion.OK=Le niveau est déjà bon : rien à changer.
