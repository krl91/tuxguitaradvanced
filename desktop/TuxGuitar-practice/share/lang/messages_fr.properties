# limites mesurées montrées à l'apprenant (spec 004 T008, T009)
practice.delay.info=Une note est reconnue environ {0} s après avoir été jouée, dans la plupart des cas en moins de {1} s (mesuré sur des enregistrements réels). Des notes plus rapprochées que {2} s environ peuvent ne pas être suivies : la pratique vous attend alors.
practice.speed-limit=↯ Une note est arrivée plus vite que la reconnaissance ne peut suivre (à moins de {0} s environ de la précédente). C'est une limite de la reconnaissance, pas une erreur de votre part : rejouez la note, un peu plus lentement.

# entrée trop faible pour une reconnaissance rapide fiable (spec 002 FR-015)
