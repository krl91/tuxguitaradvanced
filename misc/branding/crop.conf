# The rectangular crop of D2 (icon-only), in pixels of the 1254 x 1254 master. A crop with fixed coordinates, not content-aware (FR-002).
# Proposal of 2026-10-13: the whole width and the part above the wordmark. The wordmark overlaps the feet of the penguin between y = 940 and y = 975: a crop at 935 cuts the feet flat
# and shows no letter; 950 and 968 show the tops of some letters (tried and rejected as proposals); to be judged on the contact sheet. Override with CROP_H=... in the environment.
CROP_X=${CROP_X:-0}
CROP_Y=${CROP_Y:-0}
CROP_W=${CROP_W:-1254}
CROP_H=${CROP_H:-935}
